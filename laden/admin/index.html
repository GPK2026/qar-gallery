        <div id="mjRcp" style="margin-top:8px;max-height:260px;overflow:auto"></div></div>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;color:var(--ink);font-size:13.5px;font-weight:600"><input type="checkbox" id="mjQok" style="width:auto;margin-top:2px" ${j.quals_confirmed?"checked":""}> Nachweise, Gewerke und Empfänger geprüft und bestätigt <span class="muted" style="font-weight:400">(Pflicht vor dem Ausschreiben)</span></label>
      <div class="hint">Für alle Betriebe gilt zusätzlich: geprüft und freigegeben, Creditreform-Index ≤ ${m.crefo_max}.</div>
    <div>
    </div></div>
    ${!isNew?`<h3 style="margin-top:14px">Fotos</h3><div class="row" id="mjPhs"></div><label class="btn ghost sm" style="display:inline-block;margin-top:6px;cursor:pointer">📷 Foto hinzufügen<input type="file" accept="image/*" multiple id="mjUp" style="display:none"></label>`:""}
    <div class="row" style="margin-top:16px"><button class="btn" id="mjSave">${isNew?"Als Entwurf speichern":"Speichern"}</button>${j.status!=="vergeben"&&j.status!=="erledigt"?`<button class="btn" id="mjPub" style="background:#F08C00">${j.status==="offen"?"Speichern":"Speichern & ausschreiben"}</button>`:""}<button class="btn ghost" data-close>Abbrechen</button></div>`);
  const q=s=>md.querySelector(s);
  // Nachweise: Systemvorschlag (mit Begründung) + manuelle Ergänzungen; jede Änderung hebt die Bestätigung auf
  let SUG=(j.quals_suggested||[]).map(x=>({k:x.k,why:x.why||"",src:"system"}));
  let QL=(j.qualifications||[]).map(k=>SUG.find(x=>x.k===k)||{k,why:"",src:"admin"});
  let CSUG=(j.cats_suggested||[]).map(x=>({k:x.k,why:x.why}));
  let CSEL=(j.target_cats&&j.target_cats.length?j.target_cats:CSUG.map(x=>x.k)).slice();
  let RCP=(j.invite||[]).map(x=>({...x}));
  let catsTouched=!!(j.target_cats&&j.target_cats.length&&j.id);
  const paintR=()=>{
    q("#mjCats").innerHTML=Object.entries(m.cats).filter(([k])=>CSEL.includes(k)||CSUG.some(x=>x.k===k)||true).map(([k,l])=>{ const on=CSEL.includes(k), sg=CSUG.find(x=>x.k===k);
      return `<button type="button" data-c="${k}" title="${esc(sg?sg.why:"manuell")}" style="border:1.5px solid ${on?"var(--brand)":"var(--line)"};background:${on?"var(--brand-soft)":"#fff"};border-radius:999px;padding:4px 10px;font-size:12.5px;${!on&&!sg?"opacity:.6":""}">${on?"✓ ":""}${esc(l)}${sg?" ·&nbsp;<small>System</small>":""}</button>`; }).join("");
    q("#mjCats").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ const k=b.dataset.c; CSEL=CSEL.includes(k)?CSEL.filter(x=>x!==k):[...CSEL,k]; catsTouched=true; unconfirm(); paintR(); resug(true,true); });
    const nSel=RCP.filter(x=>x.selected).length;
    q("#mjRcp").innerHTML=RCP.length?`<div class="muted" style="font-size:12px;margin-bottom:4px">${nSel} von ${RCP.length} ausgewählt · <a href="#" id="mjRall">alle Berechtigten</a> · <a href="#" id="mjRnone">keine</a></div>`+RCP.map((x,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line);margin:0;font-weight:500;color:var(--ink);${x.type==="provider"&&!x.eligible?"opacity:.6":""}"><input type="checkbox" data-r="${i}" ${x.selected?"checked":""} ${x.type==="provider"&&!x.eligible?"disabled":""} style="width:auto;margin-top:3px"><div style="min-width:0"><b style="font-size:13px">${esc(x.name||"–")}</b> <span class="badge ${x.type==="provider"?(x.eligible?"":"off"):"amber"}" style="font-size:10.5px">${x.type==="provider"?(x.eligible?"Betrieb":"nicht berechtigt"):"Einladung"}</span><div class="muted" style="font-size:12px">${esc(x.why||"")}${x.email?" · "+esc(x.email):""}</div></div></label>`).join("")
      :'<div class="muted" style="font-size:13px">Noch keine passenden Betriebe oder Kontakte. Der Auftrag erscheint trotzdem öffentlich – registrierte Betriebe der Gewerke werden informiert, sobald sie freigegeben sind.</div>';
    q("#mjRcp").querySelectorAll("[data-r]").forEach(c=>c.onchange=()=>{ RCP[+c.dataset.r].selected=c.checked; unconfirm(); paintR(); });
    if(q("#mjRall")) q("#mjRall").onclick=e=>{ e.preventDefault(); RCP.forEach(x=>x.selected=x.type==="provider"?x.eligible:x.selected); unconfirm(); paintR(); };
    if(q("#mjRnone")) q("#mjRnone").onclick=e=>{ e.preventDefault(); RCP.forEach(x=>x.selected=false); unconfirm(); paintR(); };
  };
  const unconfirm=()=>{ if(q("#mjQok").checked){ q("#mjQok").checked=false; toast("Nachweise geändert – bitte erneut bestätigen"); } };
  const paintQ=()=>{ q("#mjQ").innerHTML=QL.length?QL.map((x,i)=>`<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:nowrap;align-items:flex-start"><span class="badge ${x.src==="system"?"":"amber"}" style="flex:none">${x.src==="system"?"System":"Admin"}</span><div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(mkCL(x.k))}</b>${x.why?`<div class="muted" style="font-size:12px">${esc(x.why)}</div>`:""}</div><button type="button" class="btn ghost sm" data-rm="${i}" title="entfernen" style="flex:none">✕</button></div>`).join(""):'<div class="muted" style="font-size:13px">Keine besonderen Nachweise.</div>';
    q("#mjQ").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ QL.splice(+b.dataset.rm,1); unconfirm(); paintQ(); });
    const opts=[...Object.keys(m.certs),...Object.keys(m.brands||{}).map(b=>"hersteller:"+b),...Object.keys(m.software||{}).map(x=>"software:"+x)].filter(k=>!QL.some(x=>x.k===k));
    q("#mjQadd").innerHTML=`<option value="">Nachweis hinzufügen …</option>`+opts.map(k=>`<option value="${esc(k)}">${esc(mkCL(k))}</option>`).join(""); };
  q("#mjQaddB").onclick=()=>{ const k=q("#mjQadd").value; if(!k) return; QL.push(SUG.find(x=>x.k===k)||{k,why:"manuell ergänzt",src:"admin"}); unconfirm(); paintQ(); };
  const resug=async(quiet,onlyR)=>{ try{ const cj=collect(); const r=await mapi("m_suggest",{job:{...cj,qualifications:onlyR?cj.qualifications:undefined,target_cats:catsTouched?CSEL:undefined}});
      CSUG=(r.cats_suggested||[]).map(x=>({k:x.k,why:x.why})); if(!catsTouched) CSEL=CSUG.map(x=>x.k);
      const prev=Object.fromEntries(RCP.map(x=>[x.id,x.selected])); RCP=(r.recipients||[]).map(x=>({...x,selected:x.id in prev?prev[x.id]&&(x.type!=="provider"||x.eligible):x.selected})); paintR();
      if(onlyR) return;
      SUG=(r.suggested||[]).map(x=>({k:x.k,why:x.why,src:"system"}));
      const manual=QL.filter(x=>x.src!=="system"&&!SUG.some(s=>s.k===x.k)); const before=QL.map(x=>x.k).sort().join();
      QL=[...SUG,...manual]; if(QL.map(x=>x.k).sort().join()!==before) unconfirm();
      const inv=r.inventory; q("#mjInv").innerHTML=inv?`Inventar: ${esc((inv.chargers||[]).map(c=>`${c.label}: ${c.brand?(m.brands||{})[c.brand]||c.brand:"Hersteller ?"} ${c.kw?c.kw+" kW":""}`).join(" · ")||"keine Charger")}${inv.cpms?` · Backend ${esc(inv.cpms)}${inv.ocpp?" (OCPP "+esc(inv.ocpp)+")":""}`:" · Backend nicht hinterlegt"}${inv.payment?` · Terminal ${esc(inv.payment)}`:""}`:"Kein Projekt gewählt – Hardware/Software fließen nicht ein.";
      paintQ(); if(!quiet) toast("Vorschlag aktualisiert"); }catch(e){ toast(e.message,true); } };
  q("#mjRe").onclick=()=>resug(false);
  ["#mjS","#mjC"].forEach(id=>q(id).addEventListener("change",()=>resug(true)));
  paintQ(); paintR(); setTimeout(()=>resug(true),0);
  q("#mjWm").querySelectorAll("button").forEach(b=>b.onclick=()=>{ q("#mjWm").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); const fix=b.dataset.m==="fix"; q("#mjFixR").style.display=fix?"":"none"; q("#mjRangeR").style.display=fix?"none":""; if(fix&&!q("#mjXd").value) q("#mjXd").value=q("#mjF").value||""; });
  q("#mjS").onchange=()=>{ const s=STATIONS.find(x=>x.id===q("#mjS").value); if(s&&!q("#mjL").value){ const mm=String(s.address||"").match(/\b\d{5}\s+([^,]+)/); q("#mjL").value=mm?mm[1].trim():""; } };
  const photos=list=>{ const el=q("#mjPhs"); if(!el) return; el.innerHTML=(list.urls||[]).map((u,i)=>`<div style="position:relative"><img src="${esc(u)}" style="width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><button class="btn warn sm" data-p="${esc(list.paths[i])}" style="position:absolute;top:3px;right:3px;padding:1px 6px">✕</button></div>`).join("")||'<span class="muted" style="font-size:13px">keine Fotos</span>';
    el.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{ try{ const r=await mapi("m_photo_delete",{id:j.id,path:b.dataset.p}); photos({urls:r.photos,paths:r.paths}); }catch(e){ toast(e.message,true); } }); };
  if(!isNew){ photos({urls:j.photo_urls||[],paths:j.photos||[]});
    q("#mjUp").onchange=async()=>{ for(const f of q("#mjUp").files){ try{ const data=await mkImg(f); const r=await mapi("m_photo",{id:j.id,data}); photos({urls:r.photos,paths:r.paths}); }catch(e){ toast(e.message,true); } } }; }
  const collect=()=>({ id:j.id, source_type:j.source_type, source_ref:j.source_ref, photo_src:q("#mjPh")&&q("#mjPh").checked?j.photo_src:null,
    title:q("#mjT").value, title_public:q("#mjTP").value, description:q("#mjD").value, station_id:q("#mjS").value, location_public:q("#mjL").value, category:q("#mjC").value, price_type:q("#mjP").value,
    ...(q("#mjWm .on").dataset.m==="fix"?{exec_at:q("#mjXd").value?new Date(q("#mjXd").value+"T"+(q("#mjXt").value||"08:00")).toISOString():null,desired_from:q("#mjXd").value,desired_to:q("#mjXd").value}:{exec_at:null,desired_from:q("#mjF").value,desired_to:q("#mjTo").value}), bid_deadline:q("#mjDl").value?new Date(q("#mjDl").value).toISOString():null, price_hint:q("#mjH").value, recurring_days:q("#mjR").value,
    target_cats:typeof CSEL!=="undefined"?CSEL:(j.target_cats||[]), invite:typeof RCP!=="undefined"?RCP:(j.invite||[]),
    qualifications:typeof QL!=="undefined"?QL.map(x=>x.k):(j.qualifications||[]), quals_suggested:typeof SUG!=="undefined"?SUG.map(({k,why})=>({k,why})):(j.quals_suggested||[]), quals_confirmed:!!(q("#mjQok")&&q("#mjQok").checked) });

        const p=await mapi("m_publish",{id:r.job.id}); toast(`Ausgeschrieben ✓${p.notified?` · ${p.notified} Betrieb(e) informiert`:""}`); }
      else toast("Gespeichert ✓");
      md.remove(); MKT.tab="jobs"; if(document.querySelector('#nav button.on')?.dataset.v==="market") mkJobs(); else go("market"); if(pub) setTimeout(()=>mkJob(r.job.id),400); }catch(e){ toast(e.message,true); } };
  q("#mjSave").onclick=()=>save(false); if(q("#mjPub")) q("#mjPub").onclick=()=>save(true);
}
function mkImg(f){ return new Promise((res,rej)=>{ const img=new Image(), u=URL.createObjectURL(f); img.onload=()=>{ const s=Math.min(1,1800/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",.85)); }; img.onerror=()=>rej(new Error("Bild nicht lesbar")); img.src=u; }); }

async function mkJob(id){
  let r; try{ r=await mapi("m_job",{id}); }catch(e){ return toast(e.message,true); }
  const j=r.job, s=MK_ST[j.status]||[j.status,"off"], m=MKT.meta, open=j.status==="offen";
  const est=b=>b.price_type==="stunde"&&b.hours_est?+b.price*+b.hours_est:b.price_type==="fix"?+b.price:null;
  const bids=r.bids.slice().sort((a,b)=>(a.status==="zurueckgezogen")-(b.status==="zurueckgezogen")||(est(a)??1e9)-(est(b)??1e9));
  const md=mkModal(`<div class="row"><h2 style="margin:0;flex:1">${esc(j.title)} <span class="badge ${s[1]}">${s[0]}</span></h2><button class="btn ghost sm" data-close>✕</button></div>
    <div class="muted" style="font-size:13px;margin:4px 0 12px"><code>${esc(j.job_no)}</code> · ${esc(m.src[j.source_type]||"")}${j.source_ref?" "+esc(j.source_ref):""} · ${esc(j.location_public||"–")}${j.station_id?" · "+esc(stLabel(j.station_id)):""} · ${j.exec_at?`<b>📅 Termin ${fmtDT(j.exec_at)}</b>`:j.desired_from||j.desired_to?`📅 ${j.desired_from?"ab "+d2(j.desired_from):""}${j.desired_to?" bis "+d2(j.desired_to):""}`:"📅 nach Absprache"} · Frist ${j.bid_deadline?fmtDT(j.bid_deadline):"–"}${j.published_at?" · ausgeschrieben "+fmtDT(j.published_at):""}</div>
    <div class="row" style="margin-bottom:12px">${["entwurf","offen","abgebrochen"].includes(j.status)?`<button class="btn ghost sm" id="mkE">✏️ Bearbeiten</button>`:""}
      ${j.status!=="offen"&&["entwurf","abgebrochen"].includes(j.status)?`<button class="btn sm" id="mkP" style="background:#F08C00">📣 Ausschreiben</button>`:""}
      ${["entwurf","offen"].includes(j.status)?`<button class="btn warn sm" id="mkX">Zurückziehen</button>`:""}
      ${j.status==="offen"?`<a class="btn ghost sm" href="../auftraege/#${esc(j.job_no)}" target="_blank" rel="noopener">Öffentlich ansehen ↗</a><button class="btn ghost sm" id="mkCopy">🔗 Link kopieren</button>`:""}</div>
    ${j.status==="offen"?`<div class="card" style="background:var(--brand-soft);border-color:#bfe5d2;padding:10px 12px;font-size:13.5px">📣 <b>Ausgeschrieben.</b> Sichtbar auf der öffentlichen Auftragsseite <a href="../auftraege/" target="_blank" rel="noopener">qar.gallery/laden/auftraege/</a> (Liste für alle, Details nur für freigegebene Betriebe). Passende freigegebene Betriebe wurden per E-Mail informiert. Angebote erscheinen hier unten.</div>`:""}
    ${["entwurf","abgebrochen"].includes(j.status)?`<div class="card" style="background:#f8faf9;padding:12px 14px" id="mkQc"><b>🎓 Erforderliche Nachweise</b> <span class="muted" style="font-size:12.5px">– vor dem Ausschreiben bestätigen</span>
      <div style="margin:8px 0">${(j.qualifications||[]).map(k=>{ const w=(j.quals_suggested||[]).find(x=>x.k===k); return `<div style="padding:4px 0;border-top:1px solid var(--line);font-size:13px"><b>${esc(mkCL(k))}</b>${w&&w.why?`<div class="muted" style="font-size:12px">${esc(w.why)}</div>`:""}</div>`; }).join("")||'<span class="muted">keine besonderen Nachweise</span>'}</div>
      <div style="font-size:13px;margin:6px 0"><b>📨 Gewerke:</b> ${(j.target_cats||[]).map(c=>esc((m.cats||{})[c]||c)).join(", ")||(j.category?esc((m.cats||{})[j.category]||j.category):"alle")}<br><b>Empfänger:</b> ${(j.invite||[]).filter(x=>x.selected).length?(j.invite||[]).filter(x=>x.selected).map(x=>esc(x.name)+(x.type==="contact"?" (Einladung)":"")).join(", "):"alle freigegebenen Betriebe der Gewerke"}</div>
      <label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:13.5px;font-weight:600;margin:0"><input type="checkbox" id="mkQok" style="width:auto;margin-top:2px" ${j.quals_confirmed?"checked":""}> Nachweise, Gewerke und Empfänger geprüft und bestätigt</label>
      <div class="hint">Ändern über „✏️ Bearbeiten“. Nach dem Ausschreiben erscheint der Auftrag auf <b>qar.gallery/laden/auftraege/</b>.</div></div>`:""}

        <td>${open&&b.status==="abgegeben"?`<button class="btn sm" data-aw="${esc(b.id)}" data-el="${p.eligible.ok?1:0}">Zuschlag</button>`:`<span class="badge ${bs[1]}">${bs[0]}</span>`}</td></tr>`; }).join("")

    <div id="mkAwOut"></div>

    ${j.status==="vergeben"?`<div class="card" style="margin-top:14px;background:#f8faf9"><h3 style="margin-top:0">Abschluss & Bewertung</h3><div class="row" style="gap:16px">${[["quality","Qualität"],["punctuality","Termintreue"],["communication","Kommunikation"]].map(([k,l])=>`<label style="margin:0">${l}<select data-r="${k}" style="width:auto;margin-top:4px">${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select></label>`).join("")}</div>

  const q=s=>md.querySelector(s), reload=()=>{ md.remove(); if(MKT.tab==="jobs"&&$("#mkBody")) mkJobs(); };

  if(q("#mkCopy")) q("#mkCopy").onclick=()=>{ const u=new URL("../auftraege/#"+j.job_no,location.href).href; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("Link kopiert")).catch(()=>prompt("Link zum Auftrag:",u)); };
  if(q("#mkP")) q("#mkP").onclick=async()=>{

      const p=await mapi("m_publish",{id:j.id}); toast(`Ausgeschrieben ✓ · ${p.notified||0} Betrieb(e) informiert${p.invited?` · ${p.invited} Einladung(en)`:""}`); md.remove(); mkJob(j.id); if($("#mkBody")&&MKT.tab==="jobs") mkJobs(); }catch(e){ toast(e.message,true); } };
  if(q("#mkX")) q("#mkX").onclick=async()=>{ if(!confirm("Auftrag zurückziehen? Bieter werden informiert.")) return; try{ await mapi("m_cancel",{id:j.id}); toast("Zurückgezogen"); reload(); }catch(e){ toast(e.message,true); } };

    else if(!confirm(`Zuschlag an ${bid.provider.company} für ${bid.price_type==="stunde"?mkEur(bid.price)+"/h":mkEur(bid.price)+" pauschal"}?\n\nDabei passiert automatisch:\n• Kontakt (Firma + Ansprechpartner) wird angelegt bzw. ergänzt\n• Service-Zugang mit PIN nur für dieses Projekt\n• Zuordnung zu ${m.src[j.source_type]} und ein Termin\n• E-Mail mit Zuschlag und PIN an den Betrieb, Absagen an die anderen`)) return;

      q("#mkAwC").onclick=()=>{ md.remove(); CF.cluster="service"; CF.q=bid.provider.company; go("customers"); };
      toast("Zuschlag erteilt ✓"); }catch(e){ b.disabled=false; toast(e.message,true); } });
  if(q("#mkDone")) q("#mkDone").onclick=async()=>{ const rating={comment:q("#mkRc").value}; md.querySelectorAll("[data-r]").forEach(s=>rating[s.dataset.r]=+s.value);
    try{ await mapi("m_done",{id:j.id,rating}); toast("Erledigt ✓"); reload(); }catch(e){ if(/offene Änderung/.test(e.message)&&confirm(e.message+"\n\nTrotzdem abschließen?")){ try{ await mapi("m_done",{id:j.id,rating,force:true}); toast("Erledigt ✓"); reload(); }catch(e2){ toast(e2.message,true); } } else toast(e.message,true); } };
  const again=()=>{ md.remove(); mkJob(j.id); if($("#mkBody")&&MKT.tab==="jobs") mkJobs(); };
  if(q("#mkCh")) q("#mkCh").onclick=()=>mkChangeDlg(j,r,again);
  md.querySelectorAll("[data-chw]").forEach(b=>b.onclick=async()=>{ if(!confirm("Änderung zurückziehen? Der Betrieb wird informiert, es gilt die bisherige Fassung.")) return; try{ await mapi("m_change_withdraw",{id:b.dataset.chw}); toast("Zurückgezogen"); again(); }catch(e){ toast(e.message,true); } });
  md.querySelectorAll("[data-cod]").forEach(b=>b.onclick=async()=>{ const c=r.changes.find(x=>x.id===b.dataset.cod), ok=b.dataset.ok==="1";
    let amount, note;
    if(ok){ const a=prompt(`Nachtrag ${c.change_no} freigeben.\nBetrag (angemeldet ${mkEur(c.amount)}) – bei Bedarf anpassen:`, c.amount!=null?String(c.amount).replace(".",","):""); if(a===null) return; amount=a; note=prompt("Hinweis an den Betrieb (optional):","")||""; }
    else { note=prompt(`Nachtrag ${c.change_no} ablehnen – Begründung (geht an den Betrieb):`,""); if(!note) return; }
    try{ await mapi("m_co_decide",{id:c.id,approve:ok,amount,note}); toast(ok?"Freigegeben ✓ · Betrieb informiert":"Abgelehnt · Betrieb informiert"); again(); }catch(e){ toast(e.message,true); } });
}

const CH_ST={offen:["wartet auf Betrieb","warn"],bestaetigt:["bestätigt",""],abgelehnt:["abgelehnt","warn"],zurueckgezogen:["zurückgezogen","off"],angemeldet:["zur Freigabe","warn"],freigegeben:["freigegeben",""]};
function mkCoCard(r){
  const co=r.co||{}, cl=r.changes||[], j=r.job, fd=r.ch_fields||{}, sv=(k,v)=>v==null||v===""?"–":k==="exec_at"?fmtDT(v):/^desired_/.test(k)?d2(v):k==="description"?String(v).slice(0,160)+(String(v).length>160?" …":""):String(v);
  return `<div class="card" style="margin-top:14px"><div class="row"><h3 style="margin:0;flex:1">📑 Änderungen & Nachträge <small class="muted">Vertragsstand v${j.version||1}</small></h3>${j.status==="vergeben"?`<button class="btn ghost sm" id="mkCh">✏️ Änderung an Betrieb senden</button>`:""}</div>
    <div class="kpis" style="margin:10px 0"><div class="kpi"><div class="k">Zuschlag</div><div class="v" style="font-size:20px">${co.base_type==="stunde"?mkEur(co.base)+"/h":mkEur(co.base)}</div></div>
      <div class="kpi"><div class="k">Nachträge freigegeben</div><div class="v" style="font-size:20px">${mkEur(co.approved)}</div><div class="s">${co.approved_n||0} Stück${co.days?` · +${co.days} Tag(e)`:""}</div></div>
      <div class="kpi ${co.pending?"bad":""}"><div class="k">Zur Freigabe</div><div class="v" style="font-size:20px">${co.pending||0}</div></div>
      ${co.contract!=null?`<div class="kpi good"><div class="k">Auftragssumme aktuell</div><div class="v" style="font-size:20px">${mkEur(co.contract)}</div></div>`:""}</div>
    <div class="hint" style="margin-bottom:8px">Änderungen gelten erst, wenn der Betrieb sie bestätigt hat. Mehrkosten muss der Betrieb <b>vor der Ausführung</b> als Nachtrag anmelden (§ 2 Abs. 6 VOB/B). Bis ${mkEur(co.limit)} (Schwelle: ${mkEur(co.limit_eur)} bzw. ${co.limit_pct} % des Pauschalpreises) wird automatisch freigegeben, darüber, bei Mehrzeit oder nachträglicher Anzeige entscheidet ihr hier.</div>
    ${cl.length?cl.map(c=>{ const st=CH_ST[c.status]||[c.status,"off"];
      return `<div style="border-top:1px solid var(--line);padding:10px 0"><div class="row" style="gap:8px"><b style="flex:1">${c.kind==="nachtrag"?"📝 Nachtrag":"✏️ Änderung"} <code>${esc(c.change_no)}</code> · ${esc(c.title||"")}</b><span class="badge ${st[1]}">${st[0]}</span></div>
        <div class="muted" style="font-size:12.5px">${fmtDT(c.created_at)} · ${esc(c.created_by||"")}${c.basis_label?" · "+esc(c.basis_label):""}${c.decided_at&&c.status!=="offen"&&c.status!=="angemeldet"?` · entschieden ${fmtDT(c.decided_at)} von ${esc(c.decided_by||"")}`:""}</div>
        ${Object.keys(c.changes||{}).length?`<table class="mini" style="margin:6px 0">${Object.entries(c.changes).map(([k,v])=>`<tr><td class="muted">${esc(fd[k]||k)}</td><td style="text-decoration:line-through;color:#999">${esc(sv(k,v.from))}</td><td><b>${esc(sv(k,v.to))}</b></td></tr>`).join("")}</table>`:""}
        ${c.description?`<div style="font-size:13.5px;white-space:pre-wrap;margin:4px 0">${esc(c.description)}</div>`:""}
        <div style="font-size:13.5px">${c.amount!=null?`Betrag: <b>${c.amount>0?"+":""}${mkEur(c.amount)}</b>${c.approved_amount!=null&&+c.approved_amount!==+c.amount?` → freigegeben <b>${mkEur(c.approved_amount)}</b>`:""}`:""}${c.time_days?` · Zeit: <b>${c.time_days>0?"+":""}${c.time_days} Tag(e)</b>`:""}
          ${c.kind==="nachtrag"&&c.before_execution===false?` <span class="badge warn">⚠ nach Ausführung angezeigt</span>`:""}${c.attachment_url?` · <a href="${esc(c.attachment_url)}" target="_blank" rel="noopener">📎 Anhang</a>`:""}</div>
        ${c.decision_note?`<div class="hint">${c.kind==="aenderung"?"Betrieb":"Entscheidung"}: ${esc(c.decision_note)}</div>`:""}
        <div class="row" style="margin-top:6px;gap:6px">${c.kind==="aenderung"&&c.status==="offen"?`<button class="btn ghost sm" data-chw="${esc(c.id)}">Zurückziehen</button>`:""}
          ${c.kind==="nachtrag"&&c.status==="angemeldet"?`<button class="btn sm" data-cod="${esc(c.id)}" data-ok="1">✓ Freigeben</button><button class="btn warn sm" data-cod="${esc(c.id)}" data-ok="0">Ablehnen</button>`:""}
          ${c.kind==="nachtrag"&&c.status==="freigegeben"&&!c.needs_approval?`<button class="btn ghost sm" data-cod="${esc(c.id)}" data-ok="0" title="Automatisch freigegebenen Nachtrag doch ablehnen">Ablehnen</button>`:""}</div></div>`; }).join("")
      :`<div class="muted" style="font-size:13.5px">Noch keine Änderungen oder Nachträge.</div>`}</div>`;
}
function mkChangeDlg(j,r,done){
  const d=mkModal(`<div class="row"><h2 style="margin:0;flex:1">✏️ Änderung an ${esc((r.bids.find(b=>b.status==="angenommen")||{}).provider?.company||"Betrieb")}</h2><button class="btn ghost sm" data-close>✕</button></div>
    <div class="hint" style="margin:6px 0 12px">Die Änderung wird dem Betrieb zur Bestätigung geschickt. Bis dahin gilt die bisherige Fassung (v${j.version||1}). Nur geänderte Felder werden übernommen.</div>
    <div class="grid2"><label>📅 Fester Ausführungstermin – Datum<input type="date" id="cgXd" value="${j.exec_at?isoD(j.exec_at):""}"></label><label>Uhrzeit<input type="time" id="cgXt" value="${j.exec_at?new Date(j.exec_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}"></label></div>
    <div class="grid2"><label>oder Zeitraum: ab<input type="date" id="cgF" value="${esc(j.desired_from||"")}"></label><label>bis<input type="date" id="cgT" value="${esc(j.desired_to||"")}"></label></div>
    <label>Ort (öffentlich)<input id="cgL" value="${esc(j.location_public||"")}"></label>
    <label>Leistungsbeschreibung<textarea id="cgD" rows="5">${esc(j.description||"")}</textarea></label>
    <div class="grid2"><label>Vergütung ± € <small class="muted">(optional, z. B. bei Wegfall)</small><input id="cgA" inputmode="decimal" placeholder="0"></label><label>Ausführungszeit ± Tage<input id="cgZ" type="number" placeholder="0"></label></div>
    <label>Begründung * <small class="muted">(geht an den Betrieb)</small><textarea id="cgN" rows="2" placeholder="z. B. Standort erst ab 20.11. zugänglich"></textarea></label>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="cgS">Zur Bestätigung senden</button></div>`);
  const g=s=>d.querySelector(s);
  g("#cgS").onclick=async()=>{ g("#cgS").disabled=true;
    try{ await mapi("m_change",{id:j.id,note:g("#cgN").value,amount:g("#cgA").value,time_days:g("#cgZ").value?+g("#cgZ").value:undefined,
        changes:{exec_at:g("#cgXd").value?new Date(g("#cgXd").value+"T"+(g("#cgXt").value||"08:00")).toISOString():"",desired_from:g("#cgF").value,desired_to:g("#cgT").value,location_public:g("#cgL").value,description:g("#cgD").value}});
      toast("Änderung gesendet ✓ · wartet auf Bestätigung"); d.remove(); done(); }catch(e){ g("#cgS").disabled=false; toast(e.message,true); } };
}

async function mkProviders(){
  $("#mkFil").innerHTML=`<div class="seg" id="mkPs">${[["","Alle"],["neu","Zu prüfen"],["geprueft","Freigegeben"],["gesperrt","Gesperrt"]].map(([k,l])=>`<button data-s="${k}" class="${MKT.pstatus===k?"on":""}">${l}</button>`).join("")}</div>`;

    ${r.providers.length?r.providers.map(p=>{ const s=MK_PST[p.status]||[p.status,"off"], cv=(p.certs||[]).filter(c=>c.verified).length;

        <td>${(p.categories||[]).map(c=>`<span class="badge off" style="margin:1px">${esc(r.cats[c]||c)}</span>`).join("")||"–"}</td>
        <td>${cv}/${(p.certs||[]).length} geprüft${(p.certs||[]).length>cv?' <span class="badge amber">neu</span>':""}</td>
        <td>${p.crefo_index!=null?`<b style="color:${p.crefo_index<=r.crefo_max?"#08603d":"#b42318"}">${p.crefo_index}</b> <small class="muted">${p.crefo_checked_at?d2(p.crefo_checked_at):""}</small>`:`<small class="muted">${p.crefo_no?"Nr. "+esc(p.crefo_no):"–"}</small>`}</td>
        <td>${mkStars(p.rating)}</td><td>${p.bids}${p.won?` · <b>${p.won} ✓</b>`:""}</td><td><span class="badge ${s[1]}">${s[0]}</span></td>
        <td>${p.eligible.ok?'<span class="badge">✓ ja</span>':`<span class="badge warn" title="${esc(p.eligible.why.join(" · "))}">✗ nein</span>`}</td></tr>`; }).join("")
      :`<tr><td colspan="8" class="muted">Keine Betriebe${MKT.pstatus?" in diesem Status":""}. Betriebe registrieren sich selbst über die <a href="../auftraege/" target="_blank" rel="noopener">öffentliche Seite</a>.</td></tr>`}</tbody></table></div>`;
  $("#mkBody").querySelectorAll("tr.click").forEach(t=>t.onclick=()=>mkProv(t.dataset.id));

async function mkProv(id){
  let r; try{ r=await mapi("m_provider",{id}); }catch(e){ return toast(e.message,true); }
  const p=r.provider, m=MKT.meta, today=new Date().toISOString().slice(0,10);
  const md=mkModal(`<div class="row"><h2 style="margin:0;flex:1">${esc(p.company)} <span class="badge ${(MK_PST[p.status]||["","off"])[1]}">${(MK_PST[p.status]||[p.status])[0]}</span></h2><button class="btn ghost sm" data-close>✕</button></div>
    <div class="grid2c" style="margin-top:12px"><div>
      <dl><dt>Ansprechpartner</dt><dd>${esc(p.contact_name||"–")}</dd><dt>Kontakt</dt><dd>${esc(p.email)} · ${esc(p.phone||"–")}</dd><dt>Adresse</dt><dd>${esc([p.street,[p.zip,p.city].filter(Boolean).join(" ")].filter(Boolean).join(", ")||"–")}</dd>
        <dt>Rechtsform / USt-Id</dt><dd>${esc(p.legal_form||"–")} · ${esc(p.vat_id||"–")}</dd><dt>Website</dt><dd>${p.website?`<a href="${esc(/^https?:/.test(p.website)?p.website:"https://"+p.website)}" target="_blank" rel="noopener noreferrer">${esc(p.website)}</a>`:"–"}</dd>

const SAPI="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-sim";
async function sapi(action,payload={}){
  const r=await fetch(SAPI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ logout(); throw new Error("Bitte neu anmelden"); }
  if(!r.ok){ const e=new Error(j.error||("Fehler "+r.status)); e.data=j; throw e; }
  return j;
}

async function simRun(id,autostart){

async function simPull(id){
  const r=await sapi("run",{id:id||SIMV.run.id,after:SIMV.after});
  SIMV.run=r.run; if(r.log.length){ SIMV.log.push(...r.log); SIMV.after=r.log[r.log.length-1].id; }
  return r.log.length;
}
async function simLoop(){
  if(SIMV.loop) return; SIMV.loop=true; simPaint();
  const id=SIMV.run.id;
  while(SIMV.loop&&SIMV.run&&SIMV.run.id===id&&SIMV.run.status==="laeuft"&&document.querySelector("#simLog")){
    try{ const st=await sapi("step",{id}); if(st.busy) await new Promise(r=>setTimeout(r,3000)); }catch(e){ toast(e.message,true); await new Promise(r=>setTimeout(r,4000)); }

    if(!document.querySelector("#simLog")) break; simPaint();
  }
  SIMV.loop=false; if(document.querySelector("#simLog")) simPaint();
}

/* Neue Version erkennen (offene Tabs mit altem Stand) */
(function(){ const mine=(document.querySelector('meta[name=build]')||{}).content; let shown=false;
  const chk=()=>fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{ const m=t.match(/<meta name="build" content="([^"]+)"/); if(m&&mine&&m[1]!==mine&&!shown){ shown=true;
    const b=document.createElement("div"); b.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#14201b;color:#fff;padding:10px 14px;border-radius:12px;z-index:99;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)";
    b.innerHTML='Neue Version verfügbar <button style="background:#F08C00;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer">Neu laden</button>'; b.querySelector("button").onclick=()=>location.reload(); document.body.appendChild(b); } }).catch(()=>{});
  setInterval(chk,5*60_000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) chk(); });
})();
</script>
</body>
</html>
