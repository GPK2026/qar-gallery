<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--muted:#5d6b65;--line:#e1e6e3;--brand:#0a8f5a;--brand-soft:#e3f4ec;--warn:#b42318;--warn-soft:#fdecea;--amber:#9a6700;--amber-soft:#fff6db;--orange:#F08C00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .in{max-width:1180px;margin:0 auto;padding:10px 20px;min-height:57px;box-sizing:border-box;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo svg{width:22px;height:28px}
.logo small{font-weight:500;color:var(--muted);margin-left:6px}
/* ── Navigation: Seitenleiste (Desktop) / Schublade (Tablet & Handy) ── */
#nav{position:fixed;top:0;left:0;bottom:0;width:232px;background:#fff;border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column;gap:1px;padding:0 10px 16px;overflow-y:auto;scrollbar-width:thin}
#nav.hidden{display:none}
#nav .nhead{display:flex;align-items:center;gap:9px;height:57px;padding:0 6px;margin:0 -10px 6px;padding-left:16px;border-bottom:1px solid var(--line);font-size:14.5px;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
#nav .nhead svg{width:18px;height:23px;flex:none}#nav .nhead b{flex:1}
#nav .nclose{display:none;background:none;border:0;font-size:18px;padding:6px 8px;border-radius:8px;color:var(--muted);cursor:pointer}
#nav .ng{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#8a9690;margin:14px 10px 4px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:9px;color:#3c4a44;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;line-height:1.2}
#nav button .ni{width:20px;text-align:center;font-size:15px;flex:none}
#nav button:hover{background:#f3f6f4}
#nav button.on{background:var(--brand-soft);color:#08603d}
body.authed{padding-left:232px}
/* Feststehende Kopfbereiche (Titel, Filter, Kennzahlen) auf Listen-Seiten */
.nb{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.nb-chips{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 8px;border-bottom:1px solid var(--line);scrollbar-width:none}.nb-chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}.nb-chips button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.nb-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}.nb-row:last-child{border-bottom:0}.nb-ic{flex:none;width:36px;height:36px;border-radius:50%;background:#f1f5f3;display:grid;place-items:center;font-size:18px}.nb-m{flex:1;min-width:0}.nb-n{font-weight:600;font-size:14px}.nb-s{color:var(--muted);font-size:12.5px}.nb-o{font-size:12.5px;margin-top:2px}.nb-r{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--brand);font-weight:700}.nb-x{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px}.nb-add{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;background:#f8faf9;border-top:1px solid var(--line);flex-wrap:wrap}
.mk-src{margin:8px 0}.mk-src-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid #c7d2fe;background:#f5f7ff;border-radius:12px;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:13.5px;margin-bottom:6px}.mk-src-a:hover{border-color:#6366f1}.mk-src-go{margin-left:auto;color:#3730a3;font-weight:600}
.kpi.on{outline:2px solid var(--brand);outline-offset:-2px}.kpi.good .v{color:var(--brand)}
.pinned{position:sticky;z-index:4;box-shadow:0 0 0 7px var(--bg)}
.pinned:not(.card){background:var(--bg)}
#main.haspin .card:has(> table){overflow:visible!important}
#main.haspin .card > table > thead th{position:sticky;top:var(--pinb);z-index:3;background:#f7f9f8;box-shadow:0 1px 0 var(--line)}
.pinned.pinlast{box-shadow:0 0 0 7px var(--bg),0 16px 14px -12px rgba(20,32,27,.22)}
/* Übersicht: links Projekte, rechts Kennzahlen & Grafiken */
.ov-split{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:16px;align-items:start}
.ov-left{position:sticky;top:72px;max-height:calc(100vh - 86px);overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.ov-left .grid{grid-template-columns:1fr;gap:10px}

.ov-right{min-width:0}
/* Desktop: Kopf, Filter & Projekte stehen – nur die rechte Spalte scrollt */
.ov-split.fit{align-items:stretch}
.ov-split.fit .ov-left{position:static;max-height:none;height:100%;overflow-y:auto}
.ov-split.fit .ov-right{height:100%;overflow-y:auto;scrollbar-width:thin;padding-right:6px;overscroll-behavior:contain}
.ov-right .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}

.ov-left #newTile{min-height:0!important;padding:14px!important;flex-direction:row;gap:8px}
.ov-left .pcard{margin-bottom:0}
body.authed #gs{width:100%;max-width:none}
@media (max-width:1000px){ .ov-split{grid-template-columns:1fr} .ov-left{position:static;max-height:none;overflow:visible} .ov-left .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))} }
body.authed header .sp{display:none} body.authed #gsF{flex:1;max-width:560px;margin-right:auto}
@media (max-width:760px){ #simTg .t{display:none} }
.navbtn{display:none;background:none;border:1px solid var(--line);border-radius:10px;font-size:19px;width:40px;height:38px;line-height:1;cursor:pointer;flex:none;color:var(--ink)}

}

/* ── Responsive: Tablet & Smartphone ── */
@media (max-width:1100px){
  header .in{flex-wrap:wrap;row-gap:8px}

}
@media (max-width:760px){
  body{font-size:14.5px}
  header .in{padding:10px 12px;gap:10px}
  .logo{font-size:15px}.logo small{display:none}
  #gsF{order:5;flex-basis:100%}
  .wrap{padding:12px 10px}
  .card{padding:14px 12px;border-radius:12px}
  h1{font-size:19px}
  .sub{font-size:13.5px}
  /* Kopfzeilen mit Aktionen umbrechen, Buttons griffig */
  #main>.row,.card>.row,#fbody>.row{flex-wrap:wrap}
  #main>.row>div:first-child{flex-basis:100%}
  .btn{padding:10px 14px}.btn.sm{padding:8px 11px}
  /* Formulare & Raster einspaltig */
  .form{grid-template-columns:1fr}
  .form>[class^="c"],.form>[class*=" c"]{grid-column:1 / -1!important}
  #main [style*="grid-template-columns"]:not(.cal):not(.rates){grid-template-columns:1fr!important}
  .grid2{grid-template-columns:1fr!important}
  .akte-grid{grid-template-columns:1fr!important;gap:14px}
  .kpis,.isum{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi .v,.isum-t .v{font-size:22px}
  .rates{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .stats{flex-wrap:wrap;gap:10px}
  /* Filterleisten: Felder volle Breite, Segmente scrollbar */
  .card .row>select,.card .row>input[type=search],.card .row>input:not([type=checkbox]):not([type=radio]):not([type=date]){width:100%!important;flex:1 1 100%!important;min-width:0!important}
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap}
  .dates{width:100%}.dates input[type=date]{flex:1;min-width:0}
  /* Tabellen: horizontal wischen statt quetschen */
  .card[style*="overflow:auto"],.card[style*="overflow: auto"]{-webkit-overflow-scrolling:touch}
  #main table{font-size:13px}
  #main th,#main td{padding:8px 6px}
  #main table:not(.mini) td{min-width:0}
  #main table:not(.mini){min-width:640px}
  .akte-in{padding:10px 4px}
  .akte-in table,.akte-in table:not(.mini){min-width:0}
  /* Termine */
  .tm-row{padding:10px 12px;gap:8px;flex-wrap:wrap}.tm-d{width:auto;flex-direction:row;gap:6px}.tm-m{flex-basis:100%;order:3}.tm-s{margin-left:auto}
  .cal-c{min-height:58px;padding:2px}.cal-n{font-size:11.5px}
  /* Projekt-Editor & Galerie */
  .gi{width:calc(50% - 5px);height:90px}.gi.hero{width:100%;height:160px}
  .ed-media{grid-template-columns:1fr}
  .qr-card .qr img{width:130px!important}
  /* Kontakte */
  .cl-seg{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.cl-seg::-webkit-scrollbar{display:none}
  .chain{font-size:12px}
  /* Toast unten über die volle Breite */
  .toast{left:10px!important;right:10px!important;transform:none!important;max-width:none!important}
}
@media (max-width:420px){ .kpis,.isum{grid-template-columns:1fr 1fr} .kpi .k,.isum-t .k{font-size:11.5px} }
@media (max-width:760px){
  /* Aufgeklappte Akten in breiten Tabellen bleiben im sichtbaren Bereich (Tabelle wischt darunter) */
  tr.akte td>.akte-in{position:sticky;left:0;width:calc(100vw - 22px);box-sizing:border-box;padding:12px 10px}
  .akte-in dl{grid-template-columns:96px minmax(0,1fr)!important}.akte-in dl dd{margin:0 0 6px;word-break:break-word}

  .tl-bar .now{right:0}
  /* Heatmap & Stundenbalken auf Handybreite stauchen */
  .heat,.hbars{grid-template-columns:20px repeat(24,minmax(0,1fr));gap:1px}
  .heat .hx{font-size:8px;overflow:hidden}.heat i{font-size:0;height:20px}.heat .hp{font-size:9px;overflow:hidden;white-space:nowrap}
  .heat .hl,.hbars .hl{font-size:10px}
  /* Kosten-Balken */
  .cb-row{grid-template-columns:72px minmax(0,1fr);font-size:12px}.cb-row>:nth-child(3){grid-column:1 / -1;text-align:left!important;color:var(--muted)}

  .modal{padding:8px 6px}.modal .card{padding:14px 12px}
  .grid2c{grid-template-columns:minmax(0,1fr)!important}.grid2c>*{min-width:0}
  .modal .row{flex-wrap:wrap}.modal .row>select,.modal .row>input{min-width:0;max-width:100%}
  table.mini{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .modal .row>div{flex:1 1 140px!important;min-width:0}
  .modal dl{grid-template-columns:118px minmax(0,1fr)!important}
  #mkFil{max-width:100%;min-width:0}
  #main>.row>a.btn,#main>.row>button.btn{flex:1 1 auto}
  /* Lange Wörter/Adressen nicht über den Rand */
  .card,.kpi,dd{overflow-wrap:break-word}

}

<body>
<header><div class="in">
  <button class="navbtn hidden" id="navBtn" aria-label="Menü öffnen" title="Menü">☰</button>
  <div class="logo"><svg viewBox="190 90 800 1000"><polygon points="699,118 262,679 556,679 479,1062 916,501 622,501" fill="#F08C00"/></svg>HAPPY CHARGING Support <small>Betreiber</small></div>
  <div class="curT" id="curT"></div>

  <div class="sp"></div>
  <form id="gsF" class="hidden" autocomplete="off"><input id="gs" type="search" placeholder="🔎 Alles durchsuchen …" title="Volltextsuche: Vorgangsnummer, E-Mail, Telefon, Ladekarte, EVSE-ID, Chat, Beschreibung, Notizen …"></form>
  <button class="btn ghost sm hidden" id="simTg" title="Daten aus Simulationen (Test-Agenten) ein- oder ausblenden">🧪 <span class="t">SIM</span></button>
  <button class="btn ghost sm hidden" id="logout">Abmelden</button>
</div></header>
<div id="navBg" class="navbg"></div>
<nav id="nav" class="hidden" aria-label="Hauptmenü"><div class="nhead"><svg viewBox="190 90 800 1000"><polygon points="699,118 262,679 556,679 479,1062 916,501 622,501" fill="#F08C00"/></svg><b>HAPPY CHARGING</b><button class="nclose" id="navX" aria-label="Menü schließen">✕</button></div><button class="on" data-v="overview"><span class="ni">📊</span>Übersicht</button><div class="ng">Betrieb</div><button data-v="projects"><span class="ni">📍</span>Projekte</button><button data-v="incidents"><span class="ni">⚡</span>Störungen</button><button data-v="defects"><span class="ni">🛠️</span>Mängel</button><button data-v="tickets"><span class="ni">📱</span>QR-Code-Aufrufe</button><div class="ng">Service & Aufträge</div><button data-v="termine"><span class="ni">📅</span>Termine</button><button data-v="field"><span class="ni">✅</span>Maintenance & Actions</button><button data-v="market"><span class="ni">🤝</span>Auftragsbörse</button><div class="ng">Kontakte</div><button data-v="customers"><span class="ni">👥</span>Kontakte</button><div class="ng">System</div><button data-v="sim"><span class="ni">🧪</span>Simulation</button><button data-v="settings"><span class="ni">⚙️</span>Einstellungen</button></nav>
<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>

<script>
const API="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-admin";
const APP="https://qar.gallery/laden/";
const IMG=id=>`https://xsyuhfleesstrchcwspg.supabase.co/storage/v1/object/public/charge-public/stations/${encodeURIComponent(id)}.jpg`;
const TYPES=["CCS","CHAdeMO","MCS","Typ 2","Typ 2 (Kabel)","Schuko","Tesla"];
const $=s=>document.querySelector(s), main=$("#main");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token=null; try{ token=sessionStorage.getItem("hc_admin"); }catch(e){}
let SIMSHOW=false; try{ SIMSHOW=sessionStorage.getItem("hc_simshow")==="1"; }catch(e){}
let STATIONS=[];

function toast(msg,err){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("err",!!err); t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2800); }
const FAPI="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-field";
async function fapi(action,payload={}){
  const r=await fetch(FAPI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,sim_show:SIMSHOW,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ logout(); throw new Error("Bitte neu anmelden"); }
  if(!r.ok) throw new Error(j.error||("Fehler "+r.status));
  if(j&&j.role_info) setRoleInfo(j.role_info); if(j&&j.remind!=null) REM={remind:j.remind,urgent:j.urgent}; return j;
}
async function api(action,payload={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,sim_show:SIMSHOW,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401 && action!=="login" && action!=="set_password"){ logout(); throw new Error("Bitte neu anmelden"); }
  if(!r.ok) throw new Error(j.error||("Fehler "+r.status));
  return j;
}
function logout(){ token=null; try{ sessionStorage.removeItem("hc_admin"); }catch(e){} $("#nav").classList.add("hidden"); $("#navBtn").classList.add("hidden"); document.body.classList.remove("authed"); $("#curT").textContent=""; $("#logout").classList.add("hidden"); $("#simTg").classList.add("hidden"); loginView(); }
$("#logout").onclick=logout;
document.querySelectorAll("#nav button[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
function navOpen(o){ $("#nav").classList.toggle("open",o); $("#navBg").classList.toggle("on",o); document.body.style.overflow=o&&innerWidth<=1100?"hidden":""; }
$("#navBtn").onclick=()=>navOpen(true); $("#navX").onclick=()=>navOpen(false); $("#navBg").onclick=()=>navOpen(false);
addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#nav").classList.contains("open")) navOpen(false); });
function go(v){ const tp=document.querySelector(".tip"); if(tp) tp.classList.add("hidden"); document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); navOpen(false);
  { const on=document.querySelector("#nav button.on"); $("#curT").textContent=on?on.lastChild.textContent.trim():""; } scrollTo(0,0); ({overview:overviewView,search:searchView,projects:projectsView,incidents:incidentsView,customers:customersView,field:fieldView,defects:defectsView,termine:termineView,market:marketView,tickets:ticketsView,sim:simView,settings:settingsView})[v](); }

/* ---------- Login ---------- */
function loginView(){
  main.innerHTML=`<div class="card login"><h1>Anmelden</h1><p class="sub">Betreiber-Dashboard für Projekte, Charger und Ladepunkte.</p>
  <form id="lf"><label>Passwort</label><input type="password" id="pw" autocomplete="current-password" autofocus>
  <button class="btn" style="width:100%;margin-top:12px">Anmelden</button></form></div>`;
  $("#lf").onsubmit=async e=>{ e.preventDefault();
    try{ const r=await api("login",{password:$("#pw").value}); token=r.token; try{ sessionStorage.setItem("hc_admin",token); }catch(e){} start(); }
    catch(err){ toast(err.message,true); } };
}
function simTgPaint(){ const b=$("#simTg"); b.innerHTML=SIMSHOW?'🧪 <span class="t">SIM sichtbar</span>':'🧪 <span class="t">SIM</span>'; b.style.background=SIMSHOW?"var(--amber-soft)":""; b.style.borderColor=SIMSHOW?"#f0d9a0":""; }
$("#simTg").onclick=()=>{ SIMSHOW=!SIMSHOW; try{ sessionStorage.setItem("hc_simshow",SIMSHOW?"1":"0"); }catch(e){} simTgPaint(); toast(SIMSHOW?"Simulationsdaten werden eingeblendet":"Simulationsdaten ausgeblendet"); const on=document.querySelector("#nav button.on"); go(on?on.dataset.v:"overview"); };
function start(){ $("#nav").classList.remove("hidden"); $("#navBtn").classList.remove("hidden"); document.body.classList.add("authed"); $("#gsF").classList.remove("hidden"); $("#logout").classList.remove("hidden"); $("#simTg").classList.remove("hidden"); simTgPaint(); go("overview"); }
$("#gsF").onsubmit=e=>{ e.preventDefault(); SQ.q=$("#gs").value.trim(); if(SQ.q.length>=2) go("search"); };

/* ---------- Projekte ---------- */
const lpCount=s=>(s.chargers||[]).reduce((a,c)=>a+(c.connectors||[]).length,0);
const evseMissing=s=>(s.chargers||[]).reduce((a,c)=>a+(c.connectors||[]).filter(x=>!x.evse).length,0);
async function projectsView(){
  main.innerHTML=`<div class="row" style="margin-bottom:14px"><div><h1>Projekte / Standorte</h1><p class="sub" style="margin:0">Änderungen sind sofort in der Kunden-App sichtbar.</p></div><div class="sp"></div><button class="btn" id="new">+ Neues Projekt</button></div><div class="grid" id="plist"><div class="muted">Lade …</div></div>`;
  $("#new").onclick=()=>editView(null);
  try{ STATIONS=(await api("list")).stations; }catch(e){ return toast(e.message,true); }
  $("#plist").innerHTML=projTiles();
  wireTiles($("#plist"));
}
// Projekt-Kacheln (Projekte-Seite und Übersicht) + Kachel „Neues Projekt“
function projTiles(openBy,only){ return STATIONS.map((s,i)=>{ if(only&&s.id!==only) return ""; const o=openBy?openBy[s.id]||0:0; return `<div class="card pcard" data-i="${i}">
    <div class="row"><div class="pid">${esc(s.project_id||s.id)}${(s.extras||{}).project_name?` <span class="muted" style="font-weight:600;font-size:14px">· ${esc(s.extras.project_name)}</span>`:""}</div><div class="sp"></div>${o?`<span class="badge warn">⚠ ${o} gestört</span> `:""}${s.active?`<span class="badge">aktiv</span>`:`<span class="badge off">inaktiv</span>`}</div>
    <div style="font-weight:600;margin-top:2px">${esc(s.name||"")}</div><div class="muted">${esc(s.address||"")}</div>
    <div class="row" style="margin-top:10px;gap:6px"><span class="badge amber">${(s.chargers||[]).length} Charger</span><span class="badge amber">${lpCount(s)} Ladepunkte</span>${evseMissing(s)?`<span class="badge warn">${evseMissing(s)} ohne EVSE-ID</span>`:""}</div>
    <div class="stats"><div><b>${s.stats.visits}</b>QR-Aufrufe 30 T.</div><div><b>${s.stats.tickets}</b>Meldungen</div><div><b>${s.stats.danger}</b>Gefahr</div></div>
  </div>`; }).join("")+(only?`<button class="card pcard newtile" id="allTiles" style="min-height:120px"><span>⟲</span>Alle Projekte anzeigen</button>`:"")+`<button class="card pcard newtile" id="newTile"><span>＋</span>Neues Projekt anlegen</button>`; }
function wireTiles(root){ root.querySelectorAll(".pcard[data-i]").forEach(c=>c.onclick=()=>{ document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="projects")); editView(STATIONS[+c.dataset.i]); });
  const at=root.querySelector("#allTiles"); if(at) at.onclick=()=>{ OF.station=""; const sel=$("#oSt"); if(sel) sel.value=""; loadOverview(); };
  root.querySelector("#newTile").onclick=()=>{ document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="projects")); editView(null); }; }

/* ---------- Editor ---------- */
let E=null; // Arbeitskopie
function blankStation(){ return {id:"",project_id:"",name:"",address:"",review_url:"",notify_email:"",lat:null,lng:null,active:true,chargers:[{label:"LS#1",model:"",connectors:[{t:"CCS",kw:null,evse:""},{t:"CCS",kw:null,evse:""}]}]}; }
function editView(s){
  E=s?JSON.parse(JSON.stringify(s)):blankStation(); E.original_id=s?s.id:null;
  renderEditor();
}
function renderEditor(){
  const isNew=!E.original_id, code=E.project_id||E.id;
  main.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" id="back">‹ Projekte</button><h1 style="margin:0">${isNew?"Neues Projekt":"Projekt "+esc(code)+((E.extras||{}).project_name?" · "+esc(E.extras.project_name):"")}</h1><div class="sp"></div>
    ${!isNew?`<a class="btn ghost sm" href="${APP}#${encodeURIComponent(code)}" target="_blank" rel="noopener">In App öffnen ↗</a>`:""}
    <button class="btn" id="save">Speichern</button></div>

  <div class="ed-top">
  <div class="card"><h2>Standort</h2><div class="form">
    <div class="c4"><label>Projekt-ID</label><input id="f_project_id" value="${esc(E.project_id)}" placeholder="z. B. 1295"><div class="hint">QR-Code / Link: …/laden/#ID</div></div>
    <div class="c8"><label>Projektname <span class="muted">(optional)</span></label><input id="f_pname" value="${esc((E.extras||{}).project_name||"")}" placeholder="z. B. Ladepark Kaiserdamm"><div class="hint">Erscheint neben der ID – im Dashboard und in den Apps.</div></div>
    <div class="c6"><label>Betreiber / interne Bezeichnung</label><input id="f_name" value="${esc(E.name)}"></div>
    <div class="c6"><label>Adresse (sichtbar für Kunden)</label><input id="f_address" value="${esc(E.address)}" placeholder="Straße Nr., PLZ Ort – tippen für Vorschläge"></div>
    <div class="c3"><label>Breitengrad</label><input id="f_lat" value="${E.lat??""}" inputmode="decimal"></div>
    <div class="c3"><label>Längengrad</label><input id="f_lng" value="${E.lng??""}" inputmode="decimal"></div>
    <div class="c6"><label>Abweichende Benachrichtigungs-Mail</label><input id="f_notify_email" value="${esc(E.notify_email)}" placeholder="leer = Standard-Empfänger"></div>
    <div class="c12"><label>Google-Bewertungslink</label><input id="f_review_url" value="${esc(E.review_url)}" placeholder="https://search.google.com/local/writereview?placeid=…"><div class="hint">Erscheint nach erfolgreicher Hilfe. Place-ID finden: <a href="https://developers.google.com/maps/documentation/places/web-service/place-id" target="_blank" rel="noopener">Place ID Finder</a></div></div>
    <div class="c12"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" id="f_sanitary" style="width:auto" ${(E.extras||{}).sanitary?"checked":""}> Sanitäre Einrichtungen vorhanden (Kachel „Sanitäre Einrichtungen“ in der App)</label></div>
    <div class="c12"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" id="f_active" style="width:auto" ${E.active!==false?"checked":""}> Aktiv (in der Kunden-App erreichbar)</label></div>
  </div></div>
  <div class="card"><div class="row" style="margin-bottom:4px"><h2 style="margin:0;flex:1">Weitere Standortinfos</h2><button class="btn ghost sm" id="geoBtn" type="button" title="WC, Essen, Einkaufen, Parken usw. im Umkreis der Adresse aus OpenStreetMap">🌐 Umgebung laden</button></div><p class="sub" style="margin-top:0">Erscheinen in der Kunden-App. Bei Auswahl der Adresse wird die Umgebung automatisch geladen.</p>
    <label>🅿️ Parken</label><textarea id="f_parking" rows="5" placeholder="z. B. Parken während des Ladens kostenfrei, max. 2 Std. mit Parkscheibe. Schranke öffnet automatisch.">${esc((E.extras||{}).parking_info||"")}</textarea>
    <label style="margin-top:10px">💶 Tarife</label><textarea id="f_tariff" rows="5" placeholder="z. B. Ad-hoc 0,59 €/kWh · Blockiergebühr 0,10 €/Min. ab 4 Std. · mit Ladekarte gilt der Tarif Ihres Anbieters">${esc((E.extras||{}).tariff_info||"")}</textarea>
    <label style="margin-top:10px">📍 In der Nähe</label><div id="nbBox"></div>
    <label style="margin-top:10px">ℹ️ Hinweise zum Standort</label><textarea id="f_cinfo" rows="3" placeholder="z. B. Toiletten im Autohaus (Mo–Fr 8–18 Uhr) · Ladepunkt 3 wird am 12.11. gewartet">${esc((E.extras||{}).customer_info||"")}</textarea>
  </div>
  <div class="card"><h2>Software &amp; Inventar</h2><p class="sub" style="margin-top:0">Grundlage für die automatischen Nachweis-Vorschläge der Auftragsbörse. Hersteller/Modell der Ladesäulen stehen bei den Chargern.</p>
    <div class="row" style="gap:10px"><div style="flex:1;min-width:140px"><label>Backend / CPMS</label><input id="f_cpms" value="${esc((E.extras||{}).cpms||"")}" placeholder="Suchen, z. B. Monta"></div>
      <div style="width:110px"><label>OCPP</label><select id="f_ocpp">${["","1.6J","2.0.1","2.1"].map(v=>`<option ${((E.extras||{}).ocpp||"")===v?"selected":""} value="${v}">${v||"–"}</option>`).join("")}</select></div></div>
    <div class="row" style="gap:10px;margin-top:10px"><div style="flex:1;min-width:140px"><label>Bezahlterminal</label><input id="f_payment" value="${esc((E.extras||{}).payment||"")}" placeholder="Suchen, z. B. Payter Apollo"></div>
      <div style="flex:1;min-width:140px"><label>Kommunikation</label><input id="f_comms" value="${esc((E.extras||{}).comms||"")}" placeholder="Suchen, z. B. Teltonika, Telekom M2M"></div></div>
    <h3 style="margin:16px 0 4px;font-size:15px">📦 Inventar am Standort</h3><div id="invBox"></div>
    <label style="margin-top:12px">Weitere Hinweise</label><textarea id="f_inv" rows="2" placeholder="z. B. Firmware-Stand, Seriennummern, Besonderheiten">${esc((E.extras||{}).inventory_note||"")}</textarea>
</div>
  </div>
  ${!isNew?`<div class="ed-top ed-media"><div class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Fotos</h2><span class="muted" style="font-size:13px">★ = Titelbild oben in der Kunden- und Service-App</span><div class="sp"></div>
      <input type="file" accept="image/*" multiple id="imgIn" class="hidden"><button class="btn ghost sm" id="imgUp">+ Fotos hochladen</button></div>
      <div class="gal" id="gal"><span class="muted">Lade …</span></div>
      <div class="hint">Eigene Fotos der Ladestation (Querformat). Bilder aus Google Maps dürfen nicht übernommen werden.</div></div>
    <div class="card qr-card"><h2>QR-Schild</h2><div class="qr-row" id="qrs"></div><p class="sub" style="margin:8px 0 0;font-size:12.5px">Ein Schild für den ganzen Standort – Charger und Ladepunkt wählt der Kunde in der App.</p></div></div>`:""}

  <div class="card ${CH_OPEN?"":"ch-closed"}" id="chCard"><div class="row ch-top" style="margin-bottom:10px"><button class="fold-btn" id="chFold" title="ein-/ausklappen">${CH_OPEN?"▾":"▸"}</button><h2 style="margin:0;cursor:pointer" id="chFold2">Charger & Ladepunkte</h2><span class="muted">${E.chargers.length} Charger · ${E.chargers.reduce((a,c)=>a+c.connectors.length,0)} Ladepunkte</span><div class="sp"></div>
      <button class="btn ghost sm ch-only" id="chAll">${E.chargers.every(chFolded)?"Alle aufklappen":"Alle zuklappen"}</button><button class="btn ghost sm" id="addCh">+ Charger</button></div>
    <div id="chs">${E.chargers.map((c,i)=>chargerHTML(c,i)).join("")}</div></div>

  <div class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Checklisten (Maintenance)</h2><div class="sp"></div><a href="#" id="toLists" class="muted" style="font-size:13px">Checklisten bearbeiten ›</a></div>
    <p class="sub">Welche Checklisten Techniker, Reinigung & Co. an diesem Standort in der Service-App sehen. Listen mit „alle Projekte“ sind bei neuen Projekten automatisch aktiv.</p><div id="clAssign" class="muted">Lade …</div></div>


  ${!isNew?`<div class="card"><h2>Projekt entfernen</h2><p class="sub">Hat das Projekt schon QR-Code-Aufrufe, wird es nur deaktiviert (Protokolle bleiben erhalten).</p><button class="btn warn" id="del">Projekt löschen / deaktivieren</button></div>`:""}`;
  $("#back").onclick=projectsView;
  $("#save").onclick=save;
  const tgl=()=>{ CH_OPEN=!CH_OPEN; $("#chCard").classList.toggle("ch-closed",!CH_OPEN); $("#chFold").textContent=CH_OPEN?"▾":"▸"; };
  $("#chFold").onclick=tgl; $("#chFold2").onclick=tgl;
  $("#chAll").onclick=()=>{ collect(); const v=!E.chargers.every(chFolded); E.chargers.forEach(c=>setFold(c,v)); renderEditor(); };
  $("#addCh").onclick=()=>{ collect(); E.chargers.forEach(c=>setFold(c,true)); CH_OPEN=true; const n=E.chargers.length+1; E.chargers.push({label:"LS#"+n,model:"",connectors:[{t:"CCS",kw:null,evse:""},{t:"CCS",kw:null,evse:""}]}); setFold(E.chargers[E.chargers.length-1],false); renderEditor(); };
  wireChargers(); fillClAssign(isNew);
  if($("#f_address")) geoAddress($("#f_address"));
  if($("#geoBtn")) $("#geoBtn").onclick=()=>geoNearby(+$("#f_lat").value||0,+$("#f_lng").value||0);
  if($("#nbBox")) nbMount($("#nbBox"));
  if($("#invBox")){ invMount($("#invBox")); invCombo($("#f_cpms"),["software"]); invCombo($("#f_payment"),["pay"]); invCombo($("#f_comms"),["net"]); }
  document.querySelectorAll(".c_model").forEach(i=>invCombo(i,["lis_dc","lis_ac","pu"]));
  $("#toLists").onclick=e=>{ e.preventDefault(); FF.tab="lists"; go("field"); };
  if(!isNew){ renderQRs(); $("#del").onclick=del; wireImage(); }
}
function shrinkImg(file){ return new Promise(res=>{ const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.82)); };
  img.onerror=()=>res(null); img.src=u; }); }
function wireImage(){
  $("#imgUp").onclick=()=>$("#imgIn").click();
  $("#imgIn").addEventListener("change",e=>e.stopPropagation()); $("#imgIn").addEventListener("input",e=>e.stopPropagation());
  $("#imgIn").onchange=async()=>{ const files=[...$("#imgIn").files]; if(!files.length) return; let first=!$("#gal img.hero-on"), n=0;
    for(const f of files){ const data=await shrinkImg(f); if(!data){ toast("Bild konnte nicht gelesen werden",true); continue; }
      try{ await api("upload_image",{id:E.original_id,data,gallery:true,hero:first}); first=false; n++; }catch(e){ toast(e.message,true); } }
    $("#imgIn").value=""; if(n) toast(n+" Foto"+(n>1?"s":"")+" gespeichert ✓"); loadGal(); };
  loadGal();
}
/* Klappbar: ganze Karte (gemerkt) und jeder Charger einzeln (Zustand nicht gespeichert) */
let CH_OPEN=false;
const chFolded=c=>c.__fold===undefined?true:c.__fold;
const setFold=(c,v)=>Object.defineProperty(c,"__fold",{value:v,writable:true,configurable:true,enumerable:false});
function chargerHTML(c,i){
  const f=chFolded(c), kinds=[...new Set(c.connectors.map(x=>x.t+(x.kw?" "+x.kw+" kW":"")))].join(" · "), ev=c.connectors.filter(x=>x.evse).length;

const NB_CAT={wc:["🚻","Toiletten"],food:["🍽️","Essen & Trinken"],cafe:["☕","Café & Bäckerei"],shop:["🛒","Einkaufen"],fuel:["⛽","Tankstelle"],atm:["💶","Geldautomat"],pharmacy:["💊","Apotheke"],hotel:["🏨","Hotel"],leisure:["🌳","Park & Spielplatz"],sight:["🏛️","Sehenswürdigkeit"],other:["📍","Sonstiges"]};
const NB_SUB={restaurant:"Restaurant",fast_food:"Schnellimbiss",cafe:"Café",bakery:"Bäckerei",supermarket:"Supermarkt",convenience:"Kiosk / Laden",kiosk:"Kiosk",mall:"Einkaufszentrum",department_store:"Kaufhaus",doityourself:"Baumarkt",toilets:"Öffentliche Toilette",fuel:"Tankstelle",atm:"Geldautomat",pharmacy:"Apotheke",hotel:"Hotel",playground:"Spielplatz",park:"Park",museum:"Museum",attraction:"Sehenswürdigkeit"};

function nbFromOsm(P){

/* ── Inventar ⇄ Charger/Ladepunkte synchronisieren ── */
const invNum=s=>+String(s||"").replace(/\./g,"").replace(",",".");
const IS_LIS=x=>x&&(x.c==="lis_dc"||x.c==="lis_ac");
/* Ladepunkte eines Produkts aus der Bezeichnung ableiten */
function invSpec(x){ const n=String(x.n||""), out=[];
  for(const m of n.matchAll(/(\d+)\s*x\s*(CCS(?:\s*LC)?|CHAdeMO|MCS|Typ\s*2|Schuko)(?:\s*bis\s*([\d.,]+)\s*kW)?/gi)){
    const t=/mcs/i.test(m[2])?"MCS":/chademo/i.test(m[2])?"CHAdeMO":/typ/i.test(m[2])?"Typ 2":/schuko/i.test(m[2])?"Schuko":"CCS";
    for(let i=0;i<Math.min(+m[1],8);i++) out.push({t,kw:m[3]?invNum(m[3]):null}); }
  if(out.length) return out;
  const kwM=n.match(/([\d.,]+)\s*kW/i), kw=kwM?invNum(kwM[1]):null;
  if(x.c==="lis_ac"){ const k=/double|twin|duo|doppel|2-fach/i.test(n)?2:1; return Array.from({length:k},()=>({t:"Typ 2",kw:kw||22})); }
  const k=/single|1-fach|einzel|1 x|dispenser \(1/i.test(n)?1:2, mdl=n.match(/(?:terra|hyc|a|ufc|sat|raption|rtm|pkm)\s*-?\s*(\d{2,3})/i);
  return Array.from({length:k},()=>({t:"CCS",kw:kw||(mdl?+mdl[1]:null)})); }
/* Power Units: gemeinsame Leistung für Dispenser/Satellites */
function invPower(){ const inv=(E.extras||{}).inventory||[]; let cap=0, pus=0;
  for(const x of inv.filter(y=>y.c==="pu")){ const m=x.n.match(/bis\s*([\d.,]+)\s*kW/i); if(m){ cap+=invNum(m[1])*(x.q||1); pus+=x.q||1; } }
  const sat=E.chargers.filter(c=>/dispenser|satellit|user unit|\bsat\b/i.test(c.model||"")).reduce((a,c)=>a+c.connectors.length,0);
  return cap&&sat?{cap,pus,lp:sat,avg:Math.round(cap/sat)}:null; }
function invNextLabel(){ let n=0; for(const c of E.chargers){ const m=String(c.label||"").match(/(\d+)\s*$/); if(m) n=Math.max(n,+m[1]); } return "LS#"+(n+1); }
const blankCharger=c=>!c.inv&&!c.model&&c.connectors.every(x=>!x.evse&&!x.kw);
function invSync(interactive=true){
  collect(); const inv=(E.extras||{}).inventory||[], lis=inv.filter(IS_LIS), keys=new Set(lis.map(invKey)), log=[];
  const hasEvse=c=>c.connectors.some(x=>x.evse);
  // 1) Charger zu entfernten Inventar-Positionen
  const orphan=E.chargers.filter(c=>c.inv&&!keys.has(c.inv));
  if(orphan.length){ const withE=orphan.filter(hasEvse);
    if(!withE.length||!interactive||confirm(`${orphan.length} Charger gehören zu nicht mehr vorhandenem Inventar (${orphan.map(c=>c.label).join(", ")}).\n${withE.length?withE.length+" davon haben EVSE-IDs.\n":""}\nEntfernen? (Abbrechen = behalten, Verknüpfung wird gelöst)`)){
      E.chargers=E.chargers.filter(c=>!orphan.includes(c)); log.push(`${orphan.length} Charger entfernt`); }
    else orphan.forEach(c=>{ delete c.inv; }); }
  for(const x of lis){ const key=invKey(x), want=x.q||1, label=invLabel(x), spec=invSpec(x);
    let linked=E.chargers.filter(c=>c.inv===key);
    // vorhandene, passende Charger übernehmen (gleiches Modell oder leere Platzhalter)
    for(const c of E.chargers){ if(linked.length>=want) break; if(!c.inv&&c.model&&invNorm(c.model)===invNorm(label)){ c.inv=key; linked.push(c); } }
    for(const c of E.chargers){ if(linked.length>=want) break; if(blankCharger(c)){ c.inv=key; c.model=label; linked.push(c); } }
    let added=0; while(linked.length<want){ const c={label:invNextLabel(),model:label,inv:key,connectors:spec.map(s=>({t:s.t,kw:s.kw,evse:""}))}; E.chargers.push(c); linked.push(c); added++; }
    if(added) log.push(`${added}× ${label} angelegt`);
    if(linked.length>want){ const extra=linked.slice(want), withE=extra.filter(hasEvse);
      if(!withE.length||!interactive||confirm(`Stückzahl „${label}“ auf ${want} reduziert – ${extra.length} Charger (${extra.map(c=>c.label).join(", ")}) entfernen?${withE.length?"\n"+withE.length+" davon haben bereits EVSE-IDs.":""}`)){
        E.chargers=E.chargers.filter(c=>!extra.includes(c)); log.push(`${extra.length}× ${label} entfernt`); }
      else extra.forEach(c=>{ delete c.inv; }); linked=linked.slice(0,want); }
    // Ladepunkte je Charger an das Produkt angleichen – EVSE-IDs und manuelle Leistung bleiben
    for(const c of linked){ c.model=label;
      spec.forEach((s,j)=>{ const lp=c.connectors[j]; if(!lp){ c.connectors.push({t:s.t,kw:s.kw,evse:""}); return; } if(!lp.man){ lp.t=s.t; lp.kw=s.kw; } });
      while(c.connectors.length>spec.length&&!c.connectors[c.connectors.length-1].evse) c.connectors.pop(); } }
  if(!E.chargers.length) E.chargers.push({label:"LS#1",model:"",connectors:[{t:"CCS",kw:null,evse:""}]});
  const y=scrollY; CH_OPEN=true; renderEditor(); scrollTo(0,y);
  if(log.length) toast("🔗 Charger synchronisiert: "+log.join(" · "));
  return log; }
function invSyncInfo(){ const inv=(E.extras||{}).inventory||[], lis=inv.filter(IS_LIS); if(!lis.length) return "";
  const lp=E.chargers.filter(c=>c.inv).reduce((a,c)=>a+c.connectors.length,0), noE=E.chargers.filter(c=>c.inv).reduce((a,c)=>a+c.connectors.filter(x=>!x.evse).length,0), P=invPower();
  return `<div class="ivsync"><b>🔗 Mit Chargern verknüpft:</b> ${lis.map(x=>`${x.q||1}× ${esc(invLabel(x))}`).join(", ")} → ${E.chargers.filter(c=>c.inv).length} Charger · ${lp} Ladepunkte${noE?` · <span class="warn-t">${noE} EVSE-IDs fehlen</span>`:""}
    ${P?`<br>⚡ Power Unit${P.pus>1?"s":""} ${P.cap.toLocaleString("de-DE")} kW für ${P.lp} Ladepunkte – bei gleichzeitiger Nutzung Ø ${P.avg} kW je Ladepunkt (Spitze laut Dispenser).`:""}
    <div class="hint" style="margin-top:4px">Ladesäulen im Inventar erzeugen die Charger automatisch. Typ und Leistung kommen aus dem Produkt – gedrosselte Leistung (z. B. weniger Powerstacks) einfach beim Ladepunkt ändern, sie bleibt dann erhalten (✎). EVSE-IDs bitte bei den Chargern nachtragen.</div>
    <button class="btn ghost sm" id="ivSyncBtn" type="button" style="margin-top:6px">↻ Jetzt abgleichen</button></div>`; }

/* ── Katalog-Import: DATANORM (4/5), BMEcat (1.2/2005), CSV ── */
let INV_EXT=null;
async function invLoadExt(force){ if(INV_EXT&&!force) return INV_EXT; try{ const r=await api("catalog"); INV_EXT=r.items||[]; INV_EXT._src=r.sources||{}; }catch(e){ INV_EXT=INV_EXT||[]; } return INV_EXT; }
const INV_GUESS=[["pu",/power ?(unit|cabinet)|leistungseinheit/i],["lis_dc",/\bdc\b|hpc|schnelllad|ccs|chademo|\bhyc|dispenser|satellit/i],["lis_ac",/wallbox|ladestation|ladesäule|ladepunkt|typ ?2|\bt2s?\b|amtron|kecontact|ladecontroller|e-?mobil/i],
 ["pay",/bezahlterminal|kartenterminal|payter|kartenleser|ec-?terminal/i],["net",/router|switch|\blte\b|\b5g\b|modem|sim-?karte|antenne|hutschienen-?netzteil/i],["video",/kamera|rekorder|\bnvr\b|videoüberw/i],
 ["licht",/leuchte|strahler|beleuchtung|lichtsteuer/i],["lm",/lastmanagement|energiemanag|energiezähler|smart ?meter/i],["mws",/wandler|zählerschrank|verteilerschrank|kabelverteiler|messwandler/i],["trafo",/trafo|transformator|ortsnetzstation/i],
 ["bess",/batteriespeicher|stromspeicher|\bbess\b|speichersystem/i],["lock",/schließzylinder|schließanlage|iloq/i],["fund",/fundament|betonsockel/i],["sonst",/poller|anfahrschutz|beschilderung|bodenmarkierung/i]];
const invGuess=t=>{ for(const[c,re] of INV_GUESS) if(re.test(t)) return c; return ""; };
const INV_BRANDS=()=>[...new Set(INV_CAT.map(x=>x.b).filter(b=>b&&b!=="Sonstige"))].concat(["Phoenix Contact","Bender","Schneider","Siemens","ABB","Hager","Eaton","Legrand","Weidmüller","Lapp","Teltonika","Mennekes","Hikvision","Axis"]);
const invBrandOf=t=>{ const l=" "+t.toLowerCase()+" "; let best="",bi=1e9;
  for(const b of INV_BRANDS()){ const m=l.search(new RegExp("[^a-z0-9äöü]"+b.toLowerCase().replace(/[.*+?^${}()|[\]\\/]/g,"\\$&")+"[^a-z0-9äöü]")); if(m>=0&&(m<bi||(m===bi&&b.length>best.length))){ best=b; bi=m; } } return best; };
const CP850={0x80:"Ç",0x81:"ü",0x82:"é",0x83:"â",0x84:"ä",0x85:"à",0x86:"å",0x87:"ç",0x88:"ê",0x89:"ë",0x8a:"è",0x8b:"ï",0x8c:"î",0x8d:"ì",0x8e:"Ä",0x8f:"Å",0x90:"É",0x94:"ö",0x99:"Ö",0x9a:"Ü",0xe1:"ß",0xf8:"°",0xfd:"²",0xe6:"µ"};
function invDecode(buf){ const u=new Uint8Array(buf);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(u); }catch(e){}
  let dos=0,win=0; for(const b of u){ if(b===0x81||b===0x84||b===0x94||b===0xe1||b===0x9a) dos++; if(b===0xfc||b===0xe4||b===0xf6||b===0xdf||b===0xdc) win++; }
  if(dos>win){ let s=""; for(const b of u) s+=b<128?String.fromCharCode(b):(CP850[b]||"?"); return s; }
  return new TextDecoder("windows-1252").decode(u); }
function invParse(text,fname){
  const t=text.trimStart();
  if(t.startsWith("<")) return invParseBME(t);
  const lines=text.split(/\r?\n/);
  if(lines.some(l=>/^A;/.test(l))||lines.some(l=>/^A[NLAD ]/.test(l)&&l.length>=90)) return invParseDN(lines);
  return invParseCSV(lines);
}
function invParseBME(t){ const doc=new DOMParser().parseFromString(t,"application/xml"); if(doc.querySelector("parsererror")) throw new Error("XML konnte nicht gelesen werden");
  const q=(el,...names)=>{ for(const n of names){ const x=el.getElementsByTagName(n)[0]; if(x&&x.textContent.trim()) return x.textContent.trim(); } return ""; };
  const items=[...doc.getElementsByTagName("PRODUCT")].concat([...doc.getElementsByTagName("ARTICLE")]);
  return items.map(p=>{ const n=q(p,"DESCRIPTION_SHORT"), long=q(p,"DESCRIPTION_LONG").replace(/<[^>]+>/g," ").slice(0,300);
    let ean=""; for(const x of p.getElementsByTagName("INTERNATIONAL_PID")){ if(/ean|gtin/i.test(x.getAttribute("type")||"ean")){ ean=x.textContent.trim(); break; } } ean=ean||q(p,"EAN");
    const b=q(p,"MANUFACTURER_NAME")||invBrandOf(n);
    return {art:q(p,"SUPPLIER_PID","SUPPLIER_AID"),n,b,ean,wg:q(p,"REFERENCE_FEATURE_GROUP_ID","CATALOG_GROUP_ID"),hint:long}; }).filter(x=>x.n); }
function invParseDN(lines){ const map=new Map(), ean={};
  for(const l of lines){
    if(/^A;/.test(l)){ const f=l.split(";"); const art=(f[2]||"").trim(), n=[f[4],f[5]].map(x=>(x||"").trim()).filter(Boolean).join(" "); if(art&&n) map.set(art,{art,n,wg:(f[11]||"").trim()}); }
    else if(/^B;/.test(l)){ const f=l.split(";"); const art=(f[2]||"").trim(); const e=f.find(x=>/^\d{8}$|^\d{12,14}$/.test((x||"").trim())); if(art&&e) ean[art]=e.trim(); }
    else if(/^A/.test(l)&&l.length>=90&&!l.includes(";")){ const art=l.slice(2,17).trim(), n=(l.slice(18,58).trim()+" "+l.slice(58,98).trim()).trim(); if(art&&n) map.set(art,{art,n,wg:l.slice(120,127).trim()}); } }
  return [...map.values()].map(x=>({...x,ean:ean[x.art]||"",b:invBrandOf(x.n)})); }
function invParseCSV(lines){ const L=lines.filter(l=>l.trim()); if(L.length<2) throw new Error("Format nicht erkannt (DATANORM, BMEcat-XML oder CSV mit Kopfzeile)");
  const sep=[";","\t",","].sort((a,b)=>L[0].split(b).length-L[0].split(a).length)[0];
  const split=l=>{ const out=[]; let cur="",qq=false; for(const ch of l){ if(ch==='"'){ qq=!qq; continue; } if(ch===sep&&!qq){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out.map(x=>x.trim()); };
  const h=split(L[0]).map(x=>x.toLowerCase()); const col=re=>h.findIndex(x=>re.test(x));
  const cN=col(/bezeichnung|kurztext|name|beschreibung|description|titel/), cA=col(/artikel|art\.?-?nr|sku|^nr|pid|aid/), cB=col(/hersteller|marke|brand|manufacturer/), cE=col(/ean|gtin/), cK=col(/kategorie|category|gruppe|warengr/);
  if(cN<0) throw new Error("CSV: Spalte „Bezeichnung“ (oder Name/Kurztext) fehlt");
  return L.slice(1).map(l=>{ const f=split(l); const n=f[cN]||""; return {n,art:cA>=0?f[cA]:"",b:cB>=0&&f[cB]?f[cB]:invBrandOf(n),ean:cE>=0?f[cE]:"",wg:cK>=0?f[cK]:""}; }).filter(x=>x.n); }

const invNorm=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");

  return invCatalog().filter(x=>(!cats||cats.includes(x.c))&&t.every(w=>invNorm(x.b+" "+x.n+" "+INV_CATS[x.c]).includes(w))).slice(0,limit); }

/* Combobox: Suchfeld mit Auswahlliste (freie Eingabe bleibt möglich) */
function invCombo(input,cats,onPick){
  const wrap=document.createElement("div"); wrap.className="ivc"; input.parentNode.insertBefore(wrap,input); wrap.appendChild(input);
  const dd=document.createElement("div"); dd.className="ivc-dd"; wrap.appendChild(dd); input.setAttribute("autocomplete","off");
  let idx=-1, res=[];
  const C=()=>typeof cats==="function"?cats():cats;
  const show=()=>{ res=invSearch(input.value,C(),40); idx=-1;
    const q=input.value.trim();
    dd.innerHTML=(res.length?res.map((x,i)=>`<div class="ivc-o" data-i="${i}"><b>${esc(invLabel(x))}</b><small>${esc(INV_CATS[x.c]||x.c)}${x.art?" · Art.-Nr. "+esc(x.art):""}${x.src?" · "+esc(x.src):""}${x.x?" · eigener Eintrag":""}</small></div>`).join(""):"")
      +(q&&!res.some(x=>invLabel(x).toLowerCase()===q.toLowerCase())?`<div class="ivc-o ivc-free" data-i="-2">＋ „${esc(q)}“ übernehmen (eigener Eintrag)</div>`:"")
      ||`<div class="ivc-empty">Kein Treffer – Text eingeben, um einen eigenen Eintrag anzulegen.</div>`;
    dd.style.display="block"; };
  const pick=i=>{ if(i===-2){ const q=input.value.trim(); onPick?onPick({c:(C()||["sonst"])[0],b:"",n:q,x:true},true):0; }
    else if(res[i]){ input.value=invLabel(res[i]); onPick&&onPick(res[i],false); }
    dd.style.display="none"; input.dispatchEvent(new Event("change",{bubbles:true})); };
  input.addEventListener("focus",show); input.addEventListener("input",show);
  input.addEventListener("keydown",e=>{ const o=[...dd.querySelectorAll(".ivc-o")]; if(!o.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); idx=(idx+(e.key==="ArrowDown"?1:-1)+o.length)%o.length; o.forEach((x,i)=>x.classList.toggle("on",i===idx)); o[idx].scrollIntoView({block:"nearest"}); }
    else if(e.key==="Enter"&&idx>=0){ e.preventDefault(); pick(+o[idx].dataset.i); } else if(e.key==="Escape") dd.style.display="none"; });
  dd.addEventListener("mousedown",e=>{ const o=e.target.closest(".ivc-o"); if(o){ e.preventDefault(); pick(+o.dataset.i); } });
  input.addEventListener("blur",()=>setTimeout(()=>dd.style.display="none",120));
}

    <div id="ivL" style="margin-top:10px"></div>`;
  const q=box.querySelector("#ivQ"), L=box.querySelector("#ivL");
  const after=x=>{ if(IS_LIS(x)) invSync(); else paint(); };
  const paint=()=>{ if(!inv.length){ L.innerHTML=`<div class="muted" style="font-size:13px">Noch kein Inventar erfasst.</div>`; return; }
    const g={}; inv.forEach((x,i)=>(g[x.c]=g[x.c]||[]).push([x,i]));
    L.innerHTML=Object.keys(INV_CATS).filter(c=>g[c]).concat(Object.keys(g).filter(c=>!INV_CATS[c])).map(c=>`<div class="iv-g"><div class="iv-gh">${esc(INV_CATS[c]||c)}</div>${g[c].map(([x,i])=>`<div class="iv-r" data-i="${i}">
      <div class="iv-n"><b>${esc(invLabel(x))}</b>${x.art?` <small class="muted">Art.-Nr. ${esc(x.art)}</small>`:""}${x.x?' <span class="badge">eigener Eintrag</span>':""}</div>
      <div class="iv-q"><button class="icon-btn" data-a="m">−</button><input class="iv-qty" value="${x.q||1}" inputmode="numeric"><button class="icon-btn" data-a="p">+</button></div>
      <button class="icon-btn" data-a="rm" title="Entfernen">✕</button></div>`).join("")}</div>`).join("");
    L.querySelectorAll(".iv-r").forEach(r=>{ const x=inv[+r.dataset.i];
      r.querySelector("[data-a=m]").onclick=()=>{ x.q=Math.max(1,(x.q||1)-1); after(x); };
      r.querySelector("[data-a=p]").onclick=()=>{ x.q=(x.q||1)+1; after(x); };
      r.querySelector(".iv-qty").onchange=e=>{ x.q=Math.max(1,Math.min(9999,parseInt(e.target.value)||1)); after(x); };
      r.querySelector("[data-a=rm]").onclick=()=>{ inv.splice(+r.dataset.i,1); after(x); }; });
    L.insertAdjacentHTML("beforeend",invSyncInfo()); const sb=L.querySelector("#ivSyncBtn"); if(sb) sb.onclick=()=>invSync(); };
  invLoadExt().then(()=>{ const c=box.querySelector("#ivCnt"); if(c) c.textContent=invCatalog().length.toLocaleString("de-DE"); });
  box.querySelector("#ivImp").onclick=e=>{ e.preventDefault(); invImportDialog(); };
  invCombo(q,()=>cat?[cat]:null,(x,isFree)=>{ const it={c:isFree?(cat||"sonst"):x.c,b:x.b||"",n:x.n,q:1,x:!!(isFree||x.x),...(x.art?{art:x.art}:{})};
    const ex=inv.find(y=>invKey(y)===invKey(it)); if(ex) ex.q=(ex.q||1)+1; else inv.push(it);
    setTimeout(()=>{ q.value=""; },0); toast(ex?"Stückzahl erhöht":"Hinzugefügt: "+invLabel(it)); after(it); });
  const sel=box.querySelector("#ivC"); sel.onchange=()=>{ cat=sel.value; q.focus(); q.dispatchEvent(new Event("input")); };
  paint();
}

function collect(){
  const v=id=>$("#"+id)?$("#"+id).value.trim():"";
  Object.assign(E,{project_id:v("f_project_id"),name:v("f_name"),address:v("f_address"),lat:v("f_lat"),lng:v("f_lng"),review_url:v("f_review_url"),notify_email:v("f_notify_email"),active:$("#f_active")?$("#f_active").checked:true});
  E.extras={...(E.extras||{}),parking_info:($("#f_parking")?.value||"").trim(),tariff_info:($("#f_tariff")?.value||"").trim(),customer_info:($("#f_cinfo")?.value||"").trim(),project_name:($("#f_pname")?.value||"").trim(),sanitary:!!$("#f_sanitary")?.checked,cpms:($("#f_cpms")?.value||"").trim(),ocpp:$("#f_ocpp")?.value||"",payment:($("#f_payment")?.value||"").trim(),comms:($("#f_comms")?.value||"").trim(),inventory_note:($("#f_inv")?.value||"").trim()};
  document.querySelectorAll(".charger").forEach(el=>{ const c=E.chargers[+el.dataset.ci]; if(!c) return;
    c.label=el.querySelector(".c_label").value.trim(); c.model=el.querySelector(".c_model").value.trim();
    el.querySelectorAll(".lp").forEach(r=>{ const x=c.connectors[+r.dataset.lj]; x.t=r.querySelector(".l_t").value; x.kw=r.querySelector(".l_kw").value.trim()||null; x.evse=r.querySelector(".l_evse").value.trim(); if(r.querySelector(".l_kw").dataset.man==="1") x.man=true; });
  });
}
async function save(){
  collect();
  if(!E.project_id) return toast("Projekt-ID eingeben",true);
  if(!E.original_id) E.id=E.project_id;   // interne ID = Projekt-ID (nicht sichtbar)
  const b=$("#save"); b.disabled=true; b.textContent="Speichere …";
  try{ const cl=E._cl; const {_cl,...payload}=E; const r=await api("save",{station:payload});
    if(cl){ try{ await fapi("checklist_assign",{station:r.station.id,on:cl}); FCL=(await fapi("checklist_list")).checklists; }catch(e){ toast("Projekt gespeichert, Checklisten nicht: "+e.message,true); } }

  catch(e){ toast(e.message,true); b.disabled=false; b.textContent="Speichern"; }
}

function renderQRs(){
  const code=E.project_id||E.id, url=APP+"#"+encodeURIComponent(code), box=$("#qrs");
  box.innerHTML=`<div class="qr" style="width:auto"><img id="qrSign" alt="QR-Schild" style="width:150px;border:1px solid var(--line);border-radius:10px"><br><button class="btn ghost sm" id="qrDl" style="margin-top:10px">PNG laden</button></div>`;
  const tmp=document.createElement("div"); tmp.style.display="none"; document.body.appendChild(tmp);

  new QRCode(tmp,{text:url,width:1000,height:1000,correctLevel:QRCode.CorrectLevel.M});
  const draw=()=>{
    const q=tmp.querySelector("canvas"); if(!q) return setTimeout(draw,50);
    const W=1200, top=430, qs=900, H=top+qs+170, c=document.createElement("canvas"); c.width=W; c.height=H;
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.fillStyle="#000"; g.textAlign="center"; g.textBaseline="alphabetic";
    g.font="800 104px Inter, Arial, sans-serif"; g.fillText("LÄUFT ALLES?",W/2,165);
    g.font="800 104px Inter, Arial, sans-serif"; g.fillText("HAPPY CHARGING",W/2,290);
    g.font="500 54px Inter, Arial, sans-serif"; g.fillText("Scannen und LIVE-Feedback starten.",W/2,385);
    g.imageSmoothingEnabled=false; g.drawImage(q,(W-qs)/2,top,qs,qs);

const liveFmt=ms=>{ const t=Math.max(0,Math.floor(ms/1000)), d=Math.floor(t/86400), h=Math.floor(t/3600)%24, m=Math.floor(t/60)%60, sec=t%60, p=n=>String(n).padStart(2,"0");

function incSummary(list){
  const now=Date.now(), done=list.filter(i=>i.resolved_at), open=list.filter(i=>!i.resolved_at);

  const sum=a=>a.reduce((x,i)=>x+dur(i),0), dd=done.map(dur).sort((a,b)=>a-b);
  const med=dd.length?(dd.length%2?dd[dd.length>>1]:(dd[dd.length/2-1]+dd[dd.length/2])/2):0;

  let h="";
  if(done.length) h+=tile("✅ Gesamtzeit erledigt (kumuliert)",fmtDur(sum(done)),`${done.length} Störung${done.length>1?"en":""} · Meldung → erledigt`)
    +tile("Ø je Störung",fmtDur((sum(done)+sum(open))/(done.length+open.length)),open.length?`inkl. ${open.length} offener · nur erledigte Ø ${fmtDur(sum(done)/done.length)}`:`Median ${fmtDur(med)}`)+tile("Längste",fmtDur(dd[dd.length-1]),`kürzeste ${fmtDur(dd[0])}`);

function enhanceTables(root){
  (root||document).querySelectorAll("#main table").forEach(tbl=>{
    const thead=tbl.tHead, tb=tbl.tBodies[0]; if(!thead||!tb||tbl.classList.contains("mini")||tbl.closest(".akte-in")) return;
    const hr=thead.rows[0]; if(!hr) return;
    if(!hr.querySelector("th.rn")){ const th=document.createElement("th"); th.className="rn"; th.textContent="#"; hr.insertBefore(th,hr.firstChild);
      [...hr.cells].forEach((th,ci)=>{ if(ci===0||!th.textContent.trim()) return; th.classList.add("sortable"); th.title="Klicken zum Sortieren";
        th.onclick=()=>{ const k=tbl.closest("[id]")?.id+"|"+(tb.id||"")+"|"+ci, cur=TSORT[k]; TSORT[k]=cur==="asc"?"desc":"asc";
          Object.keys(TSORT).forEach(x=>{ if(x!==k&&x.startsWith(k.slice(0,k.lastIndexOf("|")+1))) delete TSORT[x]; }); applySort(tbl,ci,TSORT[k]); }; }); }
    const rows=[...tb.rows];
    rows.forEach(r=>{ if(r.querySelector("td.rn")) return; const span=r.cells.length===1&&r.cells[0].colSpan>1;
      if(span){ r.cells[0].colSpan=r.cells[0].colSpan+1; r.dataset.rnDone="1"; return; }
      if(r.dataset.rnDone) return; const td=document.createElement("td"); td.className="rn"; r.insertBefore(td,r.firstChild); });
    // aktive Sortierung erneut anwenden (nach Neuladen der Liste)
    const pre=(tbl.closest("[id]")?.id||"")+"|"+(tb.id||"")+"|"; const key=Object.keys(TSORT).find(x=>x.startsWith(pre));
    if(key) applySort(tbl,+key.split("|")[2],TSORT[key],true); else renumber(tb);
  }); }
function applySort(tbl,ci,dir,quiet){ const tb=tbl.tBodies[0], pairs=[]; let cur=null;
  [...tb.rows].forEach(r=>{ if(r.querySelector("td.rn")){ cur={main:r,extra:[]}; pairs.push(cur); } else if(cur) cur.extra.push(r); else pairs.push({main:r,extra:[],fixed:true}); });
  const data=pairs.filter(p=>!p.fixed); if(data.length<2){ renumber(tb); return; }
  data.sort((a,b)=>{ const x=sortVal(a.main.cells[ci]), y=sortVal(b.main.cells[ci]); const c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"de",{numeric:true}); return dir==="desc"?-c:c; });
  data.forEach(p=>{ tb.appendChild(p.main); p.extra.forEach(e=>tb.appendChild(e)); });
  [...tbl.tHead.rows[0].cells].forEach((th,i)=>{ th.classList.toggle("s-asc",i===ci&&dir==="asc"); th.classList.toggle("s-desc",i===ci&&dir==="desc"); });
  renumber(tb); }
function renumber(tb){ let n=0; [...tb.rows].forEach(r=>{ const c=r.querySelector("td.rn"); if(c) c.textContent=++n; }); }
let ET_H; const ET_MO=new MutationObserver(ms=>{ if(!ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&/^(TR|TABLE|TBODY|DIV)$/.test(n.nodeName)))) return; clearTimeout(ET_H); ET_H=setTimeout(runEnh,30); });
function runEnh(){ const m=document.getElementById("main"); ET_MO.disconnect(); try{ enhanceTables(); }finally{ ET_MO.takeRecords(); ET_MO.observe(m,{childList:true,subtree:true}); } }
ET_MO.observe(document.getElementById("main"),{childList:true,subtree:true});

function freqSort(list,keyFn,tie){ const n={}; list.forEach(x=>{ const k=keyFn(x); n[k]=(n[k]||0)+1; }); return list.sort((a,b)=>n[keyFn(b)]-n[keyFn(a)]||String(keyFn(a)).localeCompare(String(keyFn(b)),"de")||(tie?tie(a,b):0)); }

function custFiltered(){ const cl=(CMETA.clusters||[]).find(g=>g.k===CF.cluster), inCl=c=>!cl||[c.category,...(c.categories||[])].some(k=>cl.cats.some(x=>x.k===k));

    &&(!CF.access||(CF.access==="yes"?!!c.access:CF.access==="no"?!c.access:!!(c.rates&&Object.keys(c.rates).length)))&&(!CF.station||(c.stations||[]).includes(CF.station)||(c.access&&(c.access.stations||[]).includes(CF.station)))); }

async function toggleCust(id,sec){

}

// CSV-Import: Trennzeichen und Spalten automatisch erkennen
function parseCSV(text){ text=text.replace(/^﻿/,""); const first=text.split(/\r?\n/)[0]||""; const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":(first.includes("\t")?"\t":",");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===d){ row.push(f); f=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); f=""; if(row.some(x=>x.trim())) rows.push(row); row=[]; } else f+=ch; }
  row.push(f); if(row.some(x=>x.trim())) rows.push(row); return rows; }
const COLS={name:/^(name|kunde|kundenname|vor.?und.?nachname|ansprechpartner)$/i,company:/^(firma|company|unternehmen|organisation)$/i,email:/^(e-?mail|mail|email.?adresse)$/i,phone:/^(telefon|tel|phone|mobil|handy|telefonnummer)$/i,
  card_no:/^(karte|kartennummer|ladekarte|card|card.?no|card.?number|emaid|vertrags.?id|contract.?id|rfid|token)$/i,emsp:/^(anbieter|emsp|provider|mobilitätsanbieter|kartenanbieter)$/i,status:/^(status|kartenstatus)$/i,notes:/^(notiz|notizen|bemerkung|notes|kommentar)$/i};
function importPreview(text,fname){
  const rows=parseCSV(text); if(rows.length<2) return toast("CSV leer oder ohne Kopfzeile",true);
  const head=rows[0].map(h=>h.trim()), map={}; head.forEach((h,i)=>{ for(const [k,re] of Object.entries(COLS)) if(re.test(h)&&map[k]===undefined) map[k]=i; });
  if(map.name===undefined&&map.email===undefined&&map.card_no===undefined) return toast("Keine passenden Spalten gefunden (Name, E-Mail oder Kartennummer)",true);
  const data=rows.slice(1).map(r=>Object.fromEntries(Object.entries(map).map(([k,i])=>[k,(r[i]||"").trim()])));
  const st=v=>({active:"aktiv",aktiv:"aktiv",blocked:"gesperrt",gesperrt:"gesperrt",inactive:"gesperrt",inaktiv:"gesperrt"})[String(v||"").toLowerCase()]||"aktiv";
  data.forEach(r=>{ r.status=st(r.status); });
  $("#impBox").innerHTML=`<div class="card" style="border-color:#b9d9c8"><h2>CSV-Import: ${esc(fname)}</h2>
    <p class="sub">${data.length} Zeilen erkannt · Spalten: ${Object.keys(map).map(k=>({name:"Name",company:"Firma",email:"E-Mail",phone:"Telefon",card_no:"Kartennummer",emsp:"Anbieter",status:"Status",notes:"Notiz"})[k]+" ← „"+esc(head[map[k]])+"“").join(", ")}.
    Vorhandene Kunden werden über Kartennummer oder E-Mail erkannt und ergänzt – nichts wird doppelt angelegt.</p>
    <div style="overflow:auto"><table><thead><tr>${Object.keys(map).map(k=>`<th>${esc(head[map[k]])}</th>`).join("")}</tr></thead><tbody>${data.slice(0,5).map(r=>`<tr>${Object.keys(map).map(k=>`<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${data.length>5?`<p class="muted">… und ${data.length-5} weitere</p>`:""}
    <div class="row" style="margin-top:10px"><button class="btn" id="impGo">${data.length} Zeilen importieren</button><button class="btn ghost" id="impX">Abbrechen</button></div></div>`;
  $("#impX").onclick=()=>$("#impBox").innerHTML="";
  $("#impGo").onclick=async e=>{ e.target.disabled=true; try{ const r=await api("import_customers",{rows:data});
    $("#impBox").innerHTML=`<div class="card"><b>Import fertig ✓</b> ${r.created} neu, ${r.updated} ergänzt, ${r.cards} Ladekarten${r.skipped?`, ${r.skipped} leere Zeilen übersprungen`:""}.</div>`; loadCustomers(); }catch(err){ e.target.disabled=false; toast(err.message,true); } };
}

/* Sätze & Kosten */
async function fRates(){
  let s; try{ s=await fapi("settings_get"); FVIS=s; await ensureStaff(); }catch(e){ return toast(e.message,true); }
  const r=s.rates||{};
  $("#fbody").innerHTML=`<div class="card"><h2 style="margin-bottom:4px">Standard-Sätze je Kategorie</h2><p class="sub">Gilt für Arbeits- und Anfahrtszeit, wenn weder die Person noch ihre Firma eigene Sätze hat (im Kontakt unter „Sätze & Konditionen“). Änderungen gelten nur für neue Einsätze – abgeschlossene behalten ihren Satz.</p>
    ${roleGroups().map(([g,rs])=>`<div class="rg-h" style="margin-top:12px">${esc(g)}</div><div class="rates">${rs.map(x=>`<label>${esc(x.l)}<div class="row" style="flex-wrap:nowrap;gap:6px"><input class="rt" data-k="${x.k}" inputmode="decimal" value="${esc(String(r[x.k]??"").replace(".",","))}"><span class="muted">€/h</span></div></label>`).join("")}</div>`).join("")}
    <div class="rg-h" style="margin-top:12px">Fahrtkosten</div><div class="rates">
      <label>Kilometer<div class="row" style="flex-wrap:nowrap;gap:6px"><input class="rt" data-k="km" inputmode="decimal" value="${esc(String(r.km??"").replace(".",","))}"><span class="muted">€/km</span></div></label></div>
    <button class="btn" id="rtSave" style="margin-top:14px">Sätze speichern</button></div>
  <div class="card"><h2 style="margin-bottom:4px">Individuelle Sätze aus Kontakten</h2><p class="sub">Firmen (Rahmenvertrag) und Personen mit eigenen Konditionen. Reihenfolge: Person → Firma → Kategorie. Bearbeiten im Kontakt (Klick).</p><div id="rtOv" class="muted">Lade …</div></div>`;
  (async()=>{ try{ await ensureMeta(); if(!CALL.length) CALL=(await api("customers",{q:""})).customers||[]; const L=CALL.filter(c=>c.rates&&Object.keys(c.rates).length||c.terms&&Object.keys(c.terms).length).sort((a,b)=>(a.kind==="company"?0:1)-(b.kind==="company"?0:1));
    const el=$("#rtOv"); if(!el) return; el.classList.remove("muted");
    el.innerHTML=L.map(c=>`<a href="#" class="rec2 rt-c" data-id="${esc(c.id)}">${c.kind==="company"?"🏢":"👤"} <b>${esc(c.kind==="company"?c.company||c.name:c.name)}</b> <span class="muted">${esc(catLabel(c.category))}${c.kind!=="company"&&c.company?" · "+esc(c.company):""}${c.terms&&c.terms.contract_until?" · Vertrag bis "+d2(c.terms.contract_until):""}${c.terms&&c.terms.payment_days!=null?" · Zahlungsziel "+c.terms.payment_days+" T.":""}</span><span class="sp"></span><b>${rateTxt(c.rates)||"–"}</b></a>`).join("")||'<span class="muted">Keine – alle rechnen mit dem Satz ihrer Kategorie.</span>';
    el.querySelectorAll(".rt-c").forEach(a=>a.onclick=e=>{ e.preventDefault(); CF.open=a.dataset.id; CF.openSec="rates"; CF.q=""; CF.cluster="all"; CF.cat=""; go("customers"); }); }catch(e){} })();
  $("#rtSave").onclick=async()=>{ const rates={}; document.querySelectorAll(".rt").forEach(i=>rates[i.dataset.k]=i.value.replace(",","."));
    try{ await fapi("settings_save",{incidents:s.incidents,defects:s.defects,rates}); toast("Sätze gespeichert ✓"); }catch(e){ toast(e.message,true); } };
}
/* Mitarbeiter = Kontakte mit Service-Zugang */
async function fStaff(){
  try{ FSTAFF=(await fapi("staff_list")).staff; await ensureMeta(); }catch(e){ return toast(e.message,true); }
  const groups=roleGroups().map(([g,rs])=>[g,FSTAFF.filter(x=>rs.some(r=>r.k===x.role))]).filter(([,l])=>l.length);
  $("#fbody").innerHTML=`<div class="row" style="margin-bottom:10px"><p class="sub" style="margin:0;flex:1">Mitarbeiter sind <b>Kontakte mit Service-Zugang</b>. Stammdaten, Sätze und Datenzugriff werden im Kontakt gepflegt – ein Klick öffnet ihn. Jede Person meldet sich mit eigener PIN an.</p><button class="btn" id="fNew">+ Mitarbeiter</button></div>
  <div id="fNewBox"></div>
  ${groups.map(([g,l])=>`<div class="card" style="padding:0;overflow:auto"><div class="rg-h" style="padding:10px 14px 0">${esc(g)} (${l.length})</div><table><thead><tr><th>Name</th><th>Rolle</th><th>Satz</th><th>Kundendaten</th><th>PIN</th><th>Projekte</th><th>Protokolle</th><th>Zuletzt</th><th>Status</th></tr></thead><tbody>
  ${l.map(x=>`<tr class="click" data-cid="${esc(x.contact_id||"")}" data-id="${esc(x.id)}"><td><b>${esc(x.name)}</b> ${x.contact_id?'<span title="Kontakt öffnen">📇</span>':'<span class="badge warn" title="noch kein Kontakt">ohne Kontakt</span>'}${x.company?`<br><small class="muted">${esc(x.company)}</small>`:""}</td><td>${esc(FROLES[x.role]||x.role)}</td>
    <td><b>${eur(x.eff_rate)}/h</b><br><small class="muted">${esc(x.rate_src||"")}</small></td><td>${esc((CMETA.data_levels||{})[x.data_access]||x.data_access)}<br><small class="muted">${esc(x.data_src||"")}</small></td><td><code>${esc(x.pin_hint||"–")}</code>${x.history_all?'<br><small class="muted" title="sieht alle Protokolle am Standort">👁 alle Protokolle</small>':""}</td>
    <td>${x.stations.length?x.stations.map(id=>`<span class="chip-c">${esc(stLabel(id))}</span>`).join(""):'<span class="muted">alle</span>'}</td><td>${x.reports}</td><td>${x.last_login_at?fmtDT(x.last_login_at):"–"}</td>
    <td>${x.active?'<span class="badge">aktiv</span>':'<span class="badge off">gesperrt</span>'} <a href="#" class="s-tog" data-id="${esc(x.id)}">${x.active?"sperren":"entsperren"}</a></td></tr>`).join("")}</tbody></table></div>`).join("")||'<div class="card muted">Noch keine Mitarbeiter.</div>'}`;
  document.querySelectorAll("#fbody tr.click").forEach(row=>row.onclick=e=>{ if(e.target.closest(".s-tog")) return; if(!row.dataset.cid) return toast("Dieser Zugang hat noch keinen Kontakt",true); CF.open=row.dataset.cid; CF.openSec="acc"; CF.q=""; CF.cluster="all"; CF.cat=""; go("customers"); });
  document.querySelectorAll(".s-tog").forEach(a=>a.onclick=async e=>{ e.preventDefault(); const x=FSTAFF.find(y=>y.id===a.dataset.id);
    try{ if(x.active&&!confirm(`Zugang von ${x.name} sperren?`)) return;
      if(x.contact_id) await fapi("contact_access_save",{contact_id:x.contact_id,role:x.role,active:!x.active,history_all:!!x.history_all,stations:x.stations}); else await fapi("staff_delete",{id:x.id});
      toast("Gespeichert ✓"); fStaff(); }catch(err){ toast(err.message,true); } });
  $("#fNew").onclick=()=>{ $("#fNewBox").innerHTML=`<div class="card"><h2 style="margin-bottom:4px">Mitarbeiter aus Kontakten</h2><p class="sub">Kontakt suchen (Person oder Firma) – im Kontakt dann Rolle und PIN vergeben. Noch nicht vorhanden? Neu anlegen.</p>
    <input class="n-q" placeholder="🔎 Name, Firma, E-Mail …"><div class="asg-res n-res"></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm n-new">+ Neuen Kontakt anlegen</button><button class="btn ghost sm n-x">Abbrechen</button></div></div>`;
    let h; const nq=$(".n-q"), res=$(".n-res"); nq.focus();
    nq.oninput=()=>{ clearTimeout(h); h=setTimeout(async()=>{ const t=nq.value.trim(); if(t.length<2){ res.innerHTML=""; return; } const L=(await contactSearch(t)).filter(k=>!/^kunde_/.test(k.category||"")).slice(0,10);
      res.innerHTML=L.map(k=>`<button type="button" class="asg-r" data-id="${esc(k.id)}">${k.kind==="company"?"🏢":"👤"} <b>${esc(k.name||k.company||"–")}</b> <span class="muted">${esc([k.name?k.company:"",catLabel(k.category)].filter(Boolean).join(" · "))}${k.access?" · 🔑 hat schon Zugang":""}</span></button>`).join("")||'<div class="muted" style="padding:6px">Nichts gefunden.</div>';
      res.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{ CF.open=b.dataset.id; CF.openSec="acc"; CF.q=""; CF.cluster="all"; CF.cat=""; go("customers"); }); },250); };
    $(".n-new").onclick=()=>{ CF.q=""; CF.cluster="service"; CF.cat=""; CF.newCat="technik"; CF.autoNew=true; go("customers"); };
    $(".n-x").onclick=()=>$("#fNewBox").innerHTML=""; };
}
/* Checklisten */
function fLists(){
  $("#fbody").innerHTML=`<div class="row" style="margin-bottom:10px"><p class="sub" style="margin:0;flex:1">Welche Checklisten jemand sieht, hängt an seiner Rolle. Mit Intervall erscheint die Liste in der Service-App als „fällig“, wenn sie zu lange nicht durchgeführt wurde.</p><button class="btn" id="cNewL">+ Checkliste</button></div>
  <div id="clEd"></div><div class="grid" id="clGrid">${FCL.map((c,i)=>`<div class="card pcard" data-i="${i}" style="${c.active?"":"opacity:.55"}"><div class="row"><b style="font-size:16px">${esc(c.title)}</b><div class="sp"></div>${c.active?"":'<span class="badge off">inaktiv</span>'}</div>
    <div class="muted" style="margin:4px 0 8px">${esc(c.description||"")}</div>
    <div class="row" style="gap:6px">${c.roles.map(r=>`<span class="badge amber">${esc(FROLES[r]||r)}</span>`).join("")}</div>
    <div class="stats"><div><b>${(c.items||[]).length}</b>Prüfpunkte</div><div><b>${esc(FSCOPE[c.scope])}</b>Umfang</div><div><b>${c.interval_days?c.interval_days+" T.":"–"}</b>Intervall</div><div><b>${clProjLabel(c)}</b>Projekte</div></div>
    ${c.due_date||Object.keys(c.due_dates||{}).length||(c.assign_companies||[]).length||(c.assign_staff||[]).length?`<div class="row" style="gap:6px;margin-top:8px">${c.due_date?`<span class="badge">📅 ${d2(c.due_date)} ${dueTag(c.due_date+"T23:59:59",c.remind_days,c.urgent_days,false)}</span>`:""}${Object.keys(c.due_dates||{}).length?`<span class="badge">📅 ${Object.keys(c.due_dates).length} Projekttermin(e)</span>`:""}${(c.assign_companies||[]).length||(c.assign_staff||[]).length?`<span class="badge amber">🎯 ${[...(c.assign_companies||[]),...(c.assign_staff||[]).map(id=>(FSTAFF.find(x=>x.id===id)||{}).name||"Person")].map(esc).join(", ")}</span>`:""}</div>`:""}</div>`).join("")}</div>`;
  $("#cNewL").onclick=()=>listEd({title:"",roles:["technik"],scope:"charger",items:[{type:"check",text:"",required:true}],active:true,sort:100},true);
  document.querySelectorAll("#clGrid .pcard").forEach(c=>c.onclick=()=>listEd(JSON.parse(JSON.stringify(FCL[+c.dataset.i]))));
}
const clFor=(l,id)=>l.all_stations!==false?!(l.excluded_stations||[]).includes(id):(l.stations||[]).includes(id);
const clProjLabel=c=>{ const n=STATIONS.filter(st=>clFor(c,st.id)).length; return c.all_stations!==false?((c.excluded_stations||[]).length?`alle außer ${(c.excluded_stations||[]).length}`:"alle"):n+" von "+STATIONS.length; };
function listEd(c,isNew){
  const row=(it,i)=>`<div class="lp" data-i="${i}" style="display:grid;grid-template-columns:28px 1fr 150px 92px 96px;gap:8px;align-items:start;padding:8px 0;border-top:1px solid #eef1ef">
    <b style="padding-top:9px">${i+1}.</b><div><input class="it-text" placeholder="Prüfpunkt, z. B. Display gereinigt" value="${esc(it.text||"")}"><input class="it-hint" placeholder="Anleitung / Hinweis (optional)" value="${esc(it.hint||"")}" style="margin-top:6px;font-size:13px">
      ${it.type==="choice"?`<input class="it-opts" placeholder="Auswahl, getrennt mit ; (z. B. bestanden; nicht bestanden)" value="${esc((it.options||[]).join("; "))}" style="margin-top:6px;font-size:13px">`:""}</div>
    <select class="it-type">${Object.entries(FTYPES).map(([k,l])=>`<option value="${k}" ${it.type===k?"selected":""}>${l}</option>`).join("")}</select>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);padding-top:9px"><input type="checkbox" class="it-req" style="width:auto" ${it.required?"checked":""}> Pflicht</label>
    <div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn ghost sm it-up" type="button">↑</button><button class="btn ghost sm it-dn" type="button">↓</button><button class="btn ghost sm it-rm" type="button">✕</button></div></div>`;
  const collectL=()=>{ const ed=$("#clEd"); c.title=ed.querySelector(".l-title").value; c.description=ed.querySelector(".l-desc").value; c.scope=ed.querySelector(".l-scope").value;
    c.interval_days=ed.querySelector(".l-int").value; c.sort=ed.querySelector(".l-sort").value; c.active=ed.querySelector(".l-active").checked; c.roles=[...ed.querySelectorAll(".l-role:checked")].map(x=>x.value);
    c.due_date=ed.querySelector(".l-due").value||null; c.remind_days=ed.querySelector(".l-rm").value; c.urgent_days=ed.querySelector(".l-ug").value;
    c.due_dates={}; ed.querySelectorAll(".l-std").forEach(i=>{ if(i.value) c.due_dates[i.dataset.st]=i.value; });
    c.all_stations=ed.querySelector(".l-all:checked").value==="all"; const chk=[...ed.querySelectorAll(".l-st")];
    if(c.all_stations){ c.excluded_stations=chk.filter(x=>!x.checked).map(x=>x.value); } else { c.stations=chk.filter(x=>x.checked).map(x=>x.value); }
    c.items=[...ed.querySelectorAll(".lp")].map((r,i)=>({...(c.items[+r.dataset.i]||{}),text:r.querySelector(".it-text").value,hint:r.querySelector(".it-hint").value,type:r.querySelector(".it-type").value,required:r.querySelector(".it-req").checked,
      options:r.querySelector(".it-opts")?r.querySelector(".it-opts").value.split(";").map(x=>x.trim()).filter(Boolean):(c.items[+r.dataset.i]||{}).options})); };
  const draw=()=>{ $("#clEd").innerHTML=`<div class="card" style="border-color:#b9d9c8"><div class="row"><h2 style="margin:0">${isNew?"Neue Checkliste":"Checkliste bearbeiten"}</h2><div class="sp"></div><button class="btn ghost sm" id="lX">Schließen</button></div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 80px;gap:10px;margin-top:10px">
      <div><label>Titel</label><input class="l-title" value="${esc(c.title||"")}"></div>
      <div><label>Umfang</label><select class="l-scope">${Object.entries(FSCOPE).map(([k,l])=>`<option value="${k}" ${c.scope===k?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><label>Intervall (Tage, leer = keins)</label><input class="l-int" inputmode="numeric" value="${esc(c.interval_days||"")}"></div>
      <div><label>Reihenfolge</label><input class="l-sort" inputmode="numeric" value="${esc(c.sort??100)}"></div></div>
    <label style="margin-top:8px">Beschreibung (sieht der Mitarbeiter)</label><input class="l-desc" value="${esc(c.description||"")}">
    <label style="margin-top:12px">Gilt für Projekte</label>
    <div class="row" style="gap:16px;margin-bottom:6px"><label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="radio" name="lall" class="l-all" value="all" style="width:auto" ${c.all_stations!==false?"checked":""}> Alle Projekte – auch neu angelegte</label>
      <label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="radio" name="lall" class="l-all" value="sel" style="width:auto" ${c.all_stations===false?"checked":""}> Nur ausgewählte Projekte</label></div>
    <div class="cards-ed" style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px">${STATIONS.map(st=>{ const on=c.all_stations!==false?!(c.excluded_stations||[]).includes(st.id):(c.stations||[]).includes(st.id);
      return `<div class="l-strow"><label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0;flex:1"><input type="checkbox" class="l-st" value="${esc(st.id)}" style="width:auto" ${on?"checked":""}> <b>${esc(st.project_id||st.id)}</b> <span class="muted">${esc(st.name||"")}</span></label></div>`; }).join("")||'<span class="muted">Noch keine Projekte.</span>'}</div>
    <div class="hint">${c.all_stations!==false?"Abgewählte Projekte sind Ausnahmen – jedes neue Projekt bekommt die Liste automatisch.":"Neue Projekte bekommen die Liste nicht automatisch – im Projekt-Editor zuschaltbar."}</div>
    <label style="margin-top:10px">Sichtbar für</label>${roleChecks("l-role",c.roles)}
    <label style="margin-top:10px">Nur für bestimmte Firmen / Personen <span class="muted">(optional – sonst alle der gewählten Rollen)</span></label>
    <div class="asg"><div class="asg-chips">${(c.assign_companies||[]).map((n,i)=>`<span class="chip-c">🏢 ${esc(n)} <a href="#" data-rmc="${i}">×</a></span>`).join("")}${(c.assign_staff||[]).map((id,i)=>`<span class="chip-c">👤 ${esc((FSTAFF.find(x=>x.id===id)||{}).name||"Person")} <a href="#" data-rms="${i}">×</a></span>`).join("")}${!(c.assign_companies||[]).length&&!(c.assign_staff||[]).length?'<span class="muted" style="font-size:13px">alle Personen der gewählten Rollen</span>':""}</div>
      <input class="asg-q" placeholder="🔎 Kontakt, Firma oder Mitarbeiter suchen …"><div class="asg-res"></div></div>
    <div class="due-box"><b>📅 Termine &amp; Erinnerung</b>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px">
        <div><label>Fester Termin (alle Projekte)</label><input type="date" class="l-due" value="${esc(c.due_date||"")}"></div>
        <div><label><span class="dtag d-soon">orange</span> Erinnerung ab … Tage vorher</label><input class="l-rm" inputmode="numeric" value="${c.remind_days??""}" placeholder="${REM.remind} (Standard)"></div>
        <div><label><span class="dtag d-urgent">hellrot</span> dringend ab … Tage vorher</label><input class="l-ug" inputmode="numeric" value="${c.urgent_days??""}" placeholder="${REM.urgent} (Standard)"></div></div>
      <div class="hint">Termin = konkretes Datum (z. B. DGUV-Prüfung am 15.03.); je Projekt abweichend darunter. Mit Intervall wird nach jeder Durchführung neu gerechnet. Überschritten: <span class="dtag d-over">−5 T.</span> · täglich Erinnerungs-Mail an das Team.</div>
      ${(()=>{ const sel=STATIONS.filter(st=>c.all_stations!==false?!(c.excluded_stations||[]).includes(st.id):(c.stations||[]).includes(st.id)), n=sel.filter(st=>(c.due_dates||{})[st.id]).length;
        return `<details class="csec" style="margin-top:8px" ${n?"":""}><summary><b>Abweichender Termin je Projekt</b> <span class="muted">${n?n+" gesetzt":"keine – es gilt der feste Termin bzw. das Intervall"}</span></summary><div class="csec-b">${sel.map(st=>`<div class="l-strow"><span style="flex:1"><b>${esc(st.project_id||st.id)}</b> <span class="muted">${esc(st.name||"")}</span></span><input type="date" class="l-std" data-st="${esc(st.id)}" value="${esc((c.due_dates||{})[st.id]||"")}" style="width:auto;padding:4px 8px"></div>`).join("")||'<span class="muted">Keine Projekte ausgewählt.</span>'}</div></details>`; })()}</div>
    <label style="margin-top:12px">Prüfpunkte</label><div id="lItems">${c.items.map(row).join("")}</div>
    <button class="btn ghost sm" id="lAdd" style="margin-top:8px">+ Prüfpunkt</button>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)"><input type="checkbox" class="l-active" style="width:auto" ${c.active!==false?"checked":""}> aktiv</label>
    <div class="row" style="margin-top:12px"><button class="btn" id="lSave">Speichern</button>${isNew?"":`<button class="btn ghost sm" id="lMkt">🏷 Zur Vergabe stellen</button><button class="btn warn sm" id="lDel">Löschen</button>`}</div></div>`;
    $("#lX").onclick=()=>$("#clEd").innerHTML="";
    const ed=$("#clEd"), aq=ed.querySelector(".asg-q"), ares=ed.querySelector(".asg-res"); let ah;
    ed.querySelectorAll("[data-rmc]").forEach(a=>a.onclick=e=>{ e.preventDefault(); collectL(); c.assign_companies.splice(+a.dataset.rmc,1); draw(); });
    ed.querySelectorAll("[data-rms]").forEach(a=>a.onclick=e=>{ e.preventDefault(); collectL(); c.assign_staff.splice(+a.dataset.rms,1); draw(); });
    aq.oninput=()=>{ clearTimeout(ah); ah=setTimeout(async()=>{ const q=aq.value.trim().toLowerCase(); if(q.length<2){ ares.innerHTML=""; return; }
      await ensureStaff(); const crm=await contactSearch(q);
      const comps=[...new Set([...crm.map(k=>k.company),...FSTAFF.map(x=>x.company)].filter(x=>x&&x.toLowerCase().includes(q)))].slice(0,8);
      const staff=FSTAFF.filter(x=>[x.name,x.company,x.email].join(" ").toLowerCase().includes(q)).slice(0,8);
      const linked=new Set(FSTAFF.map(x=>x.contact_id).filter(Boolean)), crmOnly=crm.filter(k=>!linked.has(k.id)&&k.name).slice(0,5);
      ares.innerHTML=[...comps.map(n=>`<button type="button" class="asg-r" data-c="${esc(n)}">🏢 <b>${esc(n)}</b> <span class="muted">Firma – alle Mitarbeiter dieser Firma</span></button>`),
        ...staff.map(x=>`<button type="button" class="asg-r" data-s="${esc(x.id)}">👤 <b>${esc(x.name)}</b> <span class="muted">${esc(x.company||"")} · ${esc(FROLES[x.role]||x.role)}</span></button>`),
        ...crmOnly.map(k=>`<div class="asg-r off">📇 ${esc(k.name)}${k.company?" · "+esc(k.company):""} <span class="muted">– Kontakt ohne Service-Zugang (im Reiter „Mitarbeiter“ anlegen)</span></div>`)].join("")||'<div class="muted" style="padding:6px">Nichts gefunden.</div>';
      ares.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ collectL(); c.assign_companies=[...new Set([...(c.assign_companies||[]),b.dataset.c])]; draw(); });

        <div style="flex:1"><label>Ort (öffentlich, nur Stadt/Stadtteil)</label><input id="mjL" value="${esc(j.location_public||"")}" placeholder="z. B. Hamburg-Altona"></div></div>

        <div style="flex:1"><label>Abrechnung</label><select id="mjP">${[["fix","Pauschalpreis"],["stunde","Stundensatz"],["offen","Pauschal oder Stundensatz"]].map(([k,l])=>`<option value="${k}" ${k===(j.price_type||"fix")?"selected":""}>${l}</option>`).join("")}</select></div></div>
