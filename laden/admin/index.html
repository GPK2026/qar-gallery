<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--muted:#5d6b65;--line:#e1e6e3;--brand:#0a8f5a;--brand-soft:#e3f4ec;--warn:#b42318;--warn-soft:#fdecea;--amber:#9a6700;--amber-soft:#fff6db;--orange:#F08C00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo svg{width:22px;height:28px}

nav button{background:none;border:0;padding:8px 9px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
nav button.on{background:var(--brand-soft);color:#08603d}
.sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}

.sub{color:var(--muted);margin:0 0 16px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--brand);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.warn{background:#fff;border:1.5px solid #f3c1bc;color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{cursor:pointer;transition:box-shadow .15s}
.newtile{border:2px dashed #b9d9c8;background:#f7fbf9;color:#08603d;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;width:100%}
.newtile span{font-size:30px;line-height:1}
.newtile:hover{background:var(--brand-soft)}
.pcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.pid{font-size:22px;font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--brand-soft);color:#08603d}

.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.stats{display:flex;gap:16px;margin-top:12px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-size:16px;display:block}
.muted{color:var(--muted)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--brand)}

.form{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

.fold-btn{border:0;background:none;font-size:16px;color:var(--muted);padding:0 2px;cursor:pointer;width:20px}
.ch-sum{display:flex;align-items:center;gap:10px;cursor:pointer;margin:-4px 0 10px;font-size:14px;user-select:none}
.ch-sum .fold-i{color:var(--muted);width:14px}
.charger.fold{padding:10px 14px}.charger.fold .ch-sum{margin:0}.charger.fold .ch-body{display:none}
.charger{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fbfcfb}
.ch-head{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:end}

.icon-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.toast.on{opacity:1}
.toast.err{background:var(--warn)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #eef1ef;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8faf9}
.qr-row{display:flex;gap:14px;flex-wrap:wrap}
.qr{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:#fff;width:200px}

.lt{color:var(--muted);font-variant-numeric:tabular-nums}.le{font-weight:600}
.log-i.t-chat_user .ld,.log-i.t-chat_bot .ld,.log-i.t-chat_team .ld{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:pre-wrap}
.log-i.t-chat_team .ld{background:#eef4ff;border-color:#c9dafc}
.log-i.t-ticket_submit,.log-i.t-danger_open{background:var(--amber-soft)}
.log-i.t-danger_open{background:var(--warn-soft)}
.log-i.t-solved{background:var(--brand-soft)}
.notes{margin-top:10px}.note-i{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mail-i{font-size:13px;padding:5px 0}
@media (max-width:900px){.akte-grid{grid-template-columns:1fr}.log-i{grid-template-columns:56px 1fr}.log-i .ld{grid-column:1 / -1}}
.hidden{display:none!important}
#gs{width:180px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#f8faf9}
#gs:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);background:#fff}
.dates{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dates input[type=date]{width:auto;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:13px}
.dates .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}

.how-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px 18px;margin-top:12px;font-size:13.5px;line-height:1.5;color:#3c4a44}

table.mini{width:100%;font-size:13px}table.mini th{font-size:12px}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

.isum-t.open{border-color:#f3c2bc;background:#fff7f6}.isum-t.open .v{color:#b42318}
.badge.live b{font-variant-numeric:tabular-nums;font-weight:800}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.cl-pick{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:14px;margin:0}
.cl-pick.on{border-color:var(--brand);background:#f3faf6}
.cl-pick input{width:auto;margin-top:3px}.cl-pick small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.prio{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff;background:#9aa5a0}
.prio.pA{background:#d03b3b}.prio.pB{background:#eda100}.prio.pC{background:#7a8a83}
.due-od{color:#b42318;font-weight:700}
.esc-box{margin-top:14px;border:1px dashed #f3c2bc;background:#fff7f6;border-radius:10px;padding:10px 12px}
.rgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rgroup{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfcfb}
.rg-h{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.rg-b{display:flex;flex-direction:column;gap:3px}.rg-b label{display:flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink);margin:0;font-weight:500}.rg-b input{width:auto}
.tm-g{padding:0;overflow:hidden}.tm-gh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 16px;font-size:15px;cursor:pointer;text-align:left;flex-wrap:wrap}.tm-gh .chev{color:var(--muted)}.tm-gb{display:none;border-top:1px solid var(--line)}.tm-g.open .tm-gb{display:block}
.tm-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:4px solid transparent}.tm-row:hover{background:#f6faf8}.tm-row:last-child{border-bottom:0}
.tm-row.t-ap{border-left-color:#2f6fed}.tm-row.t-cl{border-left-color:#0a8f5a}.tm-row.t-mg{border-left-color:#c26a00}.tm-row.done{opacity:.55}
.tm-d{width:92px;display:flex;flex-direction:column;font-size:13.5px}.tm-i{font-size:18px}.tm-m{flex:1;min-width:0}.tm-s{white-space:nowrap}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.cal-h{font-size:12px;font-weight:700;color:var(--muted);padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#f6f8f7}
.cal-c{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}.cal-c:hover{background:#f8fbf9}.cal-c.out{background:#fafbfa}.cal-c.out .cal-n span{color:#b9c2be}.cal-c.we{background:#fcfcfb}

.cal-it.t-ap{border-left-color:#2f6fed;background:#e8efff}.cal-it.t-cl{border-left-color:#0a8f5a;background:#e3f4ec}.cal-it.t-mg{border-left-color:#c26a00;background:#fff0dc}

.cl-seg{margin-bottom:12px;flex-wrap:wrap}.cl-seg .n{font-size:11px;background:#eef1ef;color:var(--muted);border-radius:999px;padding:1px 7px;margin-left:3px}.cl-seg button.on .n{background:#fff}

a.rec2{color:var(--ink);text-decoration:none}tr.inact td{opacity:.5}
.badge.cat-kunden{background:#e8efff;color:#1d4ed8}.badge.cat-service{background:#e3f4ec;color:#08603d}.badge.cat-partner{background:#f3e8ff;color:#6b21a8}.badge.cat-lieferanten{background:#fff0dc;color:#9a5300}.badge.cat-behoerden{background:#fde0de;color:#b42318}

.tl-bar .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid;box-sizing:border-box;cursor:pointer;z-index:3}
.tl-bar .now{position:absolute;right:-6px;top:-18px;font-size:11px;color:var(--muted)}
.tl-ax{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin:4px 8px 6px}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}.tl-legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.tl-list{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.tl-list li{display:grid;grid-template-columns:130px 16px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid #f0f3f1;font-size:13px}
.tl-t{color:var(--muted);font-variant-numeric:tabular-nums}.tl-d{color:var(--muted);font-size:12px}
.cust-box{background:#f3f8ff;border:1px solid #cfe0f7;border-radius:10px;padding:10px 12px;margin:10px 0}
.cust-box a{font-weight:700}
.chk-ok{color:#08603d;font-weight:600}.chk-bad{color:#b42318;font-weight:600}.chk-q{color:#9a6700;font-weight:600}
.cards-ed .crow{display:grid;grid-template-columns:1.6fr 1fr 125px 36px;gap:8px;margin-bottom:6px}
.chip-c{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;font-family:ui-monospace,Menlo,monospace}
.chip-c.gesperrt{border-color:#f3c1bc;color:#b42318}.chip-c.unbekannt{border-color:#f0d9a0;color:#9a6700}
.up-row{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:10px;padding:4px 0}
.up-row .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-row .lbl small{color:var(--muted)}
.up-bar{position:relative;height:16px;border-radius:4px;background:#d5eed5;overflow:hidden}
.up-bar i{position:absolute;top:0;bottom:0;background:#d03b3b;border-left:2px solid #fff;min-width:3px;cursor:pointer}
.up-row .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.up-axis{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;color:var(--muted);font-size:11px;margin-top:4px}
.up-axis div{display:flex;justify-content:space-between}
.av-h{background:none;border:0;padding:0;font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.av-h .chev{color:var(--muted);font-size:13px}
.av-closed .av-body{display:none!important}
.heat{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;align-items:center}
.heat i{display:flex;align-items:center;justify-content:center;height:24px;border-radius:3px;cursor:default;font-style:normal;font-size:11px;font-weight:700}
.heat i.pk{outline:2px solid #14201b;outline-offset:-2px}
.heat.parts{margin-bottom:2px}
.heat .hp{font-size:11px;font-weight:700;color:var(--muted);text-align:center;background:#f3f6f4;border-radius:4px;padding:2px 0}
.heat .hx.pk{color:#2a78d6;font-weight:800}
.heat .hl,.hbars .hl{font-size:12px;color:var(--muted);font-weight:600}
.heat .hx{font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hbars{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;align-items:end;height:60px;margin-top:20px;border-bottom:1px solid var(--line)}
.hbars div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.hbars em{position:absolute;top:-14px;font-style:normal;font-size:10px;color:var(--muted)}
.hbars i{display:block;width:100%;background:#2a78d6;border-radius:3px 3px 0 0;min-height:1px}
.proj-block{border-top:1px solid var(--line);padding:2px 0}
.proj-block:first-of-type{border-top:0}
.proj-h{display:grid;grid-template-columns:16px auto auto 1fr auto 200px 64px;align-items:center;gap:8px;width:100%;background:none;border:0;padding:10px 0;font-size:13.5px;text-align:left;color:var(--ink)}
.proj-h .chev{color:var(--muted)}
.proj-h .pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.up-bar.mini{height:10px}
.proj-rows{display:none;padding:0 0 10px 24px}
.proj-block.open .proj-rows{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:2px;height:180px;border-bottom:1px solid var(--line);position:relative}
.bars .col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;min-width:3px;height:100%;justify-content:flex-start;cursor:default}
.bars .col i{display:block;border-radius:0}
.bars .col i:last-child{border-radius:4px 4px 0 0}
.bars .col:hover i{filter:brightness(.92)}
.bars-x{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:4px}
.hb{display:grid;grid-template-columns:minmax(120px,240px) 1fr 40px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.hb .t{height:12px;background:#2a78d6;border-radius:0 4px 4px 0}
.tip{position:fixed;z-index:50;background:#14201b;color:#fff;font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;pointer-events:none;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.res-g h3{margin:18px 0 8px}
.res{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;color:var(--ink)}
.res:hover{border-color:var(--brand);box-shadow:0 3px 10px rgba(0,0,0,.05)}
.res .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.res mark{background:#fff1b8;border-radius:3px;padding:0 2px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:1400px){.logo small{display:none}}
@media (max-width:900px){.two{grid-template-columns:1fr}#gs{width:100%}#gsF{order:9;width:100%}}
@media (max-width:760px){.c3,.c4,.c6,.c8{grid-column:span 12}.lp{grid-template-columns:50px 1fr 70px 36px}.lp .evse{grid-column:2 / span 3}nav{margin-left:0}header .in{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="in">
  <div class="logo"><svg viewBox="190 90 800 1000"><polygon points="699,118 262,679 556,679 479,1062 916,501 622,501" fill="#F08C00"/></svg>HAPPY CHARGING Support <small>Betreiber</small></div>
  <nav id="nav" class="hidden"><button data-v="overview" class="on">Übersicht</button><button data-v="projects">Projekte</button><button data-v="incidents">Störungen</button><button data-v="defects">Mängel</button><button data-v="termine">Termine</button><button data-v="field">Maintenance & Actions</button><button data-v="customers">Kontakte</button><button data-v="tickets">QR-Code-Aufrufe</button><button data-v="settings">Einstellungen</button></nav>
  <div class="sp"></div>
  <form id="gsF" class="hidden" autocomplete="off"><input id="gs" type="search" placeholder="🔎 Alles durchsuchen …" title="Volltextsuche: Vorgangsnummer, E-Mail, Telefon, Ladekarte, EVSE-ID, Chat, Beschreibung, Notizen …"></form>
  <button class="btn ghost sm hidden" id="logout">Abmelden</button>
</div></header>
<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>

<script>
const API="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-admin";
const APP="https://qar.gallery/laden/";
const IMG=id=>`https://xsyuhfleesstrchcwspg.supabase.co/storage/v1/object/public/charge-public/stations/${encodeURIComponent(id)}.jpg`;
const TYPES=["CCS","CHAdeMO","Typ 2","Typ 2 (Kabel)","Schuko","Tesla"];
const $=s=>document.querySelector(s), main=$("#main");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token=null; try{ token=sessionStorage.getItem("hc_admin"); }catch(e){}
let STATIONS=[];

function toast(msg,err){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("err",!!err); t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2800); }
const FAPI="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-field";
async function fapi(action,payload={}){
  const r=await fetch(FAPI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ logout(); throw new Error("Bitte neu anmelden"); }
  if(!r.ok) throw new Error(j.error||("Fehler "+r.status));
  if(j&&j.role_info) setRoleInfo(j.role_info); if(j&&j.remind!=null) REM={remind:j.remind,urgent:j.urgent}; return j;
}
async function api(action,payload={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401 && action!=="login" && action!=="set_password"){ logout(); throw new Error("Bitte neu anmelden"); }
  if(!r.ok) throw new Error(j.error||("Fehler "+r.status));
  return j;
}
function logout(){ token=null; try{ sessionStorage.removeItem("hc_admin"); }catch(e){} $("#nav").classList.add("hidden"); $("#logout").classList.add("hidden"); loginView(); }
$("#logout").onclick=logout;
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){ const tp=document.querySelector(".tip"); if(tp) tp.classList.add("hidden"); document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); ({overview:overviewView,search:searchView,projects:projectsView,incidents:incidentsView,customers:customersView,field:fieldView,defects:defectsView,termine:termineView,tickets:ticketsView,settings:settingsView})[v](); }

/* ---------- Login ---------- */
function loginView(){
  main.innerHTML=`<div class="card login"><h1>Anmelden</h1><p class="sub">Betreiber-Dashboard für Projekte, Charger und Ladepunkte.</p>
  <form id="lf"><label>Passwort</label><input type="password" id="pw" autocomplete="current-password" autofocus>
  <button class="btn" style="width:100%;margin-top:12px">Anmelden</button></form></div>`;
  $("#lf").onsubmit=async e=>{ e.preventDefault();
    try{ const r=await api("login",{password:$("#pw").value}); token=r.token; try{ sessionStorage.setItem("hc_admin",token); }catch(e){} start(); }
    catch(err){ toast(err.message,true); } };
}
function start(){ $("#nav").classList.remove("hidden"); $("#gsF").classList.remove("hidden"); $("#logout").classList.remove("hidden"); go("overview"); }
$("#gsF").onsubmit=e=>{ e.preventDefault(); SQ.q=$("#gs").value.trim(); if(SQ.q.length>=2) go("search"); };

/* ---------- Projekte ---------- */
const lpCount=s=>(s.chargers||[]).reduce((a,c)=>a+(c.connectors||[]).length,0);
const evseMissing=s=>(s.chargers||[]).reduce((a,c)=>a+(c.connectors||[]).filter(x=>!x.evse).length,0);
async function projectsView(){
  main.innerHTML=`<div class="row" style="margin-bottom:14px"><div><h1>Projekte / Standorte</h1><p class="sub" style="margin:0">Änderungen sind sofort in der Kunden-App sichtbar.</p></div><div class="sp"></div><button class="btn" id="new">+ Neues Projekt</button></div><div class="grid" id="plist"><div class="muted">Lade …</div></div>`;
  $("#new").onclick=()=>editView(null);
  try{ STATIONS=(await api("list")).stations; }catch(e){ return toast(e.message,true); }
  $("#plist").innerHTML=projTiles();
  wireTiles($("#plist"));
}
// Projekt-Kacheln (Projekte-Seite und Übersicht) + Kachel „Neues Projekt“
function projTiles(openBy,only){ return STATIONS.map((s,i)=>{ if(only&&s.id!==only) return ""; const o=openBy?openBy[s.id]||0:0; return `<div class="card pcard" data-i="${i}">
    <div class="row"><div class="pid">${esc(s.project_id||s.id)}</div><div class="sp"></div>${o?`<span class="badge warn">⚠ ${o} gestört</span> `:""}${s.active?`<span class="badge">aktiv</span>`:`<span class="badge off">inaktiv</span>`}</div>
    <div style="font-weight:600;margin-top:2px">${esc(s.name||"")}</div><div class="muted">${esc(s.address||"")}</div>
    <div class="row" style="margin-top:10px;gap:6px"><span class="badge amber">${(s.chargers||[]).length} Charger</span><span class="badge amber">${lpCount(s)} Ladepunkte</span>${evseMissing(s)?`<span class="badge warn">${evseMissing(s)} ohne EVSE-ID</span>`:""}</div>
    <div class="stats"><div><b>${s.stats.visits}</b>QR-Aufrufe 30 T.</div><div><b>${s.stats.tickets}</b>Meldungen</div><div><b>${s.stats.danger}</b>Gefahr</div></div>
  </div>`; }).join("")+(only?`<button class="card pcard newtile" id="allTiles" style="min-height:120px"><span>⟲</span>Alle Projekte anzeigen</button>`:"")+`<button class="card pcard newtile" id="newTile"><span>＋</span>Neues Projekt anlegen</button>`; }
function wireTiles(root){ root.querySelectorAll(".pcard[data-i]").forEach(c=>c.onclick=()=>{ document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="projects")); editView(STATIONS[+c.dataset.i]); });
  const at=root.querySelector("#allTiles"); if(at) at.onclick=()=>{ OF.station=""; const sel=$("#oSt"); if(sel) sel.value=""; loadOverview(); };
  root.querySelector("#newTile").onclick=()=>{ document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="projects")); editView(null); }; }

/* ---------- Editor ---------- */
let E=null; // Arbeitskopie
function blankStation(){ return {id:"",project_id:"",name:"",address:"",review_url:"",notify_email:"",lat:null,lng:null,active:true,chargers:[{label:"LS#1",model:"",connectors:[{t:"CCS",kw:null,evse:""},{t:"CCS",kw:null,evse:""}]}]}; }
function editView(s){
  E=s?JSON.parse(JSON.stringify(s)):blankStation(); E.original_id=s?s.id:null;
  renderEditor();
}
function renderEditor(){
  const isNew=!E.original_id, code=E.project_id||E.id;
  main.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" id="back">‹ Projekte</button><h1 style="margin:0">${isNew?"Neues Projekt":"Projekt "+esc(code)}</h1><div class="sp"></div>
    ${!isNew?`<a class="btn ghost sm" href="${APP}#${encodeURIComponent(code)}" target="_blank" rel="noopener">In App öffnen ↗</a>`:""}
    <button class="btn" id="save">Speichern</button></div>

  <div class="card"><h2>Standort</h2><div class="form">
    <div class="c3"><label>Projekt-ID</label><input id="f_project_id" value="${esc(E.project_id)}" placeholder="z. B. 1295"><div class="hint">QR-Code / Link: …/laden/#ID</div></div>
    <div class="c3"></div>
    <div class="c6"><label>Name (nur intern, z. B. Betreiber)</label><input id="f_name" value="${esc(E.name)}"></div>
    <div class="c6"><label>Adresse (sichtbar für Kunden)</label><input id="f_address" value="${esc(E.address)}"></div>
    <div class="c3"><label>Breitengrad</label><input id="f_lat" value="${E.lat??""}" inputmode="decimal"></div>
    <div class="c3"><label>Längengrad</label><input id="f_lng" value="${E.lng??""}" inputmode="decimal"></div>
    <div class="c8"><label>Google-Bewertungslink</label><input id="f_review_url" value="${esc(E.review_url)}" placeholder="https://search.google.com/local/writereview?placeid=…"><div class="hint">Erscheint nach erfolgreicher Hilfe. Place-ID finden: <a href="https://developers.google.com/maps/documentation/places/web-service/place-id" target="_blank" rel="noopener">Place ID Finder</a></div></div>
    <div class="c4"><label>Abweichende Benachrichtigungs-Mail</label><input id="f_notify_email" value="${esc(E.notify_email)}" placeholder="leer = Standard-Empfänger"></div>
    ${!isNew?`<div class="c12"><label>Standortbild (oben in der Kunden-App)</label><div class="row" style="align-items:flex-start">
      <img id="stImg" src="${IMG(E.original_id)}?v=${Date.now()}" onerror="this.style.display='none';document.getElementById('noImg').style.display='flex'" style="width:240px;height:135px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
      <div id="noImg" style="display:none;width:240px;height:135px;border:1.5px dashed var(--line);border-radius:10px;align-items:center;justify-content:center;color:var(--muted)">noch kein Bild</div>
      <div><input type="file" accept="image/*" id="imgIn" class="hidden"><button class="btn ghost sm" id="imgUp">Foto hochladen</button> <button class="btn ghost sm" id="imgDel">Entfernen</button>
      <div class="hint" style="max-width:360px">Eigenes Foto der Ladestation (Querformat). Bilder aus Google Maps dürfen nicht übernommen werden.</div></div></div></div>`:""}
    <div class="c12"><label>Parken & Tarife – Info für Kunden (erscheint in der App unter „Parken / Tarife / Schranke“)</label><textarea id="f_parking" rows="3" placeholder="z. B. Parken während des Ladens kostenfrei, max. 2 Std. mit Parkscheibe. Ladepreis: 0,59 €/kWh, Blockiergebühr ab 4 Std.">${esc((E.extras||{}).parking_info||"")}</textarea></div>
    <div class="c12"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" id="f_sanitary" style="width:auto" ${(E.extras||{}).sanitary?"checked":""}> Sanitäre Einrichtungen vorhanden (Kachel „Sanitäre Einrichtungen“ in der App)</label></div>
    <div class="c12"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" id="f_active" style="width:auto" ${E.active!==false?"checked":""}> Aktiv (in der Kunden-App erreichbar)</label></div>
  </div></div>

  <div class="card ${CH_OPEN?"":"ch-closed"}" id="chCard"><div class="row ch-top" style="margin-bottom:10px"><button class="fold-btn" id="chFold" title="ein-/ausklappen">${CH_OPEN?"▾":"▸"}</button><h2 style="margin:0;cursor:pointer" id="chFold2">Charger & Ladepunkte</h2><span class="muted">${E.chargers.length} Charger · ${E.chargers.reduce((a,c)=>a+c.connectors.length,0)} Ladepunkte</span><div class="sp"></div>
      <button class="btn ghost sm ch-only" id="chAll">${E.chargers.every(chFolded)?"Alle aufklappen":"Alle zuklappen"}</button><button class="btn ghost sm" id="addCh">+ Charger</button></div>
    <div id="chs">${E.chargers.map((c,i)=>chargerHTML(c,i)).join("")}</div></div>

  <div class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Checklisten (Maintenance)</h2><div class="sp"></div><a href="#" id="toLists" class="muted" style="font-size:13px">Checklisten bearbeiten ›</a></div>
    <p class="sub">Welche Checklisten Techniker, Reinigung & Co. an diesem Standort in der Service-App sehen. Listen mit „alle Projekte“ sind bei neuen Projekten automatisch aktiv.</p><div id="clAssign" class="muted">Lade …</div></div>

  ${!isNew?`<div class="card"><h2>QR-Schild</h2><p class="sub">Ein Schild für den ganzen Standort – der Kunde wählt Charger und Ladepunkt (per EVSE-ID) in der App. Druckfertig als PNG.</p><div class="qr-row" id="qrs"></div></div>`:""}

  ${!isNew?`<div class="card"><h2>Projekt entfernen</h2><p class="sub">Hat das Projekt schon QR-Code-Aufrufe, wird es nur deaktiviert (Protokolle bleiben erhalten).</p><button class="btn warn" id="del">Projekt löschen / deaktivieren</button></div>`:""}`;
  $("#back").onclick=projectsView;
  $("#save").onclick=save;
  const tgl=()=>{ CH_OPEN=!CH_OPEN; $("#chCard").classList.toggle("ch-closed",!CH_OPEN); $("#chFold").textContent=CH_OPEN?"▾":"▸"; };
  $("#chFold").onclick=tgl; $("#chFold2").onclick=tgl;
  $("#chAll").onclick=()=>{ collect(); const v=!E.chargers.every(chFolded); E.chargers.forEach(c=>setFold(c,v)); renderEditor(); };
  $("#addCh").onclick=()=>{ collect(); E.chargers.forEach(c=>setFold(c,true)); CH_OPEN=true; const n=E.chargers.length+1; E.chargers.push({label:"LS#"+n,model:"",connectors:[{t:"CCS",kw:null,evse:""},{t:"CCS",kw:null,evse:""}]}); setFold(E.chargers[E.chargers.length-1],false); renderEditor(); };
  wireChargers(); fillClAssign(isNew);
  $("#toLists").onclick=e=>{ e.preventDefault(); FF.tab="lists"; go("field"); };
  if(!isNew){ renderQRs(); $("#del").onclick=del; wireImage(); }
}
function shrinkImg(file){ return new Promise(res=>{ const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.82)); };
  img.onerror=()=>res(null); img.src=u; }); }
function wireImage(){
  $("#imgUp").onclick=()=>$("#imgIn").click();
  $("#imgIn").addEventListener("change",e=>e.stopPropagation()); $("#imgIn").addEventListener("input",e=>e.stopPropagation());
  $("#imgIn").onchange=async()=>{ const f=$("#imgIn").files[0]; if(!f) return; const data=await shrinkImg(f); if(!data) return toast("Bild konnte nicht gelesen werden",true);
    try{ const r=await api("upload_image",{id:E.original_id,data}); const im=$("#stImg"); im.style.display=""; $("#noImg").style.display="none"; im.src=r.url; toast("Bild gespeichert – in der App sichtbar ✓"); }catch(e){ toast(e.message,true); } };

function renderQRs(){
  const code=E.project_id||E.id, url=APP+"#"+encodeURIComponent(code), box=$("#qrs");
  box.innerHTML=`<div class="qr" style="width:auto"><img id="qrSign" alt="QR-Schild" style="width:260px;border:1px solid var(--line);border-radius:10px"><br><button class="btn ghost sm" id="qrDl" style="margin-top:10px">PNG laden</button></div>`;
  const tmp=document.createElement("div"); tmp.style.display="none"; document.body.appendChild(tmp);
  if(!window.QRCode){ box.innerHTML='<div class="muted">QR-Bibliothek nicht geladen.</div>'; return; }
  new QRCode(tmp,{text:url,width:1000,height:1000,correctLevel:QRCode.CorrectLevel.M});
  const draw=()=>{
    const q=tmp.querySelector("canvas"); if(!q) return setTimeout(draw,50);
    const W=1200, top=430, qs=900, H=top+qs+170, c=document.createElement("canvas"); c.width=W; c.height=H;
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.fillStyle="#000"; g.textAlign="center"; g.textBaseline="alphabetic";
    g.font="800 104px Inter, Arial, sans-serif"; g.fillText("LÄUFT ALLES?",W/2,165);

    g.font="500 54px Inter, Arial, sans-serif"; g.fillText("Scannen und LIVE-Feedback starten.",W/2,385);
    g.imageSmoothingEnabled=false; g.drawImage(q,(W-qs)/2,top,qs,qs);
    g.font="700 64px Inter, Arial, sans-serif"; g.fillText("Standort "+code,W/2,top+qs+110);
    const png=c.toDataURL("image/png"); $("#qrSign").src=png; tmp.remove();
    $("#qrDl").onclick=()=>{ const a=document.createElement("a"); a.href=png; a.download="qr-standort-"+String(code).replace(/[^A-Za-z0-9_-]/g,"_")+".png"; a.click(); };

  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(draw);
}

/* ---------- Dauer & Zeitstrahl einer Störung ---------- */
/* Laufzeit-Uhr: „offen seit“ zählt sekündlich hoch */
const liveFmt=ms=>{ const t=Math.max(0,Math.floor(ms/1000)), d=Math.floor(t/86400), h=Math.floor(t/3600)%24, m=Math.floor(t/60)%60, sec=t%60, p=n=>String(n).padStart(2,"0");
  return (d?d+" T. ":"")+p(h)+":"+p(m)+":"+p(sec)+(d?"":" h"); };
setInterval(()=>document.querySelectorAll("[data-since]").forEach(e=>{ e.textContent=liveFmt(Date.now()-+e.dataset.since); }),1000);
function durBadge(i){ const a=+new Date(i.created_at), b=i.resolved_at?+new Date(i.resolved_at):Date.now(), d=fmtDur(b-a);
  return i.resolved_at?`<span class="badge" title="von Meldung bis erledigt">✓ ${d}</span>`:`<span class="badge warn live" title="seit erster Meldung offen">⏱ offen seit <b data-since="${a}">${liveFmt(b-a)}</b></span>`; }
function incSummary(list){
  const now=Date.now(), done=list.filter(i=>i.resolved_at), open=list.filter(i=>!i.resolved_at);
  const dur=i=>(i.resolved_at?+new Date(i.resolved_at):now)-+new Date(i.created_at);
  const sum=a=>a.reduce((x,i)=>x+dur(i),0), dd=done.map(dur).sort((a,b)=>a-b);
  const med=dd.length?(dd.length%2?dd[dd.length>>1]:(dd[dd.length/2-1]+dd[dd.length/2])/2):0;
  const oldest=open.reduce((m,i)=>Math.min(m,+new Date(i.created_at)),now);
  const tile=(k,v,s,cls="")=>`<div class="isum-t ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
  let h="";
  if(done.length) h+=tile("✅ Gesamtzeit erledigt (kumuliert)",fmtDur(sum(done)),`${done.length} Störung${done.length>1?"en":""} · Meldung → erledigt`)
    +tile("Ø je Störung",fmtDur((sum(done)+sum(open))/(done.length+open.length)),open.length?`inkl. ${open.length} offener · nur erledigte Ø ${fmtDur(sum(done)/done.length)}`:`Median ${fmtDur(med)}`)+tile("Längste",fmtDur(dd[dd.length-1]),`kürzeste ${fmtDur(dd[0])}`);
  if(open.length) h+=tile("⏱ Offen seit (kumuliert)",`<span data-sum-open='${JSON.stringify(open.map(i=>+new Date(i.created_at)))}'>${liveFmt(sum(open))}</span>`,`${open.length} offene Störung${open.length>1?"en":""} zusammen`,"open")
    +tile("Älteste offen",`<span data-since="${oldest}">${liveFmt(now-oldest)}</span>`,"läuft seit erster Meldung","open");
  return h?`<div class="isum">${h}</div>`:"";
}
setInterval(()=>document.querySelectorAll("[data-sum-open]").forEach(e=>{ const a=JSON.parse(e.dataset.sumOpen), n=Date.now(); e.textContent=liveFmt(a.reduce((x,t)=>x+(n-t),0)); }),1000);
function incTimeline(i,reports,visits){

/* ---------- Tabellen: laufende Nummer links + Sortieren per Klick auf die Spaltenüberschrift ---------- */
// Datenzeilen = Zeilen ohne colspan; eine direkt folgende Detailzeile (tr.akte) wandert beim Sortieren mit.
const TSORT={};
function sortVal(td){ if(!td) return ""; if(td.dataset.sort!=null) return isNaN(+td.dataset.sort)?td.dataset.sort.toLowerCase():+td.dataset.sort;
  const t=td.textContent.replace(/\s+/g," ").trim();
  let m=t.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})(?:,?\s*(\d{1,2}):(\d{2}))?/);
  if(m){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return +new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)); }
  m=t.match(/(\d+(?:,\d+)?)\s*(Tage?|Std\.?|h\b|Min\.?)/); if(m){ const n=+m[1].replace(",","."); return /Tag/.test(m[2])?n*1440:/Min/.test(m[2])?n:n*60; }
  const c=t.replace(/[€%×\s]|\/h|\/km/g,""); if(/^[−-]?\d[\d.]*(,\d+)?$/.test(c)){ const n=+c.replace(/\./g,"").replace(",",".").replace("−","-"); if(!isNaN(n)) return n; }
  return t.toLowerCase(); }
function enhanceTables(root){
  (root||document).querySelectorAll("#main table").forEach(tbl=>{
    const thead=tbl.tHead, tb=tbl.tBodies[0]; if(!thead||!tb||tbl.classList.contains("mini")||tbl.closest(".akte-in")) return;
    const hr=thead.rows[0]; if(!hr) return;
    if(!hr.querySelector("th.rn")){ const th=document.createElement("th"); th.className="rn"; th.textContent="#"; hr.insertBefore(th,hr.firstChild);
      [...hr.cells].forEach((th,ci)=>{ if(ci===0||!th.textContent.trim()) return; th.classList.add("sortable"); th.title="Klicken zum Sortieren";
        th.onclick=()=>{ const k=tbl.closest("[id]")?.id+"|"+(tb.id||"")+"|"+ci, cur=TSORT[k]; TSORT[k]=cur==="asc"?"desc":"asc";
          Object.keys(TSORT).forEach(x=>{ if(x!==k&&x.startsWith(k.slice(0,k.lastIndexOf("|")+1))) delete TSORT[x]; }); applySort(tbl,ci,TSORT[k]); }; }); }
    const rows=[...tb.rows];
    rows.forEach(r=>{ if(r.querySelector("td.rn")) return; const span=r.cells.length===1&&r.cells[0].colSpan>1;
      if(span){ r.cells[0].colSpan=r.cells[0].colSpan+1; r.dataset.rnDone="1"; return; }
      if(r.dataset.rnDone) return; const td=document.createElement("td"); td.className="rn"; r.insertBefore(td,r.firstChild); });
    // aktive Sortierung erneut anwenden (nach Neuladen der Liste)
    const pre=(tbl.closest("[id]")?.id||"")+"|"+(tb.id||"")+"|"; const key=Object.keys(TSORT).find(x=>x.startsWith(pre));
    if(key) applySort(tbl,+key.split("|")[2],TSORT[key],true); else renumber(tb);
  }); }
function applySort(tbl,ci,dir,quiet){ const tb=tbl.tBodies[0], pairs=[]; let cur=null;
  [...tb.rows].forEach(r=>{ if(r.querySelector("td.rn")){ cur={main:r,extra:[]}; pairs.push(cur); } else if(cur) cur.extra.push(r); else pairs.push({main:r,extra:[],fixed:true}); });
  const data=pairs.filter(p=>!p.fixed); if(data.length<2){ renumber(tb); return; }
  data.sort((a,b)=>{ const x=sortVal(a.main.cells[ci]), y=sortVal(b.main.cells[ci]); const c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"de",{numeric:true}); return dir==="desc"?-c:c; });
  data.forEach(p=>{ tb.appendChild(p.main); p.extra.forEach(e=>tb.appendChild(e)); });
  [...tbl.tHead.rows[0].cells].forEach((th,i)=>{ th.classList.toggle("s-asc",i===ci&&dir==="asc"); th.classList.toggle("s-desc",i===ci&&dir==="desc"); });
  renumber(tb); }
function renumber(tb){ let n=0; [...tb.rows].forEach(r=>{ const c=r.querySelector("td.rn"); if(c) c.textContent=++n; }); }
let ET_H; const ET_MO=new MutationObserver(ms=>{ if(!ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&/^(TR|TABLE|TBODY|DIV)$/.test(n.nodeName)))) return; clearTimeout(ET_H); ET_H=setTimeout(runEnh,30); });
function runEnh(){ const m=document.getElementById("main"); ET_MO.disconnect(); try{ enhanceTables(); }finally{ ET_MO.takeRecords(); ET_MO.observe(m,{childList:true,subtree:true}); } }
ET_MO.observe(document.getElementById("main"),{childList:true,subtree:true});
// Sortier-Auswahl (fachlich): opts = [[key,label]], st = Zustand, onch = Neuaufbau
const sortSel=(id,opts,val)=>`<select id="${id}" class="sortsel" style="width:auto" title="Sortierung">${opts.map(([k,l])=>`<option value="${k}" ${val===k?"selected":""}>↕ ${l}</option>`).join("")}</select>`;
function freqSort(list,keyFn,tie){ const n={}; list.forEach(x=>{ const k=keyFn(x); n[k]=(n[k]||0)+1; }); return list.sort((a,b)=>n[keyFn(b)]-n[keyFn(a)]||String(keyFn(a)).localeCompare(String(keyFn(b)),"de")||(tie?tie(a,b):0)); }

// CSV-Import: Trennzeichen und Spalten automatisch erkennen
function parseCSV(text){ text=text.replace(/^﻿/,""); const first=text.split(/\r?\n/)[0]||""; const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":(first.includes("\t")?"\t":",");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===d){ row.push(f); f=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); f=""; if(row.some(x=>x.trim())) rows.push(row); row=[]; } else f+=ch; }
  row.push(f); if(row.some(x=>x.trim())) rows.push(row); return rows; }
const COLS={name:/^(name|kunde|kundenname|vor.?und.?nachname|ansprechpartner)$/i,company:/^(firma|company|unternehmen|organisation)$/i,email:/^(e-?mail|mail|email.?adresse)$/i,phone:/^(telefon|tel|phone|mobil|handy|telefonnummer)$/i,
  card_no:/^(karte|kartennummer|ladekarte|card|card.?no|card.?number|emaid|vertrags.?id|contract.?id|rfid|token)$/i,emsp:/^(anbieter|emsp|provider|mobilitätsanbieter|kartenanbieter)$/i,status:/^(status|kartenstatus)$/i,notes:/^(notiz|notizen|bemerkung|notes|kommentar)$/i};
function importPreview(text,fname){
  const rows=parseCSV(text); if(rows.length<2) return toast("CSV leer oder ohne Kopfzeile",true);
  const head=rows[0].map(h=>h.trim()), map={}; head.forEach((h,i)=>{ for(const [k,re] of Object.entries(COLS)) if(re.test(h)&&map[k]===undefined) map[k]=i; });
  if(map.name===undefined&&map.email===undefined&&map.card_no===undefined) return toast("Keine passenden Spalten gefunden (Name, E-Mail oder Kartennummer)",true);
  const data=rows.slice(1).map(r=>Object.fromEntries(Object.entries(map).map(([k,i])=>[k,(r[i]||"").trim()])));
  const st=v=>({active:"aktiv",aktiv:"aktiv",blocked:"gesperrt",gesperrt:"gesperrt",inactive:"gesperrt",inaktiv:"gesperrt"})[String(v||"").toLowerCase()]||"aktiv";
  data.forEach(r=>{ r.status=st(r.status); });
  $("#impBox").innerHTML=`<div class="card" style="border-color:#b9d9c8"><h2>CSV-Import: ${esc(fname)}</h2>
    <p class="sub">${data.length} Zeilen erkannt · Spalten: ${Object.keys(map).map(k=>({name:"Name",company:"Firma",email:"E-Mail",phone:"Telefon",card_no:"Kartennummer",emsp:"Anbieter",status:"Status",notes:"Notiz"})[k]+" ← „"+esc(head[map[k]])+"“").join(", ")}.
    Vorhandene Kunden werden über Kartennummer oder E-Mail erkannt und ergänzt – nichts wird doppelt angelegt.</p>
    <div style="overflow:auto"><table><thead><tr>${Object.keys(map).map(k=>`<th>${esc(head[map[k]])}</th>`).join("")}</tr></thead><tbody>${data.slice(0,5).map(r=>`<tr>${Object.keys(map).map(k=>`<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${data.length>5?`<p class="muted">… und ${data.length-5} weitere</p>`:""}
    <div class="row" style="margin-top:10px"><button class="btn" id="impGo">${data.length} Zeilen importieren</button><button class="btn ghost" id="impX">Abbrechen</button></div></div>`;
  $("#impX").onclick=()=>$("#impBox").innerHTML="";
  $("#impGo").onclick=async e=>{ e.target.disabled=true; try{ const r=await api("import_customers",{rows:data});

    <label style="margin-top:10px">Sichtbar für</label>${roleChecks("l-role",c.roles)}

    <div class="asg"><div class="asg-chips">${(c.assign_companies||[]).map((n,i)=>`<span class="chip-c">🏢 ${esc(n)} <a href="#" data-rmc="${i}">×</a></span>`).join("")}${(c.assign_staff||[]).map((id,i)=>`<span class="chip-c">👤 ${esc((FSTAFF.find(x=>x.id===id)||{}).name||"Person")} <a href="#" data-rms="${i}">×</a></span>`).join("")}${!(c.assign_companies||[]).length&&!(c.assign_staff||[]).length?'<span class="muted" style="font-size:13px">alle Personen der gewählten Rollen</span>':""}</div>
      <input class="asg-q" placeholder="🔎 Kontakt, Firma oder Mitarbeiter suchen …"><div class="asg-res"></div></div>

      <label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="radio" name="lall" class="l-all" value="sel" style="width:auto" ${c.all_stations===false?"checked":""}> Nur ausgewählte Projekte</label></div>
    <div class="cards-ed" style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px">${STATIONS.map(st=>{ const on=c.all_stations!==false?!(c.excluded_stations||[]).includes(st.id):(c.stations||[]).includes(st.id);
      return `<div class="l-strow"><label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0;flex:1"><input type="checkbox" class="l-st" value="${esc(st.id)}" style="width:auto" ${on?"checked":""}> <b>${esc(st.project_id||st.id)}</b> <span class="muted">${esc(st.name||"")}</span></label><span class="muted" style="font-size:12px">eigener Termin</span><input type="date" class="l-std" data-st="${esc(st.id)}" value="${esc((c.due_dates||{})[st.id]||"")}" style="width:auto;padding:4px 8px"></div>`; }).join("")||'<span class="muted">Noch keine Projekte.</span>'}</div>
    <div class="hint">${c.all_stations!==false?"Abgewählte Projekte sind Ausnahmen – jedes neue Projekt bekommt die Liste automatisch.":"Neue Projekte bekommen die Liste nicht automatisch – im Projekt-Editor zuschaltbar."}</div>
    <label style="margin-top:12px">Prüfpunkte</label><div id="lItems">${c.items.map(row).join("")}</div>
    <button class="btn ghost sm" id="lAdd" style="margin-top:8px">+ Prüfpunkt</button>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)"><input type="checkbox" class="l-active" style="width:auto" ${c.active!==false?"checked":""}> aktiv</label>
    <div class="row" style="margin-top:12px"><button class="btn" id="lSave">Speichern</button>${isNew?"":`<button class="btn warn sm" id="lDel">Löschen</button>`}</div></div>`;
    $("#lX").onclick=()=>$("#clEd").innerHTML="";
    const ed=$("#clEd"), aq=ed.querySelector(".asg-q"), ares=ed.querySelector(".asg-res"); let ah;
    ed.querySelectorAll("[data-rmc]").forEach(a=>a.onclick=e=>{ e.preventDefault(); collectL(); c.assign_companies.splice(+a.dataset.rmc,1); draw(); });
    ed.querySelectorAll("[data-rms]").forEach(a=>a.onclick=e=>{ e.preventDefault(); collectL(); c.assign_staff.splice(+a.dataset.rms,1); draw(); });
    aq.oninput=()=>{ clearTimeout(ah); ah=setTimeout(async()=>{ const q=aq.value.trim().toLowerCase(); if(q.length<2){ ares.innerHTML=""; return; }
      await ensureStaff(); const crm=await contactSearch(q);
      const comps=[...new Set([...crm.map(k=>k.company),...FSTAFF.map(x=>x.company)].filter(x=>x&&x.toLowerCase().includes(q)))].slice(0,8);
      const staff=FSTAFF.filter(x=>[x.name,x.company,x.email].join(" ").toLowerCase().includes(q)).slice(0,8);
      const linked=new Set(FSTAFF.map(x=>x.contact_id).filter(Boolean)), crmOnly=crm.filter(k=>!linked.has(k.id)&&k.name).slice(0,5);
      ares.innerHTML=[...comps.map(n=>`<button type="button" class="asg-r" data-c="${esc(n)}">🏢 <b>${esc(n)}</b> <span class="muted">Firma – alle Mitarbeiter dieser Firma</span></button>`),
        ...staff.map(x=>`<button type="button" class="asg-r" data-s="${esc(x.id)}">👤 <b>${esc(x.name)}</b> <span class="muted">${esc(x.company||"")} · ${esc(FROLES[x.role]||x.role)}</span></button>`),
        ...crmOnly.map(k=>`<div class="asg-r off">📇 ${esc(k.name)}${k.company?" · "+esc(k.company):""} <span class="muted">– Kontakt ohne Service-Zugang (im Reiter „Mitarbeiter“ anlegen)</span></div>`)].join("")||'<div class="muted" style="padding:6px">Nichts gefunden.</div>';
      ares.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ collectL(); c.assign_companies=[...new Set([...(c.assign_companies||[]),b.dataset.c])]; draw(); });
      ares.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ collectL(); c.assign_staff=[...new Set([...(c.assign_staff||[]),b.dataset.s])]; draw(); }); },250); };
    document.querySelectorAll("#clEd .l-all").forEach(r=>r.onchange=()=>{ collectL(); if(!c.all_stations&&!(c.stations||[]).length) c.stations=STATIONS.filter(st=>!(c.excluded_stations||[]).includes(st.id)).map(st=>st.id); if(c.all_stations) c.excluded_stations=STATIONS.filter(st=>!(c.stations||[]).includes(st.id)).map(st=>st.id); draw(); });
    $("#lAdd").onclick=()=>{ collectL(); c.items.push({type:"check",text:"",required:false}); draw(); };
    document.querySelectorAll("#lItems .lp").forEach(r=>{ const i=+r.dataset.i;
      r.querySelector(".it-type").onchange=()=>{ collectL(); draw(); };
      r.querySelector(".it-rm").onclick=()=>{ collectL(); c.items.splice(i,1); draw(); };
      r.querySelector(".it-up").onclick=()=>{ collectL(); if(i>0){ [c.items[i-1],c.items[i]]=[c.items[i],c.items[i-1]]; } draw(); };
      r.querySelector(".it-dn").onclick=()=>{ collectL(); if(i<c.items.length-1){ [c.items[i+1],c.items[i]]=[c.items[i],c.items[i+1]]; } draw(); }; });
    $("#lSave").onclick=async()=>{ collectL(); c.items=c.items.filter(it=>it.text.trim()); try{ await fapi("checklist_save",{checklist:c}); toast("Checkliste gespeichert ✓"); FCL=(await fapi("checklist_list")).checklists; fLists(); }catch(e){ toast(e.message,true); } };
    if($("#lDel")) $("#lDel").onclick=async()=>{ if(!confirm(`„${c.title}“ löschen? Gibt es schon Protokolle, wird sie nur deaktiviert.`)) return; try{ const r=await fapi("checklist_delete",{id:c.id}); toast(r.deactivated?"Deaktiviert (Protokolle bleiben)":"Gelöscht"); FCL=(await fapi("checklist_list")).checklists; fLists(); }catch(e){ toast(e.message,true); } };
    $("#clEd").scrollIntoView({behavior:"smooth",block:"start"}); };
  draw();
}

/* ---------- Termine: alles mit Datum in der Zukunft (Checklisten-Fälligkeiten, Mängel-Fristen, eigene Termine) ---------- */
let TM={mode:"list",station:"",types:{termin:true,checkliste:true,mangel:true},ahead:"90",month:null,open:{},data:null};
const TM_T={termin:["📅","Termin","t-ap"],checkliste:["📋","Checkliste","t-cl"],mangel:["🛠","Mangel","t-mg"]};
let TM_KINDS={termin:"Termin",wartung:"Wartung",pruefung:"Prüfung",begehung:"Begehung",reinigung:"Reinigung",foto:"Fotoshooting",behoerde:"Behördentermin",lieferung:"Lieferung / Montage",sonstiges:"Sonstiges"};
const tmTime=it=>it.type==="termin"&&!it.all_day?new Date(it.at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+(it.ends_at?"–"+new Date(it.ends_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""):"";
const tmWho=it=>{ const s=(it.assign_staff||[]).map(id=>(FSTAFF.find(x=>x.id===id)||{}).name).filter(Boolean), c=it.assign_companies||[];
  if(it.type==="checkliste") return (it.roles||[]).map(r=>FROLES[r]||r).join(", ");
  return [...c.map(x=>"🏢 "+x),...s.map(x=>"👤 "+x)].join(", ")||(it.type==="termin"?"alle":""); };
const tmDayKey=iso=>isoD(iso);
async function termineView(){
  if(!STATIONS.length){ try{ STATIONS=(await api("list")).stations; }catch(e){} }
  if(!TM.month){ const d=new Date(); TM.month=new Date(d.getFullYear(),d.getMonth(),1); }
  main.innerHTML=`<div class="row" style="margin-bottom:12px"><div><h1>Termine</h1><p class="sub" style="margin:0">Alles, was mit Datum geplant ist: eigene <b>Termine</b> (Begehung, Prüfung, Fotoshooting …), fällige <b>Checklisten</b> (Intervall oder festes Datum, inkl. geplanter Wiederholungen) und <b>Mängel</b>-Fristen. Farben: <span class="dtag d-soon">Erinnerung</span> <span class="dtag d-urgent">dringend</span> <span class="dtag d-over">überfällig</span></p></div><div class="sp"></div><button class="btn" id="tmNew">+ Termin</button></div>
  <div class="card" style="padding:12px 14px"><div class="row"><div class="seg" id="tmMode"><button data-m="list" class="${TM.mode==="list"?"on":""}">☰ Liste</button><button data-m="cal" class="${TM.mode==="cal"?"on":""}">▦ Kalender</button></div>
    <select id="tmSt" style="width:auto"><option value="">Alle Projekte</option>${STATIONS.map(s=>`<option value="${esc(s.id)}" ${TM.station===s.id?"selected":""}>${esc(s.project_id||s.id)}</option>`).join("")}</select>
    <div class="row" style="gap:6px" id="tmTy">${Object.entries(TM_T).map(([k,[i,l,c]])=>`<button type="button" class="chip ${TM.types[k]?"on":""} ${c}" data-t="${k}">${i} ${l}</button>`).join("")}</div>
    ${TM.mode==="list"?`<div class="seg" id="tmAh">${[["30","30 T."],["90","90 T."],["180","6 Mon."],["365","1 Jahr"]].map(([k,l])=>`<button data-a="${k}" class="${TM.ahead===k?"on":""}">${l}</button>`).join("")}</div>`:""}</div></div>
  <div id="tmEd"></div><div id="tmBody"><div class="card muted">Lade …</div></div>`;
  document.querySelectorAll("#tmMode button").forEach(b=>b.onclick=()=>{ TM.mode=b.dataset.m; termineView(); });
  document.querySelectorAll("#tmTy button").forEach(b=>b.onclick=()=>{ TM.types[b.dataset.t]=!TM.types[b.dataset.t]; b.classList.toggle("on"); tmRender(); });
  document.querySelectorAll("#tmAh button").forEach(b=>b.onclick=()=>{ TM.ahead=b.dataset.a; termineView(); });
  $("#tmSt").onchange=()=>{ TM.station=$("#tmSt").value; tmLoad(); };
  $("#tmNew").onclick=()=>tmEdit(null);
  tmLoad();
}
function tmRange(){ if(TM.mode==="cal"){ const m=TM.month, first=new Date(m.getFullYear(),m.getMonth(),1), off=(first.getDay()+6)%7, start=new Date(first); start.setDate(1-off); const end=new Date(start); end.setDate(start.getDate()+41); return [isoD(start),isoD(end),start]; }
  return [isoD(Date.now()-30*864e5),isoD(Date.now()+(+TM.ahead)*864e5)]; }
async function tmLoad(){ const [from,to]=tmRange(); await ensureStaff();
  try{ const r=await fapi("schedule",{from,to,station:TM.station}); if(r.kinds) TM_KINDS=r.kinds; TM.data=r; tmRender(); }catch(e){ const b=$("#tmBody"); if(b) b.innerHTML=`<div class="card" style="color:#b42318">${esc(e.message)}</div>`; } }
const tmItems=()=>((TM.data&&TM.data.items)||[]).filter(it=>TM.types[it.type]);
function tmChip(it,small){ const [ic,,c]=TM_T[it.type], di=it.type==="termin"&&it.done?null:dueInfo(it.at,it.remind,it.urgent), st=stOf(it.station_id);
  const lbl=it.type==="termin"?(TM_KINDS[it.kind]||"Termin"):it.type==="mangel"?"Prio "+(it.priority||"B"):(it.planned?"geplant":"fällig");
  if(small) return `<button type="button" class="cal-it ${c} ${di&&di.d<=it.remind?di.cls:""} ${it.done?"done":""} ${it.planned?"planned":""}" data-k="${esc(tmKey(it))}" title="${esc(it.title+" · "+(st?st.project_id||st.id:""))}">${ic} ${tmTime(it)?`<b>${tmTime(it).slice(0,5)}</b> `:""}${esc(it.title)}</button>`;
  return `<div class="tm-row ${c} ${it.done?"done":""}" data-k="${esc(tmKey(it))}"><div class="tm-d"><b>${new Date(it.at).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}</b><small class="muted">${tmTime(it)||(it.type==="termin"&&it.all_day?"ganztägig":"")}</small></div>
    <div class="tm-i">${ic}</div><div class="tm-m"><b>${esc(it.title)}</b> <span class="badge ${it.type==="mangel"&&it.priority==="A"?"warn":"amber"}">${esc(lbl)}</span>${it.done?' <span class="badge">erledigt</span>':""}${it.checklist_title?` <span class="badge off">📋 ${esc(it.checklist_title)}</span>`:""}
    <br><small class="muted">${esc(st?(st.project_id||st.id):"ohne Projekt")}${it.defect_no?" · "+esc(it.defect_no):""}${tmWho(it)?" · "+esc(tmWho(it)):""}${it.fixed?" · fester Termin":it.planned?" · Wiederholung (Intervall)":""}</small></div>
    <div class="tm-s">${di?`<span class="dtag ${di.cls}">${di.txt}</span>`:""}</div></div>`; }
const tmKey=it=>it.type+"|"+(it.id||"")+"|"+(it.station_id||"")+"|"+it.at;
function tmRender(){ const box=$("#tmBody"); if(!box||!TM.data) return; const L=tmItems();
  if(TM.mode==="cal") return tmCal(box,L);
  const now=Date.now(), over=L.filter(it=>!(it.type==="termin"&&it.done)&&dueInfo(it.at).d<0), rest=L.filter(it=>!over.includes(it)&&dueInfo(it.at).d>=0);
  const groups=[]; if(over.length) groups.push(["over","⏰ Überfällig",over]);
  const byM={}; rest.forEach(it=>{ const k=it.at.slice(0,7); (byM[k]=byM[k]||[]).push(it); });
  Object.keys(byM).sort().forEach(k=>groups.push([k,new Date(k+"-15").toLocaleDateString("de-DE",{month:"long",year:"numeric"}),byM[k]]));
  const cnt=(l,cls)=>l.filter(it=>{ const d=dueInfo(it.at,it.remind,it.urgent); return d&&d.cls===cls&&!(it.type==="termin"&&it.done); }).length;
  const ap=L.filter(it=>it.type==="termin"&&!it.done&&+new Date(it.at)>=now), nx=ap[0];
  box.innerHTML=`<div class="isum"><div class="isum-t ${over.length?"open":""}"><div class="k">⏰ Überfällig</div><div class="v">${over.length}</div></div>
    <div class="isum-t"><div class="k">Nächste 14 Tage</div><div class="v">${rest.filter(it=>+new Date(it.at)<now+14*864e5).length}</div><div class="s">${cnt(rest,"d-urgent")} dringend</div></div>
    <div class="isum-t"><div class="k">📅 Eigene Termine</div><div class="v">${ap.length}</div><div class="s">${nx?"nächster "+d2(nx.at):"keine geplant"}</div></div>
    <div class="isum-t"><div class="k">Im Zeitraum gesamt</div><div class="v">${L.length}</div></div></div>
    ${groups.length?groups.map(([k,t,l])=>{ const o=!!TM.open[k]; return `<div class="card tm-g ${o?"open":""}" data-g="${esc(k)}"><button type="button" class="tm-gh"><span class="chev">${o?"▾":"▸"}</span><b>${esc(t)}</b><span class="muted">${l.length} Eintr${l.length>1?"äge":"ag"}</span><span class="sp"></span>
      ${cnt(l,"d-over")?`<span class="dtag d-over">${cnt(l,"d-over")} überfällig</span>`:""}${cnt(l,"d-urgent")?`<span class="dtag d-urgent">${cnt(l,"d-urgent")} dringend</span>`:""}${cnt(l,"d-soon")?`<span class="dtag d-soon">${cnt(l,"d-soon")} Erinnerung</span>`:""}</button>
      <div class="tm-gb">${l.map(it=>tmChip(it)).join("")}</div></div>`; }).join(""):`<div class="card muted">Keine Einträge im Zeitraum.</div>`}`;
  box.querySelectorAll(".tm-gh").forEach(h=>h.onclick=()=>{ const g=h.parentElement, o=!g.classList.contains("open"); g.classList.toggle("open",o); h.querySelector(".chev").textContent=o?"▾":"▸"; TM.open[g.dataset.g]=o; });
  tmWire(box,L); }
function tmCal(box,L){ const [,,start]=tmRange(), m=TM.month, today=isoD(Date.now()), by={};
  L.forEach(it=>{ const k=tmDayKey(it.at); (by[k]=by[k]||[]).push(it); });
  let cells=""; for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=isoD(d), l=by[k]||[], out=d.getMonth()!==m.getMonth();
    cells+=`<div class="cal-c ${out?"out":""} ${k===today?"today":""} ${(d.getDay()+6)%7>4?"we":""}" data-d="${k}"><div class="cal-n"><span>${d.getDate()}</span><button type="button" class="cal-add" data-d="${k}" title="Termin an diesem Tag">+</button></div>
      ${l.slice(0,4).map(it=>tmChip(it,true)).join("")}${l.length>4?`<button type="button" class="cal-more" data-d="${k}">+${l.length-4} weitere</button>`:""}</div>`; }
  box.innerHTML=`<div class="card" style="padding:12px"><div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="calP">‹</button><h2 style="margin:0;min-width:180px;text-align:center">${m.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</h2><button class="btn ghost sm" id="calN">›</button><button class="btn ghost sm" id="calT">Heute</button><span class="sp"></span><span class="muted" style="font-size:12px">Tag anklicken = Liste · „+“ = neuer Termin</span></div>
    <div class="cal"><div class="cal-h">Mo</div><div class="cal-h">Di</div><div class="cal-h">Mi</div><div class="cal-h">Do</div><div class="cal-h">Fr</div><div class="cal-h">Sa</div><div class="cal-h">So</div>${cells}</div></div><div id="calDay"></div>`;
  const mv=n=>{ TM.month=new Date(m.getFullYear(),m.getMonth()+n,1); termineView(); };
  $("#calP").onclick=()=>mv(-1); $("#calN").onclick=()=>mv(1); $("#calT").onclick=()=>{ TM.month=null; termineView(); };
  box.querySelectorAll(".cal-add").forEach(b=>b.onclick=e=>{ e.stopPropagation(); tmEdit(null,b.dataset.d); });
  const day=k=>{ const l=by[k]||[]; $("#calDay").innerHTML=`<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">${new Date(k+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"})}</h2><span class="sp"></span><button class="btn ghost sm" id="cdAdd">+ Termin</button></div>${l.map(it=>tmChip(it)).join("")||'<p class="muted">Nichts geplant.</p>'}</div>`;
    $("#cdAdd").onclick=()=>tmEdit(null,k); tmWire($("#calDay"),L); };
  box.querySelectorAll(".cal-c").forEach(c=>c.onclick=e=>{ if(e.target.closest(".cal-it")) return; day(c.dataset.d); });
  tmWire(box,L); }
function tmWire(root,L){ root.querySelectorAll("[data-k]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const it=L.find(x=>tmKey(x)===el.dataset.k); if(!it) return;
  if(it.type==="termin") return tmEdit(it);
  const st=stOf(it.station_id);
  $("#tmEd").innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">${TM_T[it.type][0]} ${esc(it.title)}</h2><span class="sp"></span><button class="btn ghost sm" id="tmX">✕</button></div>
    <p>${esc(st?(st.project_id||st.id)+(st.address?" – "+st.address:""):"")}</p><p>Fällig: ${dueTag(it.at,it.remind,it.urgent)}${it.planned?' <span class="muted">· geplante Wiederholung aus dem Intervall</span>':""}${it.last?` <span class="muted">· zuletzt erledigt ${d2(it.last)}</span>`:""}</p>
    ${it.type==="checkliste"?`<p class="muted">Durchführung: ${esc(tmWho(it))}. Termin und Erinnerung werden in der Checkliste eingestellt.</p><button class="btn ghost sm" id="tmGo">Checkliste öffnen</button>`:`<p class="muted">${esc(PRIO_L[it.priority||"B"]||"")} · ${esc(SRC_L[it.source]||"")}</p><button class="btn ghost sm" id="tmGo">Zu den Mängeln</button>`}</div>`;
  $("#tmX").onclick=()=>$("#tmEd").innerHTML="";

function drawHeat(){
  const box=$("#heatCard"); if(!box||!OV_HEAT) return;
  const g=Array.from({length:7},()=>Array(24).fill(0)), wd=d=>(new Date(d).getDay()+6)%7;   // Mo=0
  if(HEAT_MODE==="inc") OV_HEAT.inc.forEach(i=>{ const d=new Date(i.created_at); g[wd(d)][d.getHours()]+=1; });
  else OV_HEAT.daily.forEach(x=>{ if(x.h==null) return; g[wd(x.d+"T12:00:00")][x.h]+=x.n; });
  const hours=Array(24).fill(0); g.forEach(r=>r.forEach((v,h)=>hours[h]+=v));
  const max=Math.max(1,...g.flat()), hmax=Math.max(1,...hours), tot=hours.reduce((a,b)=>a+b,0);
  const DN=["Mo","Di","Mi","Do","Fr","Sa","So"], unit=HEAT_MODE==="inc"?"Störung(en)":"Aufruf(e)";
  let pk=[0,0,-1]; g.forEach((r,w)=>r.forEach((v,h)=>{ if(v>pk[2]) pk=[w,h,v]; }));
  const ph=hours.indexOf(Math.max(...hours));
  const col=v=>v?`rgba(42,120,214,${(0.15+0.85*v/max).toFixed(2)})`:"#f0f3f1";
  box.innerHTML=`<div class="row" style="margin-bottom:6px"><h2 style="margin:0">Wann passiert es? – Tageszeit & Wochentag</h2><div class="sp"></div>
    <div class="seg" id="heatSeg"><button data-m="inc" class="${HEAT_MODE==="inc"?"on":""}">Störungsmeldungen</button><button data-m="vis" class="${HEAT_MODE==="vis"?"on":""}">Alle QR-Aufrufe</button></div></div>
    <p class="sub" style="margin:0 0 12px">${tot?`${tot} ${unit} im Zeitraum · am häufigsten <b>${DN[pk[0]]} ${pk[1]}–${pk[1]+1} Uhr</b> (${pk[2]}) · stärkste Tageszeit insgesamt <b>${ph}–${ph+1} Uhr</b>`:"Keine Daten im Zeitraum."}</p>
    <div class="heat parts"><span></span>${[["Nacht",0,6],["Morgen",6,12],["Nachmittag",12,18],["Abend",18,24]].map(([l,a,b])=>`<span class="hp" style="grid-column:${a+2} / ${b+2}">${l} ${a}–${b} Uhr</span>`).join("")}</div>
    <div class="heat"><span></span>${Array.from({length:24},(_,h)=>`<span class="hx ${h===ph&&tot?"pk":""}">${String(h).padStart(2,"0")}</span>`).join("")}
      ${g.map((r,w)=>`<span class="hl">${DN[w]}</span>${r.map((v,h)=>`<i class="${w===pk[0]&&h===pk[1]&&tot?"pk":""}" style="background:${col(v)};color:${v/max>.55?"#fff":"#14201b"}" data-tip="<b>${DN[w]} ${h}–${h+1} Uhr</b><br>${v} ${unit}">${v||""}</i>`).join("")}`).join("")}</div>
    <div class="hbars"><span class="hl" style="align-self:center">Σ</span>${hours.map((v,h)=>`<div data-tip="<b>${h}–${h+1} Uhr</b><br>${v} ${unit} (alle Wochentage)"><i style="height:${v/hmax*100}%"></i><em>${v||""}</em></div>`).join("")}</div>
    <div class="heat"><span></span>${Array.from({length:24},(_,h)=>`<span class="hx">${h} Uhr</span>`).join("").replace(/<span class="hx">(\d+) Uhr<\/span>/g,(m,h)=>`<span class="hx">${+h%2===0?h+"h":""}</span>`)}</div>
    <div class="legend" style="margin-top:8px"><span>weniger</span>${[0,.25,.5,.75,1].map(t=>`<b style="background:${t?`rgba(42,120,214,${(0.15+0.85*t).toFixed(2)})`:"#f0f3f1"};width:18px"></b>`).join("")}<span>mehr</span><span style="margin-left:12px">Balken unten = Summe je Stunde</span></div>`;
  box.querySelectorAll("#heatSeg button").forEach(b=>b.onclick=()=>{ HEAT_MODE=b.dataset.m; drawHeat(); });
}

const fmtDur=ms=>{ const h=ms/36e5; return h<1?Math.round(h*60)+" Min.":h<48?(Math.round(h*10)/10).toLocaleString("de-DE")+" Std.":(Math.round(h/24*10)/10).toLocaleString("de-DE")+" Tage"; };
async function loadOverview(){
  const box=$("#ov"); if(!box) return;
  try{
    const my=++OV_REQ; const r=await api("overview",{from:OF.from||isoD(Date.now()-364*864e5),to:OF.to,station:OF.station}); if(my!==OV_REQ) return;
    const F=+new Date(r.from), T=Math.min(+new Date(r.to),+new Date(r.now)), span=Math.max(1,T-F);
    // Verfügbarkeit je Ladepunkt (aus gemeldeten Störungen)
    const rows=[]; let downAll=0, cpN=0;
    for(const st of r.stations){ const cps=st.connectors||[];
      const list=cps.map(c=>{ const segs=r.incidents.filter(i=>i.station_id===st.id&&i.connector===c.n).map(i=>({i,a:Math.max(F,+new Date(i.created_at)),b:Math.min(T,i.resolved_at?+new Date(i.resolved_at):T)})).filter(x=>x.b>x.a).sort((x,y)=>x.a-y.a);
        let down=0,end=F; for(const s of segs){ const a=Math.max(s.a,end); if(s.b>a){ down+=s.b-a; end=s.b; } }
        downAll+=down; cpN++; return {c,segs,down,pct:100*(1-down/span)}; });
      rows.push({st,list}); }
    const avail=cpN?100*(1-downAll/(span*cpN)):100;
    const openNow=r.incidents.filter(i=>i.status!=="erledigt").length;
    const openBy={}; r.incidents.filter(i=>i.status!=="erledigt").forEach(i=>openBy[i.station_id]=(openBy[i.station_id]||0)+1);
    if($("#ovTiles")){ $("#ovTiles").innerHTML=projTiles(openBy,OF.station); wireTiles($("#ovTiles")); }
    const inWin=r.incidents.filter(i=>+new Date(i.created_at)>=F);
    const solvedInc=r.incidents.filter(i=>i.resolved_at&&+new Date(i.resolved_at)>=F);
    const mttr=solvedInc.length?solvedInc.reduce((a,i)=>a+(+new Date(i.resolved_at)-new Date(i.created_at)),0)/solvedInc.length:null;
    // Ø Störungsdauer inkl. offener Störungen (laufen mit ihrer bisherigen Dauer ein und ziehen den Schnitt hoch)
    const openInc=r.incidents.filter(i=>i.status!=="erledigt"), nowMs=Date.now();
    const durAll=[...solvedInc.map(i=>+new Date(i.resolved_at)-new Date(i.created_at)),...openInc.map(i=>nowMs-new Date(i.created_at))];
    const mttrAll=durAll.length?durAll.reduce((a,b)=>a+b,0)/durAll.length:null;
    // Tagesverlauf
    const days=[]; for(let d=new Date(isoD(F)+"T12:00:00"); isoD(d)<=isoD(T); d=new Date(+d+864e5)) days.push(isoD(d));
    const by={}; r.daily.forEach(x=>{ const k=OUTC.some(o=>o[0]===x.outcome)?x.outcome:(x.outcome==="danger"?"ticket":"open"); (by[x.d]||={})[k]=((by[x.d]||{})[k]||0)+x.n; });
    const tot=days.reduce((a,d)=>a+OUTC.reduce((b,o)=>b+((by[d]||{})[o[0]]||0),0),0);
    const self=days.reduce((a,d)=>a+((by[d]||{}).solved||0),0);
    const max=Math.max(1,...days.map(d=>OUTC.reduce((b,o)=>b+((by[d]||{})[o[0]]||0),0)));
    const topP={}; inWin.forEach(i=>{ const k=i.title||"Sonstiges"; topP[k]=(topP[k]||0)+1; });
    const top=Object.entries(topP).sort((a,b)=>b[1]-a[1]).slice(0,6), topMax=Math.max(1,...top.map(x=>x[1]));
    const pctTxt=p=>(Math.floor(p*10)/10).toLocaleString("de-DE",{minimumFractionDigits:1})+" %";
    box.innerHTML=`<div class="kpis">
      <div class="kpi link ${avail<98?"bad":""}" data-go="avail"><div class="k">Verfügbarkeit Ø ›</div><div class="v">${pctTxt(avail)}</div><div class="s">aus Störungsmeldungen · ${cpN} Ladepunkte</div></div>
      <div class="kpi link ${openNow?"bad":""}" data-go="open"><div class="k">Offene Störungen ›</div><div class="v">${openNow}</div><div class="s">${openNow?"⚠ in der App als gestört markiert":"✓ alles frei"}</div></div>
      <div class="kpi link" data-go="new"><div class="k">Neue Störungen ›</div><div class="v">${inWin.length}</div><div class="s">${inWin.reduce((a,i)=>a+i.reports,0)} Meldungen von Kunden</div></div>
      <div class="kpi link ${openInc.length?"bad":""}" data-go="done" title="Erledigte: Meldung → erledigt. Offene: Meldung → jetzt (laufen weiter)."><div class="k">Ø Störungsdauer ›</div><div class="v">${mttrAll?fmtDur(mttrAll):"–"}</div><div class="s">${solvedInc.length} erledigt${openInc.length?` + ${openInc.length} offen (laufen mit)`:""}${openInc.length&&mttr?` · nur erledigte Ø ${fmtDur(mttr)}`:""}</div></div>
      <div class="kpi link" data-go="defects" id="kpiDef"><div class="k">Offene Mängel ›</div><div class="v">…</div><div class="s">kein Ausfall · nach Priorität</div></div>
      <div class="kpi link" data-go="visits"><div class="k">QR-Code-Aufrufe ›</div><div class="v">${tot}</div><div class="s">${tot?Math.round(100*self/tot)+" % selbst gelöst":"–"}</div></div>
    </div>
    <div class="card ${AV_OPEN?"":"av-closed"}" id="availCard"><div class="row" style="margin-bottom:8px"><button type="button" class="av-h" id="avT"><span class="chev">${AV_OPEN?"▾":"▸"}</span> Verfügbarkeit je Ladepunkt</button>
      <span class="muted" style="font-size:13px">Ø ${pctTxt(avail)} · ${cpN} Ladepunkte</span><div class="sp"></div><button class="btn ghost sm av-body" id="avAll" type="button">Alle auf / zu</button></div>
      <div class="av-body">
      <div class="legend"><span><b style="background:#d5eed5;border:1px solid #0ca30c"></b>✓ verfügbar</span><span><b style="background:#d03b3b"></b>⚠ Störung gemeldet (bis „erledigt“)</span><span>Quelle: Kundenmeldungen, keine Live-Daten der Säule</span></div>
      ${rows.map(({st,list})=>{ const pd=list.reduce((a,x)=>a+x.down,0), pp=list.length?100*(1-pd/(span*list.length)):100, bad=list.filter(x=>x.segs.length).length, open=OV_OPEN[st.id]!==undefined?OV_OPEN[st.id]:false;
        return `<div class="proj-block ${open?"open":""}" data-st="${esc(st.id)}"><button class="proj-h" type="button"><span class="chev">${open?"▾":"▸"}</span><b>${esc(st.project_id||st.id)}</b>${st.name?` <span class="muted" style="font-weight:500">· ${esc(st.name)}</span>`:""}
          <span class="sp"></span><span class="muted" style="font-weight:500">${list.length} Ladepunkte · ${bad?`<span style="color:#b42318">⚠ ${bad} mit Störung</span>`:"✓ keine Störung"}</span>
          <div class="up-bar mini" data-tip="${esc(st.project_id||st.id)}: ${pctTxt(pp)} verfügbar">${list.flatMap(x=>x.segs).map(s=>`<i style="left:${(s.a-F)/span*100}%;width:${(s.b-s.a)/span*100}%;opacity:.55"></i>`).join("")}</div>
          <span class="pct" style="color:${pp<98?"#b42318":"var(--ink)"}">${pctTxt(pp)}</span></button>
        <div class="proj-rows">
        ${list.map(({c,segs,pct,down})=>`<div class="up-row"><div class="lbl" title="${esc(c.evse||"")}">${esc(cpLabel(st,c.n))} <small>${esc(c.t||"")}</small></div>
          <div class="up-bar" data-tip="${esc(cpLabel(st,c.n))}<br>${c.evse?esc(c.evse)+"<br>":""}${segs.length?"gestört: "+fmtDur(down):"keine Störung gemeldet"}">${segs.map(s=>`<i style="left:${(s.a-F)/span*100}%;width:${(s.b-s.a)/span*100}%" data-tip="<b>${esc(s.i.ticket_no)}</b> · ${esc(s.i.title||"")}<br>${fmtDT(s.i.created_at)} – ${s.i.resolved_at?fmtDT(s.i.resolved_at):"offen"}<br>Dauer ${fmtDur(s.b-s.a)} · ${s.i.reports}× gemeldet" data-no="${esc(s.i.ticket_no)}"></i>`).join("")}</div>
          <div class="pct" style="color:${pct<98?"#b42318":"var(--ink)"}">${pctTxt(pct)}</div></div>`).join("")}</div></div>`; }).join("")||'<div class="muted">Keine Projekte.</div>'}
      </div><div class="up-axis av-body"><span></span><div><span>${fmtDT(F).split(",")[0]}</span><span>${fmtDT(F+span/2).split(",")[0]}</span><span>${+new Date(r.to)>+new Date(r.now)?"jetzt":fmtDT(T).split(",")[0]}</span></div><span></span></div>
    </div>
    <div class="card" id="heatCard"></div>
    <div class="two">
      <div class="card"><h2>QR-Code-Aufrufe pro Tag</h2>
        <div class="legend">${OUTC.map(o=>`<span><b style="background:${o[2]}"></b>${o[1]}</span>`).join("")}</div>
        <div class="bars">${days.map(d=>{ const v=by[d]||{}, n=OUTC.reduce((a,o)=>a+(v[o[0]]||0),0);
          return `<div class="col" data-tip="<b>${new Date(d+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}</b> · ${n} Aufrufe${OUTC.filter(o=>v[o[0]]).map(o=>`<br>${o[1]}: ${v[o[0]]}`).join("")}">${OUTC.filter(o=>v[o[0]]).map(o=>`<i style="height:calc(${v[o[0]]/max*100}% - 2px);background:${o[2]}"></i>`).join("")}</div>`; }).join("")}</div>
        <div class="bars-x"><span>${new Date(days[0]+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</span><span>max. ${max} / Tag</span><span>${new Date(days[days.length-1]+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</span></div>
      </div>
      <div class="card"><h2>Häufigste Störungen</h2>
        ${top.length?top.map(([t,n])=>`<div class="hb" data-tip="${esc(t)}: ${n} Störung(en)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</span><div><div class="t" style="width:${n/topMax*100}%"></div></div><b>${n}</b></div>`).join(""):'<div class="muted">Keine Störungen im Zeitraum 🎉</div>'}
      </div>
    </div>`;
    OV_HEAT={inc:r.incidents.filter(i=>+new Date(i.created_at)>=F&&+new Date(i.created_at)<=T),daily:r.daily}; drawHeat();
    box.querySelectorAll(".kpi[data-go]").forEach(k=>k.onclick=()=>{ const g=k.dataset.go;
      if(g==="avail") return $("#availCard").scrollIntoView({behavior:"smooth"});
      if(g==="defects"){ Object.assign(FD,{status:"open",station:OF.station||"",prio:""}); return go("defects"); }
      if(g==="visits"){ Object.assign(TF,{q:"",mode:"all",preset:OF.preset,from:OF.from,to:OF.to}); return go("tickets"); }
      Object.assign(IF,{q:"",station:OF.station,filter:g==="open"?"open":g==="done"?"erledigt":"all",preset:g==="open"?"all":OF.preset,from:g==="open"?"":OF.from,to:g==="open"?"":OF.to}); go("incidents"); });
    (async()=>{ try{ const r=await fapi("defect_list",{status:"open",station:OF.station||""}), el=$("#kpiDef"); if(!el) return; const L=r.defects, od=L.filter(x=>x.due_at&&+new Date(x.due_at)<Date.now()).length, a=L.filter(x=>x.priority==="A").length;
      el.querySelector(".v").textContent=L.length; el.querySelector(".s").textContent=L.length?`${a}× Prio A · ${od} überfällig`:"✓ keine offen"; el.classList.toggle("bad",!!(a||od)); }catch(e){} })();
    $("#avT").onclick=()=>{ AV_OPEN=!AV_OPEN; $("#availCard").classList.toggle("av-closed",!AV_OPEN); $("#avT .chev").textContent=AV_OPEN?"▾":"▸"; };
    $("#avAll").onclick=()=>{ const bl=[...box.querySelectorAll(".proj-block")], o=!bl.every(b=>b.classList.contains("open")); bl.forEach(b=>{ b.classList.toggle("open",o); b.querySelector(".chev").textContent=o?"▾":"▸"; OV_OPEN[b.dataset.st]=o; }); };
    box.querySelectorAll(".proj-block .proj-h").forEach(h=>h.onclick=()=>{ const b=h.parentElement, o=!b.classList.contains("open"); b.classList.toggle("open",o); h.querySelector(".chev").textContent=o?"▾":"▸"; OV_OPEN[b.dataset.st]=o; });
    box.querySelectorAll(".up-bar i[data-no]").forEach(s=>s.onclick=()=>{ IF.q=s.dataset.no; IF.filter="all"; setPreset(IF,"all"); go("incidents"); });
  }catch(e){ box.innerHTML=`<div class="card muted">${esc(e.message)}</div>`; }
}

/* ---------- Einstellungen ---------- */
function settingsView(){
  main.innerHTML=`<div class="card" style="max-width:460px"><h2>Passwort ändern</h2>
    <label>Aktuelles Passwort</label><input type="password" id="o" autocomplete="current-password">
    <label style="margin-top:10px">Neues Passwort (mind. 10 Zeichen)</label><input type="password" id="n" autocomplete="new-password">
    <button class="btn" style="margin-top:12px" id="sp">Speichern</button></div>`;
  $("#sp").onclick=async()=>{ try{ await api("set_password",{old:$("#o").value,new:$("#n").value}); toast("Passwort geändert ✓"); $("#o").value=$("#n").value=""; }catch(e){ toast(e.message,true); } };
}

if(token) start(); else loginView();
</script>
