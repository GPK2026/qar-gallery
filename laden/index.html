<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta name="theme-color" content="#f4f6f5">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="HAPPY CHARGING">
<title>HAPPY CHARGING Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#14201b; --muted:#5d6b65; --line:#e1e6e3;
  --brand:#0a8f5a; --brand-ink:#fff; --brand-soft:#e3f4ec;
  --warn:#b42318; --warn-soft:#fdecea; --amber:#9a6700; --amber-soft:#fff6db;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation}
/* App-Rahmen: Kopf + scrollbarer Inhalt + Fußleiste (Eingabe + Tabs) – nichts überlappt */
.app{display:flex;flex-direction:column;height:100vh;height:var(--vvh,100dvh)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 20px}
header.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;width:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
footer.bottom{flex:none;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo .bolt{width:26px;height:32px;flex:none}
.logo span{letter-spacing:.01em}
.logo span b{font-weight:800;letter-spacing:.02em}
.station{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.station .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.station .id{font-weight:700;font-size:18px;margin:2px 0 4px}
.station .addr{font-size:14px;color:var(--muted)}
.cps{display:flex;gap:8px;margin-top:12px}
.cp{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font-size:14px;font-weight:600;color:var(--ink)}
.cp small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cp.on{border-color:var(--brand);background:var(--brand-soft)}
.sel-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.chg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chg{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-size:15px;font-weight:700;color:var(--ink)}
.chg.on{border-color:var(--brand);background:var(--brand-soft)}
.cp-list{display:flex;flex-direction:column;gap:8px}
.cp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink)}
.cp-row.on{border-color:var(--brand);background:var(--brand-soft)}
.cp-l b{display:block;font-size:14px}.cp-l small{color:var(--muted);font-size:12px}
.cp-evse{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;background:var(--bg);border-radius:8px;padding:6px 8px;white-space:nowrap}
.cp-evse.none{background:none;color:var(--muted)}
.cp-row.on .cp-evse{background:#fff}
.lbl-note{text-transform:none;letter-spacing:0;font-weight:400}
.evse-q{margin:0 0 6px}
.evse-res .cp-list{margin-bottom:6px}
.sel-hint{margin-top:10px;font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px}
.cps{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.cp{padding:10px 6px}
.st-pill.need{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.st-img{display:block;width:calc(100% + 32px);margin:-14px -16px 12px;height:150px;object-fit:cover;border-radius:var(--r) var(--r) 0 0}
.station.compact .st-img{display:none}
.st-img[hidden]{display:none}
.tk-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px;margin-left:8px}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.st-pill{display:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.station.compact{padding:10px 14px;margin-bottom:10px}
.station.compact .lbl,.station.compact .addr,.station.compact .cps,.station.compact .evse{display:none}
.station:not(.compact) .evse{display:none}
.evse{font-size:12px;color:var(--muted);margin-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.evse b{font-family:Inter,system-ui,sans-serif;font-weight:600}
.station.compact.open .evse{display:block}
.station.compact .id{font-size:16px;margin:0}
.station.compact .st-pill{display:inline-block}
.station.compact #cps{display:none}
.station.compact.open #cps,.station.compact.open .addr{display:block}
.station.compact.open .addr{margin-top:6px}
h2{font-size:20px;margin:18px 2px 10px}
p.sub{margin:-4px 2px 14px;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#plate{text-transform:uppercase}
.svc-link{text-align:center;margin:6px 0 18px;font-size:13px}.svc-link a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:inline-block;background:#fff}
/* Startseite: Ladepunkt-Auswahl erst nach der Kachel */
.station:not(.compact) #cps,.station:not(.compact) #stEvse{display:none}
.st-hint{font-size:13px;color:#b42318;font-weight:600;margin-top:6px}
.st-hint:empty{display:none}
.station.compact .st-hint{display:none}
.site-h{font-size:15px;margin:22px 2px 10px;color:var(--ink)}
.tile.site{background:#fbfcfb}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:8px;color:var(--ink);transition:transform .08s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:24px;line-height:1}
.tile b{font-size:15px;font-weight:600;line-height:1.25}
.tile.danger{border-color:#f3c1bc;background:var(--warn-soft)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 16px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
.step-n{font-size:13px;color:var(--muted);font-weight:500}
.step-t{font-size:19px;font-weight:700;margin:6px 0 8px;line-height:1.3}
.step-h{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font-weight:600;font-size:16px;margin-top:10px;text-align:center;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--warn);color:#fff}
.back{background:none;border:0;color:var(--muted);padding:6px 0;font-size:15px;margin-bottom:6px}
.note{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin:12px 0}
.note.amber{background:var(--amber-soft);color:var(--amber)}
.note.red{background:var(--warn-soft);color:var(--warn)}
.note.green{background:var(--brand-soft);color:#08603d}
.center{text-align:center}
.big-ic{font-size:46px;text-align:center;margin:6px 0}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input.f,textarea.f{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea.f{min-height:80px;resize:vertical}
.summary{font-size:14px;line-height:1.7;background:var(--bg);border-radius:12px;padding:12px 14px}
.summary b{display:inline-block;min-width:110px;color:var(--muted);font-weight:500}
.review{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.review p{margin:0 0 8px;font-size:14px;color:var(--muted);line-height:1.45}
.btn.google{background:#fff;border:1.5px solid #dadce0;color:#1a73e8}
.tk-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk-actions .btn{margin-top:0;padding:12px 8px;font-size:15px}
.inc-b{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#b42318;background:#fde8e6;border-radius:6px;padding:1px 6px;vertical-align:1px}
.cp-row.bad{border-color:#f3c2bc}
.chg.bad{border-color:#f3c2bc;color:#b42318}
.chg.bad::after{content:" ⚠";font-size:12px}
.known{border-color:#f3c2bc;background:#fff7f6}
.known .alt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.known .alt button{border:1.5px solid #c9e7d8;background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;color:var(--ink);font-size:14px}
.tk-list{margin:8px 0}
.tk-li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #e3efe8}
.tk-li:first-child{border-top:0}
.tk-li code{font-size:16px;font-weight:700;color:#08603d}
.tk-li small{color:var(--muted)}
.home-h{font-size:23px;line-height:1.2;margin:2px 0 12px;letter-spacing:-.3px}
.home-h small{display:block;font-size:15px;font-weight:600;color:var(--brand);margin-top:4px;letter-spacing:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;color:var(--ink);text-align:left;min-height:84px}
.opt span{font-size:22px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.info-box{white-space:pre-wrap;background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;margin-top:8px}
textarea.err{border-color:#d03b3b!important}
.tiles-hint{margin:16px 2px 10px;font-weight:600;color:var(--ink)}
.tk-banner{border-color:#c9e7d8;background:#f6fbf8}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px}
.tk-head small{font-weight:400;color:var(--muted);font-size:13px}
.tk-banner .ticket{margin:10px 0}
.ticket{font-family:ui-monospace,monospace;font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center;background:var(--brand-soft);color:#08603d;border-radius:12px;padding:14px;margin:12px 0}
/* bottom nav */
nav.tabs{display:flex;justify-content:center;padding:4px 8px 2px}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 4px;min-height:52px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
nav.tabs button span{font-size:20px}
nav.tabs button.on{color:var(--brand);font-weight:700}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{border:1.5px solid var(--brand);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;color:#08603d;font-weight:500;text-align:left}
.chip.danger{border-color:#e9a39b;color:var(--warn);background:var(--warn-soft)}
.composer{padding:8px 12px 4px;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
.composer .in{display:flex;gap:8px;max-width:536px;width:100%;align-items:center}
.composer input{flex:1;min-width:0;height:46px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;font-size:16px;background:var(--bg)}
.composer input:focus{outline:none;border-color:var(--brand);background:#fff}
.composer button{flex:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.composer button:disabled{opacity:.4}
.msg.team{background:#eef4ff;border:1px solid #c9dafc;align-self:flex-start;border-bottom-left-radius:4px}
.msg .who{display:block;font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:2px}
.sys{align-self:center;font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;text-align:center;max-width:90%}
.privacy{font-size:12px;color:var(--muted);line-height:1.5;margin:16px 4px 0}
.privacy a{color:inherit}
nav.tabs button{position:relative}
.dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:#e5484d}
.ai-badge{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 8px}
/* hotline */
.phone{font-size:28px;font-weight:700;text-align:center;margin:8px 0 2px;letter-spacing:.02em}
.hours{text-align:center;color:var(--muted);font-size:14px}
.idbox{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.idbox code{font-weight:700;font-size:16px}
.small-btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink)}
/* operator */
.qr-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.qr-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:13px}
.qr-card .q{display:flex;justify-content:center;margin-bottom:8px}
.qr-card code{font-weight:700}
.hidden{display:none!important}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">
      <svg class="bolt" viewBox="190 90 800 1000" aria-hidden="true"><polygon points="699,118 262,679 556,679 479,1062 916,501 622,501" fill="#F08C00"/></svg>
      <span id="brandName"><b>HAPPY CHARGING</b> Support</span>
    </div>
    <button class="small-btn" id="langBtn" aria-label="Sprache">EN</button>
  </header>

  <div class="scroll" id="scroll"><div class="wrap">
  <section class="station" id="stationCard">
    <img class="st-img" id="stImg" alt="" hidden>
    <h1 class="home-h" id="homeH"></h1>
    <div class="lbl" data-i="station">Ladestation</div>
    <div class="st-head"><div class="id" id="stId">–</div><button class="st-pill" id="stPill" aria-label="Ladepunkt wechseln"></button></div>
    <div class="addr" id="stAddr">–</div>
    <div id="cps"></div>
    <div class="evse" id="stEvse"></div>
    <div class="st-hint" id="stHint"></div>
  </section>

  <main id="view"></main>
  <div class="foot"><a href="#betreiber" style="color:inherit;text-decoration:none">·</a></div>
  </div></div>

  <footer class="bottom">
<div class="composer hidden" id="composer"><div class="in">
  <input id="chatIn" placeholder="Nachricht schreiben…" autocomplete="off" enterkeyhint="send">
  <button id="chatSend" aria-label="Senden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div></div>

<nav class="tabs"><div class="in">
  <button data-tab="help" class="on"><span>🛠️</span><b data-i="tHelp">Störung</b></button>
  <button data-tab="chat"><i class="dot hidden"></i><span>💬</span><b data-i="tChat">Chat</b></button>
  <button data-tab="call"><span>📞</span><b data-i="tCall">Hotline</b></button>
</div></nav>
  </footer>
</div>

<script>
/* ============ KONFIGURATION (hier anpassen) ============ */
const CONFIG = {
  brand: "Lade-Support",
  api: "https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-support",
  imgBase: "https://xsyuhfleesstrchcwspg.supabase.co/storage/v1/object/public/charge-public/stations/",   // Standortbild aus dem Dashboard
  publicUrl: "https://qar.gallery/laden/",   // Adresse, auf die die QR-Codes zeigen
  privacyUrl: "",                             // Link zur Datenschutzerklärung (leer = kein Link)
  hotline: "+49 40 280 96 0",
  hotlineHours: "24/7 erreichbar",
  defaultStation: "DE-GR7-E0001",
  // Fallback-Stammdaten, falls der Server nicht erreichbar ist (eigentliche Daten: Tabelle charge_stations)
  stations: {
    "DE-GR7-E0001": { addr: "Spandauer Damm 10, 14059 Berlin", cps: [{n:1,t:"CCS",evse:"DE*CPW*E1234673064*1",charger:1},{n:2,t:"CCS",evse:"DE*CPW*E1234673064*2",charger:1},{n:3,t:"CHAdeMO",evse:"DE*CPW*E1234673064*3",charger:1}], chargers:[{n:1,label:"LS#1"}],
      review: "https://search.google.com/local/writereview?placeid=ChIJA7jglC5RqEcRd14VfDgAZJ0" }
  }
};

/* ============ STÖRUNGSBÄUME (DE/EN) ============ */
// Titel werden immer auf Deutsch ans Team protokolliert, angezeigt in der gewählten Sprache.
const FLOWS = {
  nostart: { ic:"⛔", t:{de:"Ladevorgang startet nicht",en:"Charging won't start"}, steps:[
    { t:{de:"Stecker vollständig einstecken",en:"Plug in fully"},
      h:{de:"Ziehen Sie den Stecker einmal ab und stecken Sie ihn kräftig bis zum Anschlag ein – am Fahrzeug und (bei Typ 2) an der Säule.",
         en:"Unplug once and push the connector in firmly until it clicks – at the car and (for Type 2) at the charger."} },
    { t:{de:"Fahrzeug entriegeln",en:"Unlock the car"},
      h:{de:"Viele Fahrzeuge laden nur, wenn sie entriegelt sind. Prüfen Sie auch, ob im Fahrzeug ein Ladelimit oder Ladetimer eingestellt ist.",
         en:"Many cars only charge when unlocked. Also check whether a charge limit or charging timer is set in the car."} },
    { t:{de:"Ladevorgang neu starten",en:"Start charging again"},
      h:{de:"Starten Sie erneut – mit Ladekarte bzw. App an der Ladesäule oder mit Kreditkarte am Terminal.",
         en:"Start again – with your charging card or app at the charger, or with a credit card at the payment terminal."} }
  ]},
  abort: { ic:"⏹️", t:{de:"Ladevorgang bricht ab",en:"Charging stops"}, steps:[
    { t:{de:"Fahrzeugeinstellungen prüfen",en:"Check the car settings"},
      h:{de:"Ist ein Ziel-Ladestand (z. B. 80 %) erreicht oder ein Ladetimer aktiv?",
         en:"Has a target charge level (e.g. 80 %) been reached, or is a charging timer active?"} },
    { t:{de:"Kabel und Stecker prüfen",en:"Check cable and connector"},
      h:{de:"Liegt das Kabel unter Zug oder wurde es bewegt? Stecker neu einstecken und erneut starten.",
         en:"Is the cable under strain or was it moved? Plug in again and restart charging."} }
  ]},
  card: { ic:"💳", t:{de:"Ladekarte / App wird nicht erkannt",en:"Charging card / app not recognised"}, steps:[
    { t:{de:"Ladekarte richtig vorhalten",en:"Hold your charging card correctly"},
      h:{de:"Halten Sie die Ladekarte 2–3 Sekunden flach und ruhig direkt auf das Kartensymbol an der Ladesäule – nicht in der Geldbörse mit anderen Karten.",
         en:"Hold your charging card flat and still on the card symbol at the charger for 2–3 seconds – not inside a wallet with other cards."} },
    { t:{de:"Vertrag / App prüfen",en:"Check your contract / app"},
      h:{de:"Ist Ihre Ladekarte bzw. App für diese Station freigeschaltet (Roaming)? In der App Ihres Anbieters sehen Sie, ob die Station verfügbar ist.",
         en:"Is your charging card or app enabled for this station (roaming)? Your provider's app shows whether the station is available."} },
    { t:{de:"Andere Startmethode probieren",en:"Try another way to start"},
      h:{de:"Starten Sie per App statt Karte (oder umgekehrt). Alternativ können Sie direkt am Kreditkarten-Terminal bezahlen.",

/* ============ SERVER ============ */
async function api(action, payload={}, opts={}){
  if(!CONFIG.api) throw new Error("offline");
  const r=await fetch(CONFIG.api,{method:"POST",headers:{"Content-Type":"application/json"},keepalive:!!opts.keepalive,
    body:JSON.stringify({action,sid:S.sid,station:S.station,cp:S.cp,lang,...payload})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||r.status),{body:j});
  return j;
}
// Protokoll: jeder Schritt geht an den Server (Fehler werden ignoriert, Seite funktioniert weiter)
function track(type,data={},keepalive=false){
  if(evse()&&data.evse==null) data={...data,evse:evse()};
  if(curCp()&&data.cp_label==null) data={...data,cp_label:cpLabel(curCp())};
  return api("event",{type,data},{keepalive}).then(r=>{S.online=true;return r;}).catch(e=>{S.online=false;return null;});
}

/* ============ STATION ============ */
async function loadStation(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  if(h==="betreiber") return "betreiber";
  // "#1295" = Projekt, "#1295.3" = Projekt + Charger 3 vorgewählt
  const m=(h||"").match(/^(.+)\.(\d{1,2})$/);
  S.station = (m?m[1]:h) || CONFIG.defaultStation; S.prefCharger = m?+m[2]:null;
  S.stationData = CONFIG.stations[S.station] || null; S.cp=null; S.charger=null; S.label=S.station;
  renderStation();
  try{ const r=await api("station"); if(r.station){ if(r.station.id&&r.station.id!==S.station){ S.station=r.station.id; } S.label=r.station.project_id||S.station; S.stationData={review:r.station.review_url||(CONFIG.stations[S.station]||{}).review||"",addr:r.station.address||r.station.name||"",chargers:r.station.chargers||null,cps:(r.station.connectors||[]).length?r.station.connectors:[{n:1,t:""},{n:2,t:""}],incidents:r.station.incidents||[],extras:r.station.extras||{}}; } }catch(e){}
  initSelection(); renderStation();
  return "station";
}

function chargers(){ // [{n,label,cps:[...]}] aus den Stammdaten
  const st=S.stationData||{cps:[]}; const map=new Map();
  (st.cps||[]).forEach(c=>{ const k=c.charger||1; if(!map.has(k)) map.set(k,{n:k,label:"",cps:[]}); map.get(k).cps.push(c); });
  (st.chargers||[]).forEach(c=>{ if(map.has(c.n)) map.get(c.n).label=c.label||""; });
  return [...map.values()].sort((a,b)=>a.n-b.n).map(c=>({...c,label:c.label||(map.size>1?"Charger "+c.n:"")}));
}
const multi=()=>chargers().length>1;
const curCharger=()=>chargers().find(c=>c.n===S.charger)||null;
const curCp=()=>{ const st=S.stationData; return st&&st.cps.find(x=>x.n===S.cp)||null; };
const localNo=c=>{ const ch=chargers().find(x=>x.n===(c.charger||1)); return ch?ch.cps.indexOf(c)+1:c.n; };
function cpLabel(c){ if(!c) return ""; return `${multi()?tr("charger")+" "+(c.charger||1)+" · ":""}${tr("cp")} ${localNo(c)}`; }
function initSelection(){
  const chs=chargers();
  // Ladepunkt nur vorwählen, wenn es eindeutig ist – sonst wird erst nach Auswahl der Kachel gefragt
  if(chs.length===1){ S.charger=chs[0].n; if(chs[0].cps.length===1) S.cp=chs[0].cps[0].n; return; }
  if(S.prefCharger && chs.some(c=>c.n===S.prefCharger)) S.charger=S.prefCharger;
  const ch=curCharger(); if(ch && ch.cps.length===1) S.cp=ch.cps[0].n;
}
function pickCharger(n){ S.charger=n; S.cp=null; const ch=curCharger(); if(ch&&ch.cps.length===1) S.cp=ch.cps[0].n; track("connector_select",{charger:n,charger_label:ch&&ch.label,cp:S.cp}); }
function pickCp(n){ S.cp=n; const c=curCp(); if(c&&c.charger) S.charger=c.charger; track("connector_select",{cp:n,charger:c&&c.charger,label:cpLabel(c)}); }
// Auswahl-Block (Station-Karte und Zwischenschritt vor einer Störung)
const normE=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function cpRow(c,withCh){ return `<button class="cp-row ${c.n===S.cp?"on":""} ${incOf(c.n)?"bad":""}" data-cp="${c.n}" data-chg="${c.charger||1}">
  <span class="cp-l"><b>${withCh?tr("charger")+" "+(c.charger||1)+" · ":""}${tr("cp")} ${localNo(c)}</b>${incOf(c.n)?`<span class="inc-b">⚠ ${tr("known")}</span>`:""}<small>${esc(c.t||"")}${c.kw?" · "+c.kw+" kW":""}</small></span>
  ${c.evse?`<code class="cp-evse">${esc(c.evse)}</code>`:`<span class="cp-evse none">–</span>`}</button>`; }
function selectorHTML(){
  const chs=chargers(), ch=curCharger(), hasEvse=(S.stationData?.cps||[]).some(c=>c.evse);
  let h="";
  if(chs.length>1){
    if(hasEvse) h+=`<div class="sel-lbl">${tr("evseFind")}</div><input class="f evse-q" type="search" inputmode="search" autocomplete="off" placeholder="${tr("evsePh")}"><div class="evse-res"></div>`;
    h+=`<div class="sel-lbl">${tr("chooseCharger")}</div><div class="chg-grid">${chs.map(c=>`<button class="chg ${c.n===S.charger?"on":""} ${c.cps.length&&c.cps.every(x=>incOf(x.n))?"bad":""}" data-ch="${c.n}">${c.n}</button>`).join("")}</div>`;
  }
  if(ch) h+=`<div class="sel-lbl">${tr("chooseCp")}${hasEvse?` <span class="lbl-note">${tr("evseNote")}</span>`:""}</div><div class="cp-list">${ch.cps.map(c=>cpRow(c,false)).join("")}</div>`;
  else if(chs.length>1) h+=`<div class="sel-hint">${tr("chargerHint")}</div>`;
  return h;
}
function wireSelector(root,after){
  const sel=(btn)=>{ const n=+btn.dataset.cp, chg=+btn.dataset.chg; if(S.charger!==chg) S.charger=chg; pickCp(n); $("#stationCard").classList.remove("open"); renderStation(); after&&after(true); };
  root.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ pickCharger(+b.dataset.ch); renderStation(); after&&after(false); });
  root.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>sel(b));
  const q=root.querySelector(".evse-q"), res=root.querySelector(".evse-res");
  if(q) q.oninput=()=>{ const v=normE(q.value);
    if(v.length<2){ res.innerHTML=""; return; }
    const hits=(S.stationData?.cps||[]).filter(c=>c.evse&&normE(c.evse).includes(v)).slice(0,6);
    res.innerHTML=hits.length?`<div class="cp-list">${hits.map(c=>cpRow(c,true)).join("")}</div>`:`<div class="sel-hint">${tr("evseNone")}</div>`;
    res.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>sel(b)); };
}
function renderStation(){
  const st=S.stationData||{addr:"",cps:[]};
  $("#stId").textContent=S.label||S.station;
  const im=$("#stImg"), src=CONFIG.imgBase+encodeURIComponent(S.station)+".jpg?v="+Math.floor(Date.now()/3e5);
  if(im.dataset.src!==src){ im.dataset.src=src; im.hidden=true; im.onload=()=>{ im.hidden=false; }; im.onerror=()=>{ im.hidden=true; }; im.src=src; }
  $("#stAddr").textContent=st.addr||"";
  $("#cps").outerHTML=`<div id="cps">${selectorHTML()}</div>`;
  const nInc=((st.incidents)||[]).length;
  $("#stHint").innerHTML=nInc?`⚠ ${tr("stInc",{n:nInc})}`:"";
  wireSelector($("#cps"),()=>{ if(S.render===home) home(); });
  const c=curCp();
  $("#stEvse").innerHTML=c&&c.evse?`<b>EVSE-ID</b> ${esc(c.evse)}`:"";
  $("#stPill").textContent=c?`${cpLabel(c)}${c.t?" · "+c.t:""} ▾`:`${multi()&&!S.charger?tr("chooseCharger"):tr("chooseCp")} ▾`;
  $("#stPill").classList.toggle("need",!c);
  $("#stPill").setAttribute("aria-label",tr("switchCp"));
}
// Vor einer Störung: erst Charger/Ladepunkt wählen lassen, dann weiter
function needPick(next,k){
  // jedes Mal fragen, außer der Ladepunkt ist eindeutig oder wurde in diesem Besuch schon gewählt
  if(curCp()&&(S.pickedOnce||chargers().reduce((a,c)=>a+c.cps.length,0)===1)) return false;
  show(()=>pickView(()=>{ S.pickedOnce=true; next(); },k)); return true;
}
function pickView(next,k){
  compact(true); toTop(); markSub(); S.render=()=>pickView(next,k);
  const f=k&&FLOWS[k];
  view.innerHTML=`<button class="back" id="bk">${tr("back")}</button>
  <div class="card">${f?`<div class="step-n">${f.ic} ${L(f.t)}</div>`:""}<div class="step-t">${tr("pickT")}</div><p class="step-h">${tr("pickH")}</p><div id="pickSel">${selectorHTML()}</div></div>`;
  $("#bk").onclick=home;
  wireSelector($("#pickSel"),done=>{ if(done&&curCp()){ incOf(S.cp)?show(()=>knownView(next,k)):next(); } else pickView(next,k); });
}
// Gewählter Ladepunkt hat schon eine bekannte Störung → Hinweis, freie Alternativen, „Betrifft mich auch“
function knownView(next,k){
  compact(true); toTop(); markSub(); S.render=()=>knownView(next,k);
  const c=curCp(), inc=c&&incOf(c.n); if(!inc) return next();
  const alts=((chargers().find(x=>x.n===(c.charger||1))||{cps:[]}).cps.filter(x=>x.n!==c.n&&!incOf(x.n)));
  if(!S.knownLogged||!S.knownLogged[inc.cp]){ (S.knownLogged||={})[inc.cp]=1; track("known_shown",{cp:inc.cp}); }
  view.innerHTML=`<button class="back" id="bk">${tr("back")}</button>
  <div class="card known"><div class="step-t">⚠️ ${tr("knownT")}</div><p class="step-h">${esc(cpLabel(c))} · ${tr("knownH",{t:new Date(inc.since).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"}),n:inc.reports})}</p>
    ${alts.length?`<div class="sub" style="margin:0">${tr("knownAlt")}</div><div class="alt">${alts.map(x=>`<button data-alt="${x.n}">${esc(cpLabel(x))}${x.t?" · "+esc(x.t):""}</button>`).join("")}</div>`:`<div class="note amber">${tr("knownNoAlt")}</div>`}
    <div id="plusBox">${S.plused&&S.plused[inc.cp]?`<div class="note green">${tr("plusOk")}</div>`:`<button class="btn primary" id="plus">➕ ${tr("plusBtn")}</button>`}</div>
    <button class="btn ghost" id="other">${tr("knownOther")}</button></div>`;
  $("#bk").onclick=()=>show(()=>pickView(next,k));
  $("#other").onclick=next;
  view.querySelectorAll("[data-alt]").forEach(b=>b.onclick=()=>{ pickCp(+b.dataset.alt); renderStation(); next(); });
  if($("#plus")) $("#plus").onclick=()=>{ $("#plusBox").innerHTML=`<label class="f">${tr("plusMail")}</label><input class="f" id="plusMail" type="email" inputmode="email" autocomplete="email" placeholder="${tr("fEmailPh")}"><button class="btn primary" id="plusGo">${tr("plusSend")}</button>`;
    $("#plusGo").onclick=async e=>{ e.target.disabled=true; const m=$("#plusMail").value.trim();
      try{ const r=await api("plus_one",{email:m}); if(r.gone){ await refreshIncidents(); return next(); } (S.plused||={})[inc.cp]=1;
        $("#plusBox").innerHTML=`<div class="note green">${tr("plusOk")}${m?" "+tr("plusOkMail",{m:esc(m)}):""}</div>`; }catch(err){ e.target.disabled=false; } }; };
}
// Station kompakt (eine Zeile) überall außer auf der Startseite – Tippen klappt sie auf
const review=()=>((S.stationData&&S.stationData.review)||"");
const evse=()=>{ const c=curCp(); return (c&&c.evse)||""; };
function compact(on){ const c=$("#stationCard"); c.classList.toggle("compact",on); c.classList.remove("open"); $("#homeH").hidden=on; $("#homeH").innerHTML=esc(tr("what"))+`<small>${esc(tr("whatCare"))}</small>`; }
$("#stPill").onclick=()=>$("#stationCard").classList.toggle("open");
const scroller=()=>$("#scroll");
function toTop(){ scroller().scrollTop=0; }
function show(fn){ S.render=fn; fn(); }   // merkt sich die aktuelle Ansicht (für Sprachwechsel)

// Gängige Ladekarten-/App-Anbieter (EMSP) als Vorschläge – freie Eingabe bleibt möglich
const EMSP=["CutPower (Last Mile Solutions)","ADAC e-Charge","Aral pulse","BMW Charging","Chargemap","E.ON Drive","EnBW mobility+","EWE Go","Electroverse (Octopus)","Elli (VW)","IONITY","Lidl Plus","Maingau EinfachStromLaden","Mercedes me Charge","Mobility House","Plugsurfing","Shell Recharge","Stadtwerke-Karte","Tesla","Vattenfall InCharge","Zapmap"];

/* ============ STÖRUNGSNUMMER MERKEN ============ */
// Auf dem Gerät gespeichert (localStorage), damit die Nummer nach Zurück/Neuladen noch da ist
const TKEY="hc_tickets";
function loadTickets(){ try{ return JSON.parse(localStorage.getItem(TKEY)||"[]"); }catch(e){ return []; } }
function saveTicket(t){ try{ const a=loadTickets().filter(x=>x.no!==t.no); a.unshift(t); localStorage.setItem(TKEY,JSON.stringify(a.slice(0,5))); }catch(e){} }
// Nur auf DIESEM Handy gespeichert; nach 12 h oder per ✕ nicht mehr angezeigt
function recentTickets(){ const lim=Date.now()-12*3600000; return loadTickets().filter(t=>t.station===S.station && t.ts>lim && !t.hidden); }
function recentTicket(){ return recentTickets()[0]||null; }
function hideTicket(no){ try{ const a=loadTickets().map(x=>x.no===no?{...x,hidden:true}:x); localStorage.setItem(TKEY,JSON.stringify(a)); }catch(e){} }
function ago(ts){ const m=Math.round((Date.now()-ts)/60000), en=lang==="en";
  if(m<1) return en?"just now":"gerade eben"; if(m<60) return en?`${m} min ago`:`vor ${m} Min.`;
  const h=Math.round(m/60); if(h<24) return en?`${h} h ago`:`vor ${h} Std.`;
  return new Date(ts).toLocaleString(locale(),{dateStyle:"short",timeStyle:"short"}); }
function ticketText(t){ return tr("shareText",{no:t.no,st:t.station+(t.cpl?" · "+t.cpl:(t.cp?" · "+tr("cp")+" "+t.cp:"")),evse:t.evse?"\nEVSE-ID: "+t.evse:"",pr:FLOWS[t.flow]?L(FLOWS[t.flow].t):"",time:new Date(t.ts).toLocaleString(locale()),hl:CONFIG.hotline}); }
async function copyText(txt,btn){ try{ await navigator.clipboard.writeText(txt); if(btn) btn.textContent=tr("tCopied"); }catch(e){ if(btn) btn.textContent=txt; } }
async function shareTicket(t,btn){
  const text=ticketText(t);
  if(navigator.share){ try{ await navigator.share({title:tr("shareTitle",{no:t.no}),text}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  copyText(text,btn);
}
function ticketActions(t){ return `<div class="tk-actions"><button class="btn ghost" data-act="copy">${tr("tCopy")}</button><button class="btn ghost" data-act="share">${tr("tShare")}</button></div>`; }
function wireTicketActions(root,t){ root.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>b.dataset.act==="copy"?copyText(t.no,b):shareTicket(t,b)); }

/* Zurück-Taste des Browsers: innerhalb der App zur Startseite statt die Seite zu verlassen */
let inSub=false;
function markSub(){ if(!inSub){ try{ history.pushState({hc:1},"",location.href); }catch(e){} inSub=true; } }
window.addEventListener("popstate",()=>{ if(inSub){ inSub=false; $("#composer").classList.add("hidden"); document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="help")); S.tab="help"; home(); } });

/* ============ VIEWS ============ */
function home(){
  S.flow=null;S.step=0;S.tried=[]; compact(false); S.render=home;
  const rts=recentTickets(), rt=rts[0], c=curCp(), inc=c&&incOf(c.n);
  const alts=c?((chargers().find(x=>x.n===(c.charger||1))||{cps:[]}).cps.filter(x=>x.n!==c.n&&!incOf(x.n))):[];
  view.innerHTML=`${rt?`<div class="card tk-banner"><div class="tk-head"><span>🧾 ${tr(rts.length>1?"myTickets":"myTicket")}</span><span><small>${tr("ticketAgo",{t:ago(rt.ts)})}</small><button class="tk-x" id="tkX" aria-label="${tr("hide")}">✕</button></span></div>
    ${rts.length>1?`<div class="tk-list">${rts.map(t=>`<div class="tk-li"><span><code>${esc(t.no)}</code><br><small>${esc(t.cpl||"")} · ${ago(t.ts)}</small></span><button class="small-btn" data-copy="${esc(t.no)}">${tr("copy")}</button></div>`).join("")}</div>`
      :`<div class="ticket">${esc(rt.no)}</div>`}${rts.length>1?`<div class="tk-actions"><button class="btn ghost" id="shAll">${tr("tShare")}</button></div>`:ticketActions(rt)}</div>`:""}
  ${inc?`<div class="card known"><div class="step-t">⚠️ ${tr("knownT")}</div><p class="step-h">${esc(cpLabel(c))} · ${tr("knownH",{t:new Date(inc.since).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"})+(Date.now()-new Date(inc.since)>20*3600e3?" ("+new Date(inc.since).toLocaleDateString(locale())+")":""),n:inc.reports})}</p>
    ${alts.length?`<div class="sub" style="margin:0">${tr("knownAlt")}</div><div class="alt">${alts.map(x=>`<button data-alt="${x.n}">${esc(cpLabel(x))}${x.t?" · "+esc(x.t):""}</button>`).join("")}</div>`:`<div class="note amber">${tr("knownNoAlt")}</div>`}
    <div id="plusBox">${S.plused&&S.plused[inc.cp]?`<div class="note green">${tr("plusOk")}</div>`:`<button class="btn ghost" id="plus">➕ ${tr("plusBtn")}</button>`}</div>
    <p class="sub" style="margin:10px 0 0">${tr("otherIssue")}</p></div>`:""}
  <p class="sub tiles-hint">${tr("whatSub")}</p>
  <div class="grid">${TILE_ORDER.map(k=>[k,FLOWS[k]]).map(([k,f])=>`<button class="tile ${f.danger?"danger":""} ${f.wide?"wide":""}" data-f="${k}"><span class="ic">${f.ic}</span><b>${L(f.t)}</b></button>`).join("")}</div>
  <h3 class="site-h">${tr("siteH")}</h3>
  <div class="grid">${siteTiles().map(k=>[k,FLOWS[k]]).map(([k,f])=>`<button class="tile site ${f.wide?"wide":""}" data-f="${k}"><span class="ic">${f.ic}</span><b>${L(f.t)}</b></button>`).join("")}</div>
  <p class="privacy">${tr("privacy")}${CONFIG.privacyUrl?` <a href="${CONFIG.privacyUrl}" target="_blank" rel="noopener">${tr("privacyLink")}</a>`:""}</p>
  <p class="svc-link"><a href="service/#${encodeURIComponent(S.label||S.station)}">🔧 ${tr("svc")}</a></p>`;
  view.querySelectorAll(".tile").forEach(b=>b.onclick=()=>startFlow(b.dataset.f));
  if(rt){ wireTicketActions(view.querySelector(".tk-banner"),rt);
    if($("#shAll")) $("#shAll").onclick=async e=>{ const text=rts.map(ticketText).join("\n\n"); if(navigator.share){ try{ await navigator.share({title:tr("myTickets"),text}); return; }catch(err){ if(err&&err.name==="AbortError") return; } } copyText(text,e.target); }; view.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b));
    $("#tkX").onclick=()=>{ rts.forEach(t=>hideTicket(t.no)); S.lastTicket=null; home(); }; }
  if(inc){ if(!S.knownLogged||!S.knownLogged[inc.cp]){ (S.knownLogged||={})[inc.cp]=1; track("known_shown",{cp:inc.cp}); }
    view.querySelectorAll("[data-alt]").forEach(b=>b.onclick=()=>{ pickCp(+b.dataset.alt); renderStation(); home(); });
    if($("#plus")) $("#plus").onclick=()=>{ $("#plusBox").innerHTML=`<label class="f">${tr("plusMail")}</label><input class="f" id="plusMail" type="email" inputmode="email" autocomplete="email" placeholder="${tr("fEmailPh")}"><button class="btn primary" id="plusGo">${tr("plusSend")}</button>`;
      $("#plusGo").onclick=async e=>{ e.target.disabled=true; const m=$("#plusMail").value.trim();
        try{ const r=await api("plus_one",{email:m}); if(r.gone){ await refreshIncidents(); return home(); } (S.plused||={})[inc.cp]=1; if(r.reports) inc.reports=r.reports;
          $("#plusBox").innerHTML=`<div class="note green">${tr("plusOk")}${m?" "+tr("plusOkMail",{m:esc(m)}):""}</div>`; }catch(err){ e.target.disabled=false; } }; }; }
}

function startFlow(k){
  const f0=FLOWS[k]; if(!f0.danger && !f0.site && needPick(()=>startFlow(k),k)) return;
  S.flow=k;S.step=0;S.tried=[];
  const f=FLOWS[k];
  track(f.danger?"danger_open":"flow_start",{flow:k,title:DE(f.t)});
  if(f.danger) return show(dangerView);
  S.choice=[]; S.choiceL=[];
  if(f.info) return show(infoView);
  if(f.choose) return show(chooseView);
  if(!f.steps.length) return openTicket();
  show(stepView);
}

// Auswahl vor dem Formular (einfach oder mehrfach)
function chooseView(){
  const f=FLOWS[S.flow], c=f.choose; compact(true); toTop(); markSub();
  view.innerHTML=`<button class="back" id="bk">${tr("back")}</button>
  <div class="card"><div class="step-n">${f.ic} ${L(f.t)}</div><div class="step-t">${L(c.q)}</div>${c.multi?`<p class="step-h">${tr("multiH")}</p>`:""}
  <div class="opts">${c.opts.map(([k,ic,l])=>`<button class="opt ${S.choice.includes(DE(l))?"on":""}" data-k="${k}"><span>${ic}</span>${L(l)}</button>`).join("")}</div>
  ${c.multi?`<button class="btn primary" id="go" ${S.choice.length?"":"disabled"}>${tr("next")}</button>`:""}</div>`;
  $("#bk").onclick=home;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const o=c.opts.find(x=>x[0]===b.dataset.k), lab=DE(o[2]);
    if(!c.multi){ S.choice=[lab]; S.choiceL=[L(o[2])]; return openTicket(); }
    const i=S.choice.indexOf(lab); if(i<0){ S.choice.push(lab); (S.choiceL=S.choiceL||[]).push(L(o[2])); } else { S.choice.splice(i,1); S.choiceL.splice(i,1); }
    b.classList.toggle("on",i<0); $("#go").disabled=!S.choice.length; });
  if($("#go")) $("#go").onclick=openTicket;
}
// Infoseite Parken: Tarife & Besonderheiten aus dem Dashboard, danach ggf. Problem melden
function infoView(){
  const f=FLOWS[S.flow], txt=(extras().parking_info||"").trim(); compact(true); toTop(); markSub();
  view.innerHTML=`<button class="back" id="bk">${tr("back")}</button>
  <div class="card"><div class="step-n">${f.ic} ${L(f.t)}</div><div class="step-t">${tr("parkT")}</div>
  <div class="info-box">${txt?esc(txt):tr("parkNone")}</div>
  <p class="step-h" style="margin-top:14px">${tr("parkQ")}</p>
  <div class="opts">${f.choose.opts.map(([k,ic,l])=>`<button class="opt" data-k="${k}"><span>${ic}</span>${L(l)}</button>`).join("")}</div>
  <button class="btn ghost" id="ok">${tr("parkOk")}</button></div>`;
  $("#bk").onclick=home; $("#ok").onclick=()=>{ track("step_ok",{flow_title:DE(f.t),n:1,step:"Parkinfo gelesen"}); home(); };
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const o=f.choose.opts.find(x=>x[0]===b.dataset.k); S.choice=[DE(o[2])]; S.choiceL=[L(o[2])]; openTicket(); });
}
function stepView(){
  const f=FLOWS[S.flow], s=f.steps[S.step], n=f.steps.length; compact(true); toTop(); markSub();
  view.innerHTML=`<button class="back" id="bk">${tr("back")}</button>
  <div class="card">
    <div class="step-n">${f.ic} ${L(f.t)} · ${tr("stepOf",{a:S.step+1,b:n})}</div>
    <div class="progress"><i style="width:${(S.step+1)/n*100}%"></i></div>
    <div class="step-t">${L(s.t)}</div>
    <p class="step-h">${L(s.h)}</p>
    <button class="btn primary" id="ok">${tr("ok")}</button>
    <button class="btn ghost" id="no">${tr("no")}</button>
  </div>`;
  $("#bk").onclick=()=>{ track("step_back",{step:DE(s.t)}); S.step?(S.step--,show(stepView)):home(); };
  $("#ok").onclick=()=>{ track("step_ok",{flow_title:DE(f.t),n:S.step+1,step:DE(s.t)}); solved(); };
  $("#no").onclick=()=>{ track("step_fail",{flow_title:DE(f.t),n:S.step+1,step:DE(s.t)}); S.tried.push(DE(s.t)); next(); };

// Foto verkleinern (max. 1600 px, JPEG) bevor es hochgeladen wird
function shrink(file){ return new Promise((res)=>{ if(!file) return res(null);
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const m=1600, k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.8)); };
  img.onerror=()=>res(null); img.src=url; }); }

function fallbackBot(t){
  t=t.toLowerCase(); const en=lang==="en", H=CONFIG.hotline;
  if(/rauch|funk|brand|feuer|kaputt|beschädig|wasser|smoke|spark|fire|burn|damag|broken|water/.test(t))
    return en?`⚠️ Please don't touch the charger and keep your distance. In danger call 112. Call our hotline right away: ${H}.`:`⚠️ Bitte die Säule nicht berühren und Abstand halten. Bei Gefahr Notruf 112. Rufen Sie sofort unsere Hotline an: ${H}.`;
  if(/stecker.*(fest|lös|raus|steck)|entriegel|stuck|release|unlock/.test(t))
    return en?"End charging in the car, app or at the terminal and unlock the car. Push the connector in briefly, then pull. If that doesn't work, please call the hotline: "+H
             :"Beenden Sie die Ladung im Auto, in der App oder am Terminal und entriegeln Sie das Fahrzeug. Drücken Sie den Stecker kurz hinein und ziehen Sie dann. Klappt das nicht, rufen Sie bitte die Hotline an: "+H;
  if(/kredit|terminal|ad.?hoc|apple pay|google pay|debit|credit|pin/.test(t))
    return en?"At the credit card terminal, first select your connector number, then tap your card until it beeps – or insert it and enter your PIN. If it's declined, try another card or Apple Pay / Google Pay."
             :"Wählen Sie am Kreditkarten-Terminal zuerst die Nummer Ihres Ladepunkts, dann die Karte ans Kontaktlos-Symbol halten, bis es piept – oder einstecken und PIN eingeben. Bei Ablehnung eine andere Karte oder Apple Pay / Google Pay versuchen.";
  if(/ladekarte|karte|rfid|app|erkannt|autoris|card|recogni|authori/.test(t))
    return en?"Hold your charging card flat on the card symbol at the charger for 2–3 seconds, not in your wallet. Check in your provider's app whether this station is enabled. Otherwise try starting via the app or pay at the credit card terminal."
             :"Halten Sie die Ladekarte 2–3 Sekunden flach auf das Kartensymbol an der Ladesäule, nicht im Portemonnaie. Prüfen Sie in der App Ihres Anbieters, ob die Station freigeschaltet ist. Sonst per App starten oder am Kreditkarten-Terminal bezahlen.";
  if(/preis|kost|tarif|price|cost|tariff/.test(t))
    return en?"For prices and tariffs, our hotline will help: "+H:"Zu Preisen und Tarifen hilft Ihnen unsere Hotline: "+H;
  if(/bricht|abbruch|stopp|hört auf|stops|stopped|interrupt/.test(t))
    return en?"Please check whether a charge limit (e.g. 80 %) or a timer is active in the car. Plug in again. If that doesn't help, please report the issue in the “Issue” tab."
             :"Prüfen Sie bitte, ob im Auto ein Ladelimit (z. B. 80 %) oder ein Timer aktiv ist. Stecken Sie den Stecker neu ein. Hilft das nicht, melden Sie die Störung bitte im Tab „Störung“.";
  if(/display|dunkel|bildschirm|screen|dark|blank/.test(t))
    return en?"Is it the charger's display or the credit card terminal? Tap the screen – both go into sleep mode. If an error is shown, please take a photo and report it in the “Issue” tab."
             :"Geht es um das Display der Ladesäule oder um das Kreditkarten-Terminal? Tippen Sie auf den Bildschirm – beide gehen in den Ruhemodus. Zeigt er einen Fehler, machen Sie bitte ein Foto und melden Sie ihn im Tab „Störung“.";
  if(/start|lädt nicht|geht nicht|funktioniert nicht|won.?t|not charg|doesn.?t work|not work/.test(t))
    return en?"Please push the connector in firmly until it clicks and unlock the car. Then start again with your card/app or at the credit card terminal. Did that help?"
             :"Stecken Sie den Stecker bitte kräftig bis zum Anschlag ein und entriegeln Sie das Fahrzeug. Dann erneut mit Ladekarte/App oder am Kreditkarten-Terminal starten. Hat das geholfen?";
  if(/mensch|mitarbeiter|anruf|telefon|hotline|someone|person|human|call|phone/.test(t))
    return en?`Our hotline is available 24/7: ${H}. Please give the station ID ${S.station}.`:`Unsere Hotline ist ${CONFIG.hotlineHours} erreichbar: ${H}. Bitte nennen Sie die Stations-ID ${S.station}.`;
  if(/^(ja|danke|hat geklappt|super|lädt|yes|thanks|thank you|works|great)/.test(t)) return en?"Glad to hear it! Have a good trip ⚡":"Freut mich! Gute Fahrt ⚡";
  return en?"Could you briefly describe what's happening? For example: charging won't start, charging card not recognised, credit card not working or connector is stuck."
           :"Können Sie kurz beschreiben, was passiert? Zum Beispiel: Ladung startet nicht, Ladekarte wird nicht erkannt, Kreditkarte geht nicht oder Stecker steckt fest.";
}

function scrollEnd(){ setTimeout(()=>{ const s=scroller(); s.scrollTop=s.scrollHeight; },30); }
let busy=false, toldTeam=false;
// Antwort ohne Server: zur gewählten Kachel den ersten Lösungsschritt, sonst Stichwort-Antwort
function chipAnswer(k){ const f=FLOWS[k];
  if(f.danger) return fallbackBot("beschädigt damaged");
  if(!f.steps||!f.steps.length) return fallbackBot("");
  const s=f.steps[0]; return `${L(s.t)}: ${L(s.h)} ${lang==="en"?"Did that help?":"Hat das geholfen?"}`; }
async function send(text,chip){
  text=(text||"").trim(); if(!text||busy) return;
  busy=true; S.chat.push({role:"user",content:text}); chatView(); startPolling();
  const log=$("#log"); const el=document.createElement("div"); el.className="msg bot"; el.textContent="…"; log.appendChild(el); scrollEnd();
  try{
    const msgs=S.chat.filter(m=>m.role==="user"||m.role==="assistant"||m.role==="team").map(m=>({role:m.role==="user"?"user":"assistant",content:m.content}));
    const r=await api("chat",{messages:msgs,context:{flow:S.flow?DE(FLOWS[S.flow].t):null,tried:S.tried}});
    if(r.text) S.chat.push({role:"assistant",content:r.text});
    else if(r.human && !toldTeam){ toldTeam=true; S.chat.push({role:"sys",content:tr("chatToTeam")}); }
    S.online=true;
  }catch(e){ S.online=false; S.chat.push({role:"assistant",content:chip?chipAnswer(chip):fallbackBot(text)}); }
  busy=false; chatView();
}
// Team-Antworten aus Telegram abholen
function startPolling(){
  if(S.pollT||!CONFIG.api) return;
  const tick=async()=>{
    try{
      const r=await api("poll",{after:S.lastTeamId});
      if(r.human) S.human=true;
      if(r.messages&&r.messages.length){
        r.messages.forEach(m=>{ S.lastTeamId=Math.max(S.lastTeamId,m.id); S.chat.push({role:"team",content:m.text,from:m.from}); });
        if(S.tab==="chat") chatView(); else { S.unread+=r.messages.length; badge(); }
        try{ navigator.vibrate&&navigator.vibrate(80); }catch(e){}
      }
    }catch(e){}
    S.pollT=setTimeout(tick, document.hidden?15000:(S.tab==="chat"?3000:8000));
  };
  S.pollT=setTimeout(tick,2000);
}
function badge(){ const b=document.querySelector('nav.tabs [data-tab="chat"] .dot'); if(b) b.classList.toggle("hidden",!S.unread); }
$("#chatSend").onclick=()=>{send($("#chatIn").value);$("#chatIn").value="";};
