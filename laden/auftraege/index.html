<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>HAPPY CHARGING Auftragsbörse</title>
<meta name="description" content="Aufträge rund um Ladeinfrastruktur: Störungen, Mängel, Wartung. Für geprüfte Fachbetriebe.">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--muted:#5d6b65;--line:#e1e6e3;--brand:#0a8f5a;--brand-soft:#e3f4ec;--warn:#b42318;--warn-soft:#fdecea;--amber:#9a6700;--amber-soft:#fff6db;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
header svg{width:20px;height:26px;flex:none}
header .t{font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .t span{font-weight:500;color:var(--muted)}
nav.tabs{display:flex;gap:6px;max-width:860px;margin:0 auto;padding:12px 16px 0;overflow-x:auto}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.3px}
h2{font-size:17px;margin:20px 2px 10px}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--brand);color:#fff;text-align:center;text-decoration:none}
.btn.block{display:block;width:100%}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:#fff;border:1.5px solid #f3c0bb;color:var(--warn)}
.btn:disabled{opacity:.5}
.back{background:none;border:0;color:var(--muted);padding:4px 0 10px;font-size:15px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--brand-soft);color:#08603d;margin:0 4px 4px 0}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.grey{background:#eef1ef;color:var(--muted)}
.hero{background:linear-gradient(135deg,#0d2a1f,#0a8f5a);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.hero h1{color:#fff}.hero p{margin:6px 0 0;opacity:.9;line-height:1.5}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.steps div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px;font-size:13px;line-height:1.4}
.steps b{display:block;font-size:14px;margin-bottom:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:14px}
.filters input{flex:1;min-width:180px}
.fbox{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:-4px 0 12px}
.fbox select,.fbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px}
.fbox label.f{margin:0 0 4px}.fchk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}.fchk label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}.fchk input{width:auto!important}
.chip.warn{background:#fff1e6;color:#b45f00}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.job{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.job:hover{border-color:var(--brand)}
.job .no{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.job .tt{font-weight:700;font-size:16px;line-height:1.3}
.job{position:relative}.job .no{padding-right:34px}
.star{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;cursor:pointer;color:#b8c0bb;display:flex;align-items:center;justify-content:center;padding:0}
.star.on{color:#F08C00;border-color:#F08C00;background:#fff8ec}.star:hover{border-color:#F08C00}
.demo{display:inline-block;background:#7c3aed;color:#fff;font:700 11px/1 system-ui,sans-serif;letter-spacing:.06em;padding:4px 7px;border-radius:6px;vertical-align:middle;margin-right:6px}
.star.inl{position:static;display:inline-flex;vertical-align:middle;margin-left:8px}
.job .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.job .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;padding-top:6px;border-top:1px solid var(--line)}
.dl{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:14px}.dl dt{color:var(--muted)}.dl dd{margin:0}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.photos img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.desc{white-space:pre-wrap;line-height:1.55;font-size:15px}
.lock{background:var(--amber-soft);border:1px solid #f1dc9c;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.lock ul{margin:6px 0 0;padding-left:18px}
.ok{background:var(--brand-soft);border:1px solid #bfe5d2;border-radius:12px;padding:12px 14px;font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px}
textarea.i{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px;font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.cats input{display:none}.cats label:has(input:checked){background:var(--brand-soft);border-color:#9fd6bb;color:#08603d;font-weight:600}
.cert-row{display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}.cert-row.wide{grid-template-columns:1.2fr 1fr 1fr auto auto}
.cert-row select,.cert-row input{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;background:#fff;width:100%}
.file{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.file input{display:none}.file.has{border-style:solid;border-color:#9fd6bb;background:var(--brand-soft)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.price{font-weight:800;font-size:18px}
.err{color:var(--warn);font-size:14px;margin-top:8px;min-height:1px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.eye{position:relative}.eye input{padding-right:42px}.eye button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:16px;padding:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:40}#zoom img{max-width:94vw;max-height:90vh;border-radius:10px}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:700px){.jobs{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}.cert-row,.cert-row.wide{grid-template-columns:1fr 1fr}.hero{padding:18px}h1{font-size:21px}}
</style>
</head>
<body>
<header>
  <svg viewBox="190 90 800 1000"><polygon points="699,118 262,679 556,679 479,1062 916,501 622,501" fill="#F08C00"/></svg>
  <div class="t" id="home">HAPPY CHARGING <span>Auftragsbörse</span></div>
  <button class="btn ghost sm" id="acct">Anmelden</button>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap" id="view"></div>
<footer>Vermittlungsplattform: Der Auftrag kommt direkt zwischen Auftraggeber und Betrieb zustande. Es fallen keine Gebühren an, und über die Plattform werden keine Zahlungen abgewickelt. Angebote dürfen nur geprüfte Fachbetriebe abgeben (Nachweise und Creditreform-Bonität).</footer>
<div id="toast"></div>
<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<script>
const API="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-market";
const $=s=>document.querySelector(s), view=$("#view");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD=d=>d?new Date(d).toLocaleDateString("de-DE",{timeZone:"Europe/Berlin"}):"–";
const fmtDT=d=>d?new Date(d).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short",timeZone:"Europe/Berlin"}):"–";
const eur=n=>n==null||n===""?"–":Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const ago=d=>{ if(!d) return "–"; const t0=new Date(new Date().toDateString()).getTime(), t=Date.parse(d); if(t>=t0) return "heute"; if(t>=t0-864e5) return "gestern"; const n=Math.ceil((t0-t)/864e5); return n<=14?`vor ${n} Tagen`:"am "+fmtD(d); };
const left=d=>{ if(!d) return ""; const ms=Date.parse(d)-Date.now(); if(ms<0) return "abgelaufen"; const h=Math.floor(ms/36e5); return h<48?`noch ${h} Std.`:`noch ${Math.floor(h/24)} Tage`; };
let S={token:null,me:null,jobs:[],certs:{},cats:{},brands:{},software:{},crefo_max:249,tab:"jobs",f:{q:"",cat:"",src:"",loc:"",start:"",dl:"",pub:"",pt:"",elig:false,fav:false,demo:true,sort:"new"},fOpen:false};
try{ const t=JSON.parse(localStorage.getItem("hc_market")||"null"); if(t&&t.exp>Date.now()) S.token=t.token; }catch(e){}

async function api(action,payload={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token:S.token,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&j.relogin){ logout(true); throw new Error(j.error||"Bitte anmelden"); }
  if(!r.ok){ const e=new Error(j.error||("Fehler "+r.status)); e.why=j.why; throw e; }
  return j;
}
function setToken(t){ S.token=t; try{ localStorage.setItem("hc_market",JSON.stringify({token:t,exp:Date.now()+11.5*36e5})); }catch(e){} }
function logout(silent){ S.token=null; S.me=null; try{ localStorage.removeItem("hc_market"); }catch(e){} renderHead(); if(!silent){ toast("Abgemeldet"); go("jobs"); } }
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display="none",3200); }
function zoom(src){ $("#zoom img").src=src; $("#zoom").style.display="flex"; }
function eyeify(root){ root.querySelectorAll('input[type=password]').forEach(i=>{ if(i.parentNode.classList.contains("eye")) return; const w=document.createElement("div"); w.className="eye"; i.parentNode.insertBefore(w,i); w.appendChild(i); const b=document.createElement("button"); b.type="button"; b.textContent="👁"; b.setAttribute("aria-label","Passwort anzeigen"); b.onclick=()=>{ i.type=i.type==="password"?"text":"password"; b.textContent=i.type==="password"?"👁":"🙈"; }; w.appendChild(b); }); }
function readFile(f,maxPx=1800){ return new Promise((res,rej)=>{ if(f.size>12*1024*1024) return rej(new Error("Datei zu groß (max. 12 MB)"));
  if(f.type==="application/pdf"){ if(f.size>5*1024*1024) return rej(new Error("PDF zu groß (max. 5 MB)")); const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); return; }
  const img=new Image(), u=URL.createObjectURL(f); img.onload=()=>{ const s=Math.min(1,maxPx/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",.85)); }; img.onerror=()=>rej(new Error("Bild nicht lesbar")); img.src=u; }); }

function renderHead(){
  $("#acct").textContent=S.token?"Abmelden":"Anmelden";
  $("#acct").onclick=()=>S.token?logout():go("login");
  const tabs=[["jobs","Offene Aufträge"],["favs","★ Favoriten"]].concat(S.token?[["my","Meine Angebote"],["profile","Mein Betrieb"]]:[["register","Als Betrieb registrieren"]]);
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(tab,arg){ S.tab=tab; renderHead(); scrollTo(0,0);
  if(tab!=="job" && location.hash && !(tab==="my"&&location.hash==="#meine")) history.replaceState(null,"",location.pathname);
  ({jobs:jobsView,job:()=>jobView(arg),login:loginView,register:registerView,my:myView,favs:favView,profile:profileView}[tab]||jobsView)(); }
$("#home").onclick=()=>go("jobs");
window.addEventListener("hashchange",()=>{ const h=decodeURIComponent(location.hash.slice(1)); if(h==="meine") go("my"); else if(h) go("job",h); });

async function loadMe(){ if(!S.token) return null; try{ const r=await api("me"); S.me=r.me; S.certs=r.certs; S.cats=r.cats; S.brands=r.brands||{}; S.software=r.software||{}; return S.me; }catch(e){ return null; } }
function eligBox(el,ctx){
  if(!el) return "";
  if(el.ok) return `<div class="ok">✅ Ihr Betrieb ist freigegeben${ctx?" und erfüllt alle Voraussetzungen für diesen Auftrag":""}.</div>`;
  return `<div class="lock"><b>🔒 ${ctx?"Für diesen Auftrag noch nicht freigegeben":"Noch nicht für Angebote freigegeben"}</b><ul>${el.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
    <div class="small muted" style="margin-top:6px">Nachweise können Sie unter <a href="#" onclick="go('profile');return false">Mein Betrieb</a> hochladen. Die Prüfung übernehmen wir.</div></div>`;
}

/* ── Liste ── */
async function jobsView(){
  view.innerHTML=`${S.token?"":`<div class="hero"><h1>Aufträge für Fachbetriebe rund ums Laden</h1>
    <p>Störungen, Mängel und Wartungen an Ladestationen, ausgeschrieben gegen Angebot, pauschal oder nach Stundensatz. Keine Gebühren, keine Provision.</p>
    <div class="steps"><div><b>1 · Registrieren</b>Firmendaten, Nachweise und Crefonummer hinterlegen</div><div><b>2 · Prüfung</b>Wir prüfen Nachweise und Creditreform-Bonität</div><div><b>3 · Anbieten</b>Registrierte Betriebe sehen alle Details, freigegebene Betriebe geben Angebote ab</div></div>
    <div class="row"><button class="btn" onclick="go('register')">Jetzt registrieren</button><button class="btn ghost" onclick="go('login')">Anmelden</button></div></div>`}
    <div id="meBox"></div>
    <div class="filters"><input id="fq" placeholder="Suche nach Ort, Tätigkeit, Nummer…" value="${esc(S.f.q)}">
      <select id="fsort" title="Sortierung"><option value="new">Neueste zuerst</option><option value="dl">Frist endet bald</option><option value="start">Frühester Start</option><option value="loc">Ort A–Z</option></select>
      <button class="btn ghost" id="fmore" type="button">⚙︎ Filter <span id="fcnt"></span></button></div>
    <div class="fbox" id="fbox" style="display:${S.fOpen?"grid":"none"}">
      <div><label class="f">Gewerk</label><select id="fc"><option value="">Alle Gewerke</option></select></div>
      <div><label class="f">Ort / Region</label><select id="floc"><option value="">Alle Orte</option></select></div>
      <div><label class="f">Ausführung ab</label><input type="date" id="fstart"></div>
      <div><label class="f">Angebotsfrist</label><select id="fdl"><option value="">beliebig</option><option value="3">endet in ≤ 3 Tagen</option><option value="7">endet in ≤ 7 Tagen</option><option value="14">endet in ≤ 14 Tagen</option><option value="15+">länger als 14 Tage</option></select></div>
      <div><label class="f">Eingestellt</label><select id="fpub"><option value="">jederzeit</option><option value="1">heute</option><option value="3">letzte 3 Tage</option><option value="7">letzte 7 Tage</option><option value="30">letzte 30 Tage</option></select></div>
      <div class="reg-only"><label class="f">Art</label><select id="fs"><option value="">Alle Arten</option><option>Störung</option><option>Mangel</option><option>Wartung / Checkliste</option><option>Auftrag</option></select></div>
      <div class="reg-only"><label class="f">Abrechnung</label><select id="fpt"><option value="">beliebig</option><option value="fix">Pauschalpreis</option><option value="stunde">Stundensatz</option><option value="offen">Pauschal oder Stunde</option></select></div>
      <div class="fchk"><label class="reg-only"><input type="checkbox" id="felig"> nur Aufträge, für die ich alle Nachweise habe</label><label class="reg-only"><input type="checkbox" id="ffav"> nur Favoriten ★</label><label><input type="checkbox" id="fdemo"> Demo-Ausschreibungen anzeigen</label></div>
      <div class="fchk"><button class="btn ghost sm" id="freset" type="button">Filter zurücksetzen</button></div>
    </div>
    <div id="list"><div class="empty">Lade Aufträge…</div></div>`;
  if(S.token) loadMe().then(me=>{ if(me) $("#meBox").innerHTML=me.eligible.ok?"":eligBox(me.eligible)+"<div style='height:12px'></div>"; });
  try{ const r=await api("jobs"); S.jobs=r.jobs; S.reg=!!r.registered; S.certs=r.certs; S.cats=r.cats; S.brands=r.brands||{}; S.software=r.software||{}; S.crefo_max=r.crefo_max; }
  catch(e){ $("#list").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  const cats=[...new Set(S.jobs.map(j=>j.category).filter(Boolean))];
  $("#fc").innerHTML=`<option value="">Alle Gewerke</option>`+cats.map(c=>`<option value="${c}">${esc(S.cats[c]||c)}</option>`).join("");
  const city=l=>String(l||"").split(/[-,(]/)[0].trim();
  const locs=[...new Set(S.jobs.map(j=>city(j.location)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de"));
  $("#floc").innerHTML=`<option value="">Alle Orte</option>`+locs.map(c=>`<option>${esc(c)}</option>`).join("");
  if(!S.reg){ S.f.src=""; S.f.pt=""; S.f.elig=false; S.f.fav=false; document.querySelectorAll(".reg-only").forEach(x=>x.style.display="none"); }
  const F=S.f; $("#fc").value=F.cat; $("#fs").value=F.src; $("#floc").value=F.loc; $("#fstart").value=F.start; $("#fdl").value=F.dl; $("#fpub").value=F.pub; $("#fpt").value=F.pt;
  $("#felig").checked=F.elig; $("#ffav").checked=F.fav; $("#fdemo").checked=F.demo; $("#fsort").value=F.sort;
  const upd=()=>{ S.f={q:$("#fq").value,cat:$("#fc").value,src:$("#fs").value,loc:$("#floc").value,start:$("#fstart").value,dl:$("#fdl").value,pub:$("#fpub").value,pt:$("#fpt").value,
      elig:$("#felig").checked,fav:$("#ffav").checked,demo:$("#fdemo").checked,sort:$("#fsort").value}; renderList(); };
  ["#fq","#fstart"].forEach(x=>$(x).oninput=upd); ["#fc","#fs","#floc","#fstart","#fdl","#fpub","#fpt","#felig","#ffav","#fdemo","#fsort"].forEach(x=>$(x).onchange=upd);
  $("#fmore").onclick=()=>{ S.fOpen=!S.fOpen; $("#fbox").style.display=S.fOpen?"grid":"none"; };
  $("#freset").onclick=()=>{ S.f={q:"",cat:"",src:"",loc:"",start:"",dl:"",pub:"",pt:"",elig:false,fav:false,demo:true,sort:"new"}; jobsView(); };
  renderList();
}
function renderList(){

function bidBox(j,r){

  if(!open){ box.innerHTML=mb?`<div class="card"><h3>Ihr Angebot</h3>${bidLine(mb)}</div>`:""; return; }
  if(!r.eligible.ok){ box.innerHTML=`<div class="card">${eligBox(r.eligible,true)}</div>`; return; }
  const t0=mb&&mb.status==="abgegeben"?mb.price_type:(j.price_type==="stunde"?"stunde":"fix");
  box.innerHTML=`<div class="card"><h3>${mb&&mb.status==="abgegeben"?"Ihr Angebot ändern":"Angebot abgeben"}</h3>
    ${mb&&mb.status==="abgegeben"?`<div class="small muted" style="margin-bottom:8px">Abgegeben: ${bidLine(mb)}</div>`:""}

    <div class="grid3"><div><label class="f" id="plab">Preis netto (€)</label><input class="i" id="bp" inputmode="decimal" placeholder="z. B. 380"></div>
      <div id="hw"><label class="f">Geschätzte Stunden</label><input class="i" id="bh" inputmode="decimal" placeholder="z. B. 3"></div>
      <div><label class="f">Frühester Termin</label><input class="i" id="bd" type="date"></div></div>
    <div id="sum" class="small muted" style="margin-top:6px"></div>
    <label class="f">Anmerkung (Leistungsumfang, Anfahrt, Material…)</label><textarea class="i" id="bn" maxlength="2000"></textarea>
    <div class="err" id="be"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="bs">${mb&&mb.status==="abgegeben"?"Angebot aktualisieren":"Verbindlich anbieten"}</button>
    ${mb&&mb.status==="abgegeben"?`<button class="btn danger" id="bw">Angebot zurückziehen</button>`:""}</div>
    <div class="small muted" style="margin-top:8px">Bis zum Ende der Frist können Sie Ihr Angebot ändern oder zurückziehen. Alle Preise netto zzgl. MwSt.</div></div>`;
  let pt=t0; const setPt=v=>{ pt=v; box.querySelectorAll("#pt button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); $("#plab").textContent=v==="stunde"?"Stundensatz netto (€/h)":"Pauschalpreis netto (€)"; $("#hw").style.visibility=v==="stunde"?"visible":"hidden"; sum(); };
  const sum=()=>{ const p=+String($("#bp").value).replace(",","."), h=+String($("#bh").value).replace(",","."); $("#sum").textContent=pt==="stunde"&&p&&h?`≈ ${eur(p*h)} bei ${h} Std.`:""; };
  box.querySelectorAll("#pt button").forEach(b=>b.onclick=()=>setPt(b.dataset.v));
  if(mb&&mb.status==="abgegeben"){ $("#bp").value=String(mb.price).replace(".",","); $("#bh").value=mb.hours_est?String(mb.hours_est).replace(".",","):""; $("#bd").value=mb.earliest_date||""; $("#bn").value=mb.note||""; }
  else if(j.desired_from) $("#bd").value=j.desired_from;
  $("#bp").oninput=sum; $("#bh").oninput=sum; setPt(t0);
  $("#bs").onclick=async()=>{ $("#be").textContent=""; const btn=$("#bs"); btn.disabled=true;
    try{ await api("bid",{job_id:j.id,bid:{price_type:pt,price:$("#bp").value,hours_est:pt==="stunde"?$("#bh").value:null,earliest_date:$("#bd").value,note:$("#bn").value}}); toast("✅ Angebot gespeichert"); jobView(j.job_no); }
    catch(e){ $("#be").textContent=e.message; btn.disabled=false; } };
  if($("#bw")) $("#bw").onclick=async()=>{ if(!confirm("Angebot wirklich zurückziehen?")) return; try{ await api("withdraw",{job_id:j.id}); toast("Angebot zurückgezogen"); jobView(j.job_no); }catch(e){ $("#be").textContent=e.message; } };
}
const BST={abgegeben:["abgegeben",""],zurueckgezogen:["zurückgezogen","grey"],angenommen:["Zuschlag ✓",""],abgelehnt:["nicht berücksichtigt","grey"]};

function certRows(id){ return `<div id="${id}"></div><button type="button" class="btn ghost sm" onclick="addCert('${id}')">+ Nachweis hinzufügen</button>`; }
function addCert(id,type){
  const row=document.createElement("div"); row.className="cert-row";
  row.innerHTML=`<select class="ct">${Object.entries(S.certs).filter(([k])=>k!=="sonstiges").map(([k,l])=>`<option value="${k}" ${k===type?"selected":""}>${esc(l)}</option>`).join("")}<option value="hersteller">Herstellerschulung (Ladesäulen-Hersteller) …</option><option value="software">Backend-/Software-Zertifizierung …</option><option value="sonstiges">${esc(S.certs.sonstiges||"Sonstiger Nachweis")}</option></select>
    <select class="cs" style="display:none"></select>
    <input type="date" title="Gültig bis (falls befristet)"><label class="file">📎 <span>Datei wählen</span><input type="file" accept="image/*,application/pdf"></label><button type="button" class="x" title="Entfernen">×</button>`;
  const ct=row.querySelector(".ct"), cs=row.querySelector(".cs");
  ct.onchange=()=>{ const v=ct.value, src=v==="hersteller"?S.brands:v==="software"?S.software:null; cs.style.display=src?"":"none"; if(src) cs.innerHTML=Object.entries(src).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join(""); row.classList.toggle("wide",!!src); };
  const inp=row.querySelector("input[type=file]");
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; try{ row._data=await readFile(f); row._name=f.name; row.querySelector(".file span").textContent=f.name; row.querySelector(".file").classList.add("has"); }catch(e){ toast(e.message); } };
  row.querySelector(".x").onclick=()=>row.remove();
  $("#"+id).appendChild(row);
}

}

/* ── Meine Angebote ── */
/* ── Demo-Kennzeichnung ── */
const isDemo=j=>/^AU-DEMO-/.test(j?.job_no||"")||/^\[DEMO\]/.test(j?.title||"");
const demoB=j=>isDemo(j)?`<span class="demo" title="Demo-Ausschreibung – keine echte Beauftragung">DEMO</span>`:"";
const tt=t=>String(t||"").replace(/^\[DEMO\]\s*/,"");
/* ── Favoriten ── */
function starBtn(j,inl){ return `<button class="star${j.fav?" on":""}${inl?" inl":""}" data-fav="${esc(j.id||"")}" data-no="${esc(j.job_no||"")}" title="${S.token?(j.fav?"Aus Favoriten entfernen":"Als Favorit merken"):"Zum Merken als Betrieb anmelden"}" aria-label="Favorit">${j.fav?"★":"☆"}</button>`; }
function wireStars(root){ root.querySelectorAll("[data-fav]").forEach(b=>b.onclick=async e=>{ e.stopPropagation();
  if(!S.token||!b.dataset.fav){ toast("Favoriten merken: bitte als Betrieb anmelden oder kostenlos registrieren"); go("login"); return; }
  const on=!b.classList.contains("on"); b.disabled=true;
  try{ await api("fav",{job_id:b.dataset.fav,on}); b.classList.toggle("on",on); b.textContent=on?"★":"☆"; b.title=on?"Aus Favoriten entfernen":"Als Favorit merken";
    const j=(S.jobs||[]).find(x=>x.id===b.dataset.fav); if(j) j.fav=on; toast(on?"★ Zu Favoriten hinzugefügt":"Aus Favoriten entfernt");
    if(S.tab==="favs"&&!on){ const c=b.closest(".job"); c&&c.remove(); if(!document.querySelector("#fl .job")) favView(); } }
  catch(err){ toast(err.message,true); } b.disabled=false; }); }
async function favView(){
  if(!S.token){ view.innerHTML=`<h1>★ Favoriten</h1><div class="card"><div class="muted">Mit der Merkliste speichern Sie interessante Ausschreibungen und sehen auf einen Blick Frist und Stand Ihres Angebots. Dafür bitte als Betrieb anmelden – die Registrierung ist kostenlos.</div>
    <div style="margin-top:12px"><button class="btn" onclick="go('login')">Anmelden</button> <button class="btn ghost" onclick="go('register')">Als Betrieb registrieren</button></div></div>`; return; }
  view.innerHTML=`<h1>★ Meine Favoriten</h1><div class="small muted" style="margin:-4px 2px 12px">Gemerkte Ausschreibungen – mit dem Stern in der Auftragsliste hinzufügen oder entfernen.</div><div id="fl"><div class="empty">Lade…</div></div>`;
  let r; try{ r=await api("favs"); }catch(e){ $("#fl").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  if(!r.items.length){ $("#fl").innerHTML=`<div class="empty">Noch keine Favoriten.<br>Tippen Sie in der Auftragsliste auf ☆, um eine Ausschreibung zu merken.<br><br><button class="btn" onclick="go('jobs')">Offene Aufträge ansehen</button></div>`; return; }
  const st=j=>{ const open=j.status==="offen"&&(!j.bid_deadline||Date.parse(j.bid_deadline)>Date.now()); return j.my_bid?`<span class="chip">${j.my_bid.status==="angenommen"?"Zuschlag erhalten":j.my_bid.status==="abgegeben"?"Angebot abgegeben":"Angebot "+esc(j.my_bid.status)}</span>`:open?`<b>${left(j.bid_deadline)}</b>`:`<span class="chip grey">${j.status==="offen"?"Frist abgelaufen":esc(j.status)}</span>`; };
  $("#fl").innerHTML=`<div class="jobs">${r.items.map(j=>`<div class="job" data-no="${esc(j.job_no)}">${starBtn(j)}
    <div class="no">${esc(j.job_no)}${j.source_label?" · "+esc(j.source_label):""}</div><div class="tt">${demoB(j)}${esc(tt(j.title))}</div>
    <div class="meta"><span>📍 ${esc(j.location||"–")}</span>${j.category_label?`<span>🔧 ${esc(j.category_label)}</span>`:""}<span>📅 ${j.desired_from||j.desired_to?`${j.desired_from?fmtD(j.desired_from):""}${j.desired_to?" – "+fmtD(j.desired_to):""}`:"nach Absprache"}</span></div>
    <div class="foot"><span>⏳ Frist ${fmtD(j.bid_deadline)}</span><span>${st(j)}</span></div></div>`).join("")}</div>`;
  $("#fl").querySelectorAll(".job").forEach(c=>c.onclick=()=>{ location.hash=c.dataset.no; });
  wireStars($("#fl"));
}
const pinBtn=()=>`<div class="pinbox" style="margin-top:10px"><button class="btn sm" data-pin type="button">🔑 Neue Service-PIN erzeugen</button> <span class="small muted">PIN vergessen? Eine neue PIN ersetzt die alte sofort.</span></div>`;
function wirePin(root){ root.querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{ if(!confirm("Neue Service-PIN erzeugen? Die bisherige PIN funktioniert danach nicht mehr.")) return; b.disabled=true;
  try{ const r=await api("service_pin"); b.closest(".pinbox").innerHTML=`<div class="card ok" style="margin:0"><b>Ihre neue Service-PIN:</b> <span style="font:700 22px ui-monospace,Menlo,monospace;letter-spacing:3px">${esc(r.pin)}</span><br><span class="small">Bitte notieren und vertraulich behandeln – sie wird nur jetzt angezeigt. Anmeldung im Service-Zugang: <a href="${esc(r.service_url)}" target="_blank" rel="noopener">${esc(r.service_url)}</a></span></div>`; }
  catch(e){ toast(e.message); b.disabled=false; } }); }
async function myView(){
  if(!S.token) return loginView();
  view.innerHTML=`<h1>Meine Angebote & Aufträge</h1><div id="msvc"></div><div id="ml"><div class="empty">Lade…</div></div>`;
  let r; try{ r=await api("my"); }catch(e){ $("#ml").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  if((r.items||[]).some(x=>x.bid.status==="angenommen")){ $("#msvc").innerHTML=`<div class="card ok"><b>🔧 Service-Zugang</b><br><span class="small">Mit dem Zuschlag haben Sie eine persönliche Service-PIN per E-Mail erhalten. Damit melden Sie sich vor Ort im Service-Zugang an (Checkliste, Arbeitszeit, Fotos, Protokoll).</span>${pinBtn()}</div>`; wirePin($("#msvc")); }
  if(!r.items.length){ $("#ml").innerHTML=`<div class="empty">Noch keine Angebote abgegeben.<br><br><button class="btn" onclick="go('jobs')">Offene Aufträge ansehen</button></div>`; return; }
  const grp=[["Zuschlag erhalten",x=>x.bid.status==="angenommen"],["Offene Angebote",x=>x.bid.status==="abgegeben"],["Abgeschlossen",x=>["abgelehnt","zurueckgezogen"].includes(x.bid.status)]];
  $("#ml").innerHTML=grp.map(([t,f])=>{ const l=r.items.filter(f); if(!l.length) return ""; return `<h2>${t} (${l.length})</h2><div class="card" style="padding:4px 12px;overflow-x:auto"><table class="tbl"><tr><th>Auftrag</th><th>Ort</th><th>Frist</th><th>Ihr Angebot</th></tr>
    ${l.map(x=>`<tr style="cursor:pointer" onclick="location.hash='${esc(x.job?.job_no||"")}'"><td>${demoB(x.job)}<b>${esc(tt(x.job?.title)||"–")}</b><div class="small muted">${esc(x.job?.job_no||"")}${x.job?.status&&x.job.status!=="offen"?" · "+esc(x.job.status):""}${(x.changes||[]).some(c=>c.kind==="aenderung"&&c.status==="offen")?` · <span class="chip amber">✏️ Änderung bestätigen</span>`:""}</div></td><td>${esc(x.job?.location||"–")}</td><td>${fmtD(x.job?.bid_deadline)}</td><td>${bidLine(x.bid)}</td></tr>`).join("")}</table></div>`; }).join("");
  const run=r.items.filter(x=>x.bid.status==="angenommen"&&x.job);
  if(run.length){ $("#ml").insertAdjacentHTML("afterbegin",`<h2>📑 Änderungen & Nachträge</h2><div class="small muted" style="margin:-4px 2px 10px">Änderungen des Auftraggebers gelten erst nach Ihrer Bestätigung. <b>Mehrkosten bitte immer vor der Ausführung anmelden</b> (§ 2 Abs. 6 VOB/B) – sonst kann der Vergütungsanspruch entfallen.</div>${run.map(x=>coBox(x,r.co_basis||{})).join("")}`); wireCo($("#ml"),run); }
}
const CO_ST={offen:["bitte bestätigen","amber"],bestaetigt:["bestätigt",""],abgelehnt:["abgelehnt","warn"],zurueckgezogen:["zurückgezogen","grey"],angemeldet:["wartet auf Freigabe","amber"],freigegeben:["freigegeben",""]};
const CO_F={desired_from:"Termin ab",desired_to:"Termin bis",location_public:"Ort",description:"Leistungsbeschreibung"};
const coV=(k,v)=>v==null||v===""?"–":/^desired_/.test(k)?fmtD(v):k==="description"?String(v).slice(0,200)+(String(v).length>200?" …":""):String(v);
function coBox(x,basis){
  const j=x.job, co=x.co||{}, cl=x.changes||[], done=j.status!=="vergeben";
  return `<div class="card" data-co="${esc(j.id)}"><div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:200px">${demoB(j)}<b>${esc(tt(j.title))}</b><div class="small muted">${esc(j.job_no)} · Vertragsstand v${j.version||1}</div></div>
      <div class="small" style="text-align:right">Zuschlag <b>${co.base_type==="stunde"?eur(co.base)+"/h":eur(co.base)}</b>${co.approved?`<br>+ Nachträge <b>${eur(co.approved)}</b>`:""}${co.contract!=null&&co.approved?`<br>= <b>${eur(co.contract)}</b>`:""}</div></div>
    ${cl.length?cl.map(c=>{ const st=CO_ST[c.status]||[c.status,"grey"];
      return `<div style="border-top:1px solid var(--line,#e6ebe8);padding:10px 0;margin-top:8px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1">${c.kind==="nachtrag"?"📝 Ihr Nachtrag":"✏️ Änderung des Auftraggebers"} · ${esc(c.change_no)}</b><span class="chip ${st[1]}">${st[0]}</span></div>
        <div class="small muted">${new Date(c.created_at).toLocaleString("de-DE")}${c.basis_label?" · "+esc(c.basis_label):""}</div>
        ${Object.keys(c.changes||{}).length?`<table class="tbl" style="margin:6px 0">${Object.entries(c.changes).map(([k,v])=>`<tr><td class="muted">${esc(CO_F[k]||k)}</td><td style="text-decoration:line-through;color:#999">${esc(coV(k,v.from))}</td><td><b>${esc(coV(k,v.to))}</b></td></tr>`).join("")}</table>`:""}
        ${c.kind==="nachtrag"?`<div><b>${esc(c.title||"")}</b></div>`:""}${c.description?`<div class="small" style="white-space:pre-wrap">${esc(c.description)}</div>`:""}
        <div class="small">${c.amount!=null?`Betrag: <b>${c.amount>0?"+":""}${eur(c.amount)}</b>${c.approved_amount!=null&&+c.approved_amount!==+c.amount?` → freigegeben <b>${eur(c.approved_amount)}</b>`:""}`:""}${c.time_days?` · Zeit: <b>${c.time_days>0?"+":""}${c.time_days} Tag(e)</b>`:""}</div>
        ${c.decision_note?`<div class="small muted">Hinweis: ${esc(c.decision_note)}</div>`:""}
        ${c.kind==="aenderung"&&c.status==="offen"?`<div style="margin-top:8px"><textarea class="i" data-ackn="${esc(c.id)}" rows="2" placeholder="Anmerkung (bei Ablehnung Pflicht)"></textarea><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-ack="${esc(c.id)}" data-ok="1">✓ Änderung bestätigen</button><button class="btn sm ghost" data-ack="${esc(c.id)}" data-ok="0">Ablehnen</button></div><div class="small muted" style="margin-top:4px">Entstehen Mehrkosten? Bitte zusätzlich unten einen Nachtrag anmelden – vor der Ausführung.</div></div>`:""}
        ${c.kind==="nachtrag"&&c.status==="angemeldet"?`<div class="small" style="margin-top:6px;color:#9a6700"><b>Bitte erst nach der Freigabe ausführen.</b> <a href="#" data-cow="${esc(c.id)}">Zurückziehen</a></div>`:""}</div>`; }).join(""):""}
    ${done?"":`<div style="margin-top:10px"><button class="btn sm ghost" data-conew="${esc(j.id)}">📝 Mehrkosten / Nachtrag anmelden</button></div>
    <div data-coform="${esc(j.id)}" style="display:none;margin-top:10px;border-top:1px solid var(--line,#e6ebe8);padding-top:10px">
      <label class="f">Art</label><select class="i" data-cf="basis">${Object.entries(basis).map(([k,l])=>`<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select>
      <label class="f">Leistung (kurz) *</label><input class="i" data-cf="title" placeholder="z. B. Zusätzlicher Erdungsspieß, Kabeltrasse 12 m">
      <label class="f">Begründung / Beschreibung *</label><textarea class="i" data-cf="description" rows="3" placeholder="Was ist vor Ort anders als ausgeschrieben, wer hat es angeordnet?"></textarea>
      <div class="grid2"><div><label class="f">Mehrkosten netto (€)</label><input class="i" data-cf="amount" inputmode="decimal" placeholder="0,00"></div><div><label class="f">Mehrzeit (Tage)</label><input class="i" data-cf="time_days" type="number" min="0" placeholder="0"></div></div>
      <label class="f">Foto / Angebot (JPG, PNG, PDF – optional)</label><input class="i" type="file" data-cf="file" accept="image/jpeg,image/png,application/pdf">
      <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px" class="small"><input type="checkbox" data-cf="before" checked style="width:auto;margin-top:2px"> Die Leistung ist <b>noch nicht</b> ausgeführt (Anzeige vor Ausführung)</label>
      <div class="small muted" style="margin-top:6px">Bis ${eur(co.limit)} ohne Mehrzeit wird automatisch freigegeben. Darüber entscheidet der Auftraggeber – bitte erst nach der Freigabe ausführen.</div>
      <div class="err" data-cferr></div><button class="btn sm" data-cosend="${esc(j.id)}" style="margin-top:8px">Nachtrag verbindlich anmelden</button></div>`}</div>`;
}
function wireCo(root,run){
  root.querySelectorAll("[data-ack]").forEach(b=>b.onclick=async()=>{ const ok=b.dataset.ok==="1", note=root.querySelector(`[data-ackn="${b.dataset.ack}"]`).value;
    if(!ok&&!note.trim()) return toast("Bitte kurz begründen, warum Sie ablehnen");
    if(ok&&!confirm("Änderung verbindlich bestätigen? Sie wird damit Vertragsstand.")) return; b.disabled=true;
    try{ await api("change_ack",{id:b.dataset.ack,accept:ok,note}); toast(ok?"✓ Änderung bestätigt":"Änderung abgelehnt – der Auftraggeber ist informiert"); myView(); }catch(e){ toast(e.message); b.disabled=false; } });
  root.querySelectorAll("[data-cow]").forEach(a=>a.onclick=async e=>{ e.preventDefault(); if(!confirm("Nachtrag zurückziehen?")) return; try{ await api("co_withdraw",{id:a.dataset.cow}); toast("Zurückgezogen"); myView(); }catch(err){ toast(err.message); } });
  root.querySelectorAll("[data-conew]").forEach(b=>b.onclick=()=>{ const f=root.querySelector(`[data-coform="${b.dataset.conew}"]`); f.style.display=f.style.display==="none"?"block":"none"; });
  root.querySelectorAll("[data-cosend]").forEach(b=>b.onclick=async()=>{ const f=root.querySelector(`[data-coform="${b.dataset.cosend}"]`), g=k=>f.querySelector(`[data-cf="${k}"]`), err=f.querySelector("[data-cferr]");
    const co={basis:g("basis").value,title:g("title").value,description:g("description").value,amount:g("amount").value,time_days:g("time_days").value?+g("time_days").value:undefined,before_execution:g("before").checked};
    err.textContent="";
    if(!co.title.trim()||!co.description.trim()) return err.textContent="Bitte Leistung und Begründung angeben.";
    if(!co.amount&&!co.time_days) return err.textContent="Bitte Mehrkosten oder Mehrzeit angeben.";
    const file=g("file").files[0]; if(file){ if(file.size>8*1024*1024) return err.textContent="Datei zu groß (max. 8 MB)."; co.attachment=await new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(file); }); }
    if(!co.before_execution&&!confirm("Sie geben an, dass die Leistung bereits ausgeführt ist. Ohne vorherige Anzeige kann der Anspruch auf zusätzliche Vergütung entfallen. Trotzdem anmelden?")) return;
    b.disabled=true;
    try{ const r=await api("co_submit",{job_id:b.dataset.cosend,co}); toast(r.change.status==="freigegeben"?"✓ Nachtrag angemeldet und automatisch freigegeben":"✓ Nachtrag angemeldet – bitte Freigabe abwarten"); myView(); }catch(e){ err.textContent=e.message; b.disabled=false; } });
}

/* ── Mein Betrieb ── */
async function profileView(){
  if(!S.token) return loginView();
  view.innerHTML=`<div class="empty">Lade…</div>`;
  const me=await loadMe(); if(!me) return loginView();
  const st={neu:["in Prüfung","amber"],geprueft:["geprüft & freigegeben",""],gesperrt:["gesperrt","warn"]}[me.status]||[me.status,"grey"];
  const crefo=me.crefo_index!=null?`Index ${me.crefo_index} ${me.crefo_index<=me.crefo_max?"✓":"✗"} · geprüft ${fmtD(me.crefo_checked_at)}`:"noch nicht geprüft";
  view.innerHTML=`<h1>${esc(me.company)}</h1><div style="margin-bottom:12px"><span class="chip ${st[1]}">${st[0]}</span></div>
    ${eligBox(me.eligible)}
    <h2>Prüfstatus</h2><div class="card"><dl class="dl"><dt>Betrieb</dt><dd>${st[0]}${me.status_note?` · <span class="muted">${esc(me.status_note)}</span>`:""}</dd><dt>Creditreform</dt><dd>${esc(me.crefo_no||"Crefonummer fehlt")} · ${crefo}</dd></dl></div>
    <h2>Nachweise</h2><div class="card">
      ${(me.certs||[]).length?`<table class="tbl" style="margin-bottom:10px"><tr><th>Nachweis</th><th>Gültig bis</th><th>Status</th></tr>${me.certs.map(c=>{ const exp=c.valid_until&&Date.parse(c.valid_until+"T23:59:59")<Date.now(); return `<tr><td>${esc(c.label)}<div class="small muted">${esc(c.name||"")}</div></td><td>${c.valid_until?fmtD(c.valid_until):"–"}</td><td>${exp?`<span class="chip warn">abgelaufen</span>`:c.verified?`<span class="chip">geprüft</span>`:`<span class="chip amber">in Prüfung</span>`}</td></tr>`; }).join("")}</table>`:`<p class="muted small">Noch keine Nachweise hochgeladen.</p>`}
      <h3 style="margin-top:6px">Nachweis nachreichen</h3>${certRows("pc")}<div><button class="btn sm" id="pcu" style="margin-top:8px">Hochladen</button></div></div>
    <h2>Firmendaten</h2><div class="card">
      <div class="grid2"><div><label class="f">Ansprechpartner</label><input class="i" id="p_name" value="${esc(me.contact_name||"")}"></div><div><label class="f">Telefon</label><input class="i" id="p_phone" value="${esc(me.phone||"")}"></div>
      <div><label class="f">Straße, Nr.</label><input class="i" id="p_street" value="${esc(me.street||"")}"></div><div class="grid2" style="gap:0 8px"><div><label class="f">PLZ</label><input class="i" id="p_zip" value="${esc(me.zip||"")}"></div><div><label class="f">Ort</label><input class="i" id="p_city" value="${esc(me.city||"")}"></div></div>
      <div><label class="f">Website</label><input class="i" id="p_web" value="${esc(me.website||"")}"></div><div><label class="f">Einsatzradius (km)</label><input class="i" id="p_radius" value="${esc(me.radius_km??"")}"></div>
      ${me.crefo_index==null?`<div><label class="f">Crefonummer</label><input class="i" id="p_crefo" value="${esc(me.crefo_no||"")}"></div>`:""}<div><label class="f">Neues Passwort (optional)</label><input class="i" id="p_pw" type="password" autocomplete="new-password"></div></div>
      <label class="f">Gewerke / Leistungen</label><div id="pcats">${catBoxes(me.categories)}</div>
      <label class="f">Kurzprofil</label><textarea class="i" id="p_about">${esc(me.about||"")}</textarea>
      <div class="err" id="perr"></div><button class="btn" id="ps" style="margin-top:10px">Speichern</button>
      <p class="small muted">Firmenname und E-Mail ändern wir auf Anfrage, damit die Prüfung gültig bleibt.</p></div>`;
  eyeify(view);
  $("#pcu").onclick=async()=>{ const c=collectCerts("pc"); if(!c.length) return toast("Bitte eine Datei wählen"); $("#pcu").disabled=true; try{ await api("doc_upload",{certs:c}); toast("✅ Nachweis hochgeladen, wir prüfen ihn."); profileView(); }catch(e){ toast(e.message); $("#pcu").disabled=false; } };
  $("#ps").onclick=async()=>{ $("#perr").textContent=""; const v=id=>$("#"+id)?$("#"+id).value.trim():undefined;
    try{ await api("profile_save",{provider:{contact_name:v("p_name"),phone:v("p_phone"),street:v("p_street"),zip:v("p_zip"),city:v("p_city"),website:v("p_web"),radius_km:v("p_radius"),crefo_no:v("p_crefo"),about:v("p_about"),password:$("#p_pw").value||undefined,categories:[...$("#pcats").querySelectorAll("input:checked")].map(i=>i.value)}}); toast("✅ Gespeichert"); profileView(); }
    catch(e){ $("#perr").textContent=e.message; } };
}

/* ── Start ── */
(async()=>{ renderHead(); const h=decodeURIComponent(location.hash.slice(1)); if(S.token) await loadMe(); h==="meine"?go("my"):h?go("job",h):go("jobs"); })();
</script>
