<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>HAPPY CHARGING Service</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--muted:#5d6b65;--line:#e1e6e3;--brand:#0a8f5a;--brand-soft:#e3f4ec;--warn:#b42318;--warn-soft:#fdecea;--amber:#9a6700;--amber-soft:#fff6db;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
header svg{width:20px;height:26px;flex:none}
header .t{font-weight:800;font-size:16px;flex:1;white-space:nowrap}
header .t span{font-weight:500;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.3px}
h2{font-size:16px;margin:18px 2px 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--brand);color:#fff;text-align:center}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.mt{margin-top:10px}
.back{background:none;border:0;color:var(--muted);padding:4px 0 10px;font-size:15px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--brand-soft);color:#08603d}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.grey{background:#eef1ef;color:var(--muted)}
/* PIN */
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 8px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.pin-dots i.on{background:var(--brand);border-color:var(--brand)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.keys button{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 0;font-size:22px;font-weight:700}
.keys button:active{background:var(--brand-soft)}
.err{color:var(--warn);text-align:center;min-height:22px;font-weight:600;font-size:14px}
/* Station */
.st-img{display:block;width:calc(100% + 32px);margin:-16px -16px 12px;height:130px;object-fit:cover;border-radius:var(--r) var(--r) 0 0}
.st-img[hidden]{display:none}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.inc{border-color:#f3c2bc;background:#fff7f6}
.inc .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--muted);font-size:12px;line-height:1.3}
.rec{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #eef1ef;font-size:14px}
.rec:first-child{border-top:0}
/* Checkliste */
.sel{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.sel button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.sel button.on{border-color:var(--brand);background:var(--brand-soft)}
.cpr{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.cpr code{font-size:12px;background:#f2f5f3;border-radius:6px;padding:3px 6px}
.prog{height:6px;background:#e7ece9;border-radius:3px;overflow:hidden;margin:10px 0 2px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .2s}
.item{border-top:1px solid #eef1ef;padding:14px 0}
.item:first-of-type{border-top:0}
.item .q{font-weight:700;line-height:1.35}
.item .q .req{color:var(--warn)}
.item .hint{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.4}
.tri{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px;margin-top:10px}
.tri button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:700;font-size:15px}
.tri button.ok.on{background:#e3f4ec;border-color:#0a8f5a;color:#08603d}
.tri button.bad.on{background:var(--warn-soft);border-color:#d03b3b;color:var(--warn)}
.tri button.na.on{background:#eef1ef;border-color:#9aa5a0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.opts button.on{border-color:var(--brand);background:var(--brand-soft)}
input.f,textarea.f{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-top:10px;background:#fff}
textarea.f{min-height:76px;resize:vertical}
.photo{display:flex;align-items:center;gap:10px;margin-top:10px}
.photo label{border:1.5px dashed #b9d9c8;background:#f7fbf9;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;color:#08603d}
.photo input{display:none}
.photo img{width:64px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.miss{outline:2px solid #d03b3b;outline-offset:4px;border-radius:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:12px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--brand)}
.big{font-size:44px;text-align:center}
.center{text-align:center}
.timer{position:sticky;top:58px;z-index:4;display:flex;align-items:center;gap:10px;background:#14201b;color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.timer.paused{background:#9a6700}
.timer .tv{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:.5px}
.timer .tl{flex:1;font-size:12px;line-height:1.3;opacity:.85}
.timer button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;background:#fff;color:#14201b}
.timer .i{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:7px 10px}
.howto{font-size:13px;line-height:1.5;background:#f2f5f3;border-radius:12px;padding:10px 12px;margin:-6px 0 14px}
.howto b{display:block;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2 input.f{margin-top:4px}
.tsum{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:8px 0;border-bottom:1px solid #eef1ef}
.tsum b{font-size:18px}
.row{display:flex;gap:8px}
.pj{display:block;width:100%;text-align:left;cursor:pointer}
.pj .row{justify-content:space-between;align-items:center}
.pj-c{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pj:active{background:var(--brand-soft)}
.btn.warnb{background:#fff;color:var(--warn);border:1.5px solid #f3c2bc}
.hint{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px;line-height:1.4}
.prio{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff;background:#9aa5a0}
.prio.pA{background:#d03b3b}.prio.pB{background:#eda100}.prio.pC{background:#7a8a83}
.def{border-left:4px solid #eda100}.def.pA{border-left-color:#d03b3b;background:#fff7f6}.def.pC{border-left-color:#9aa5a0}
.due-od{color:var(--warn);font-weight:700}
.def .row{justify-content:space-between;align-items:flex-start;gap:10px}.def .chip{flex:none}
.big-choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px;margin-top:10px;cursor:pointer}
.big-choice>b{display:block;font-size:17px;margin-bottom:4px}.big-choice small{color:var(--muted);font-size:13px;line-height:1.4;display:block}
.big-choice.st{border-color:#f3c2bc;background:#fff7f6}.big-choice.mg{border-color:#f5d78a;background:#fffbef}.big-choice.gf{border-color:#d03b3b;background:#fdecea}
.prio-card{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.prio-card.on{border-color:var(--brand);background:var(--brand-soft)}.prio-card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.no{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;background:var(--brand-soft);color:#08603d;border-radius:12px;padding:12px;text-align:center;margin:10px 0}
</style>
</head>
<body>
<header>
  <svg viewBox="190 90 800 1000"><polygon points="699,118 262,679 556,679 479,1062 916,501 622,501" fill="#F08C00"/></svg>
  <div class="t">HAPPY CHARGING <span>Service</span></div>
  <button class="btn ghost sm hidden" id="out" style="display:none">Abmelden</button>
</header>
<div class="wrap" id="view"></div>

<script>
const API="https://xsyuhfleesstrchcwspg.supabase.co/functions/v1/charge-field";
const IMG="https://xsyuhfleesstrchcwspg.supabase.co/storage/v1/object/public/charge-public/stations/";
const $=s=>document.querySelector(s), view=$("#view");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"});
let station=decodeURIComponent((location.hash||"").slice(1)).split(".")[0]||"";
window.addEventListener("hashchange",()=>{ const n=decodeURIComponent((location.hash||"").slice(1)).split(".")[0]||""; if(n===station) return; station=n; S.run=null; if(S.auth) (station?homeView():projectsView()); else loginView(); });
function pickStation(id){ station=id; history.replaceState(null,"","#"+encodeURIComponent(id)); S.run=null; homeView(); scrollTo(0,0); }
let S={auth:null,home:null,run:null};
try{ const a=JSON.parse(sessionStorage.getItem("hc_field")||"null"); if(a&&a.exp>Date.now()) S.auth=a; }catch(e){}

async function api(action,payload={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,station,token:S.auth&&S.auth.token,...payload})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&j.relogin){ logout(); throw new Error(j.error||"Bitte neu anmelden"); }
  if(!r.ok) throw new Error(j.error||("Fehler "+r.status));
  return j;
}
function logout(){ S.auth=null; try{ sessionStorage.removeItem("hc_field"); }catch(e){} $("#out").style.display="none"; loginView(); }
$("#out").onclick=logout;

/* ── Anmeldung mit PIN ── */
function loginView(msg){
  let pin="";
  view.innerHTML=`<div class="card center" style="padding-top:22px">
    <div class="lbl">Service-Zugang${station?" · Standort "+esc(station):""}</div>
    <h1 style="margin-top:6px">Persönliche PIN eingeben</h1>
    <p class="muted small">Für Service & Technik, Partner & Standort sowie Behörden & Einsatzkräfte. Die PIN vergibt der Betreiber im Dashboard.</p>
    <div class="pin-dots" id="dots"></div><div class="err" id="err">${esc(msg||"")}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--brand);color:#fff;border-color:var(--brand)">OK</button></div>
    ${station?"":`<p class="small muted">Ohne QR-Code: Nach der Anmeldung wählen Sie das Projekt aus.</p>`}
    <p class="small muted" style="margin-top:16px"><a href="../#${encodeURIComponent(station)}" style="color:var(--muted)">‹ zurück zur Kunden-Hilfe</a></p></div>`;
  const draw=()=>{ $("#dots").innerHTML=Array.from({length:Math.max(4,pin.length)},(_,i)=>`<i class="${i<pin.length?"on":""}"></i>`).join(""); };
  draw();
  const go=async()=>{ if(pin.length<4) return; $("#err").textContent="Prüfe …";
    try{ const r=await api("login",{pin}); S.auth={token:r.token,staff:r.staff,exp:Date.now()+11.5*3600e3}; try{ sessionStorage.setItem("hc_field",JSON.stringify(S.auth)); }catch(e){} station?homeView():projectsView(); }
    catch(e){ pin=""; draw(); $("#err").textContent=e.message; } };
  view.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k;
    if(k==="del") pin=pin.slice(0,-1); else if(k==="ok") return go(); else if(pin.length<8) pin+=k;
    $("#err").textContent=""; draw(); });
}

/* ── Standort-Übersicht ── */
const cpName=(st,n)=>{ const c=(st.connectors||[]).find(x=>x.n===n); if(!c) return n?"LP "+n:""; const ch=(st.chargers||[]).find(x=>x.n===c.charger); const loc=(st.connectors||[]).filter(x=>x.charger===c.charger).findIndex(x=>x.n===n)+1; return (ch?ch.label+" · ":"")+"Ladepunkt "+loc; };
function due(l){ if(!l.interval_days) return null; if(!l.last) return "fällig"; const days=(Date.now()-new Date(l.last.finished_at))/864e5; return days>=l.interval_days?"fällig":days>=l.interval_days*.85?"bald fällig":null; }
/* ── Projektauswahl: anstehende Arbeiten je Projekt ── */
async function projectsView(){
  $("#out").style.display="inline-block";
  view.innerHTML=`<div class="muted">Lade Projekte …</div>`;
  let r; try{ r=await api("projects"); }catch(e){ view.innerHTML=`<div class="card"><b>${esc(e.message)}</b><button class="btn ghost mt" onclick="logout()">Mit anderer PIN anmelden</button></div>`; return; }
  const P=r.projects.map(p=>({...p,work:p.incidents*100+p.defects*10+p.due})).sort((a,b)=>b.work-a.work||String(a.project_id).localeCompare(String(b.project_id)));
  const total=P.reduce((x,p)=>({i:x.i+p.incidents,d:x.d+p.defects,f:x.f+p.due}),{i:0,d:0,f:0});
  const me=S.auth&&S.auth.staff||{};
  const draw=q=>{ q=(q||"").toLowerCase(); const L=P.filter(p=>!q||[p.project_id,p.name,p.address,p.id].join(" ").toLowerCase().includes(q));
    $("#plist").innerHTML=L.map(p=>`<button class="card pj" data-st="${esc(p.id)}"><div class="row"><div style="text-align:left"><b style="font-size:17px">${esc(p.project_id||p.id)}</b><div class="small muted">${esc(p.name||"")}${p.address?" · "+esc(p.address):""}</div></div><span class="muted" style="font-size:22px">›</span></div>
      <div class="pj-c">${p.incidents?`<span class="chip warn">⚠️ ${p.incidents} Störung${p.incidents>1?"en":""}</span>`:""}${p.defects?`<span class="chip amber">🛠 ${p.defects} Mangel${p.defects>1?"/Mängel":""}</span>`:""}${p.due?`<span class="chip amber">📋 ${p.due} Checkliste${p.due>1?"n":""} fällig</span>`:""}${p.work?"":`<span class="chip">✓ nichts offen</span>`}<span class="chip grey">${p.connectors} Ladepunkte</span></div></button>`).join("")||`<div class="card muted">Kein Projekt gefunden.</div>`;
    view.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>pickStation(b.dataset.st)); };
  view.innerHTML=`<div class="small muted" style="margin:0 2px 8px">Angemeldet: <b style="color:var(--ink)">${esc(me.name||"")}</b>${me.role_label?" · "+esc(me.role_label):""}</div>
    <div class="card"><h1>Projekt wählen</h1><div class="muted small">Anstehende Arbeiten für Ihre Rolle: <b>${total.i}</b> Störungen · <b>${total.d}</b> Mängel · <b>${total.f}</b> fällige Checklisten in ${P.length} Projekt${P.length===1?"":"en"}.</div>
      ${P.length>4?`<input class="f" id="pq" type="search" placeholder="🔎 Projekt, Name oder Adresse">`:""}</div>
    <div id="plist"></div>`;
  draw(""); if($("#pq")) $("#pq").oninput=()=>draw($("#pq").value);
}
async function homeView(){
  $("#out").style.display="inline-block";
  view.innerHTML=`<div class="muted">Lade Standort …</div>`;
  if(!station) return projectsView();
  try{ S.home=await api("home"); }catch(e){ view.innerHTML=`<div class="card"><b>${esc(e.message)}</b><button class="btn mt" onclick="projectsView()">Anderes Projekt wählen</button><button class="btn ghost mt" onclick="logout()">Mit anderer PIN anmelden</button></div>`; return; }
  if(Array.isArray(S.home.roles)&&S.home.roles.length){ ROLE_L={}; S.home.roles.filter(r=>r.repair).forEach(r=>ROLE_L[r.k]=r.l); }
  const h=S.home, st=h.station, stoer=h.checklists.find(l=>l.id==="stoerung");
  view.innerHTML=`<div class="row" style="margin:0 2px 8px;align-items:center"><div class="small muted" style="flex:1">Angemeldet: <b style="color:var(--ink)">${esc(h.me.name)}</b> · ${esc(h.me.role_label)}${h.me.company?" · "+esc(h.me.company):""}</div><button class="btn ghost sm" id="swp">⇄ Projekt wechseln</button></div>
  ${(()=>{ let t=null; try{ t=JSON.parse(localStorage.getItem("hc_timer")||"null"); }catch(e){} if(!t||Date.now()-Date.parse(t.started)>16*3600e3) return ""; const [ts,cid,tk]=t.key.split("|"); if(ts!==station&&ts!==st.id) return ""; const l=h.checklists.find(x=>x.id===cid); if(!l) return "";
    return `<div class="card" style="border-color:#14201b"><b>⏱ Laufender Einsatz</b><div class="small muted">${esc(l.title)}${tk?" · "+esc(tk):""} · seit ${tme(t.started)}</div><button class="btn mt" id="resume" data-c="${esc(cid)}" data-t="${esc(tk)}">Fortsetzen</button></div>`; })()}
  <div class="card"><img class="st-img" id="stImg" hidden alt=""><div class="lbl">Standort</div><h1>${esc(st.project_id||st.id)}</h1><div class="muted">${esc(st.name||"")}${st.address?"<br>"+esc(st.address):""}</div>
    <div class="small muted" style="margin-top:6px">${(st.chargers||[]).length} Charger · ${(st.connectors||[]).length} Ladepunkte</div>
    <button class="btn warnb mt" id="repInc">⚠️ Problem melden</button></div>
  ${h.incidents.length?`<h2>⚠️ Offene Störungen (${h.incidents.length})</h2>${h.incidents.map(i=>`<div class="card inc"><div class="row"><div><b>${esc(i.connector?cpName(st,i.connector):"Standort allgemein")}</b><br><span class="small">${esc(i.title||"")}</span>${i.desc?`<br><span class="small">${esc(i.desc)}</span>`:""}<br><span class="small muted">${esc(i.ticket_no)} · seit ${fmt(i.created_at)} · ${i.reporter?"🔧 gemeldet von "+esc(i.reporter):i.reports+"× von Kunden gemeldet"}</span></div><span class="chip ${i.status==="in_arbeit"?"amber":"warn"}">${i.status==="in_arbeit"?"in Arbeit":"neu"}</span></div>
      ${stoer?`<button class="btn mt" data-inc="${esc(i.ticket_no)}" data-cp="${i.connector||""}">🔧 Einsatz dokumentieren</button>`:""}</div>`).join("")}`:""}
  ${(h.defects||[]).length?`<h2>🛠 Offene Mängel (${h.defects.length})</h2><div class="small muted" style="margin:-4px 2px 10px">Ladepunkt funktioniert – Behebung nach Priorität und Fälligkeit.</div>${h.defects.map(d=>{ const od=d.due_at&&new Date(d.due_at)<new Date();
      return `<div class="card def p${esc(d.priority||"B")}" id="d-${esc(d.id)}"><div class="row"><div><span class="prio p${esc(d.priority||"B")}">${esc(d.priority||"B")}</span> <b>${esc(d.item_text)}</b><br><span class="small">${esc(defWhere(st,d))}${d.note?" · "+esc(d.note):""}</span>
        <br><span class="small muted">${esc(d.defect_no||"")} · ${SRC[d.source]||"📋"} ${esc(d.created_by||"")} · ${fmt(d.created_at)}</span>
        ${d.due_at?`<br><span class="small ${od?"due-od":"muted"}">${od?"⏰ überfällig seit "+fmt(d.due_at):"fällig bis "+fmt(d.due_at)}</span>`:""}</div><span class="chip ${d.status==="in_arbeit"?"amber":"grey"}">${d.status==="in_arbeit"?"in Arbeit":"offen"}</span></div>

/* ── Checkliste durchführen ── */
function startRun(id,opt={}){
  const cl=S.home.checklists.find(l=>l.id===id); if(!cl) return;
  const c=opt.connector?(S.home.station.connectors||[]).find(x=>x.n===opt.connector):null;
  const key=station+"|"+id+"|"+(opt.ticket||opt.defect&&opt.defect.id||"");
  let t=null; try{ t=JSON.parse(localStorage.getItem("hc_timer")||"null"); }catch(e){}
  const resume=t&&t.key===key&&Date.now()-Date.parse(t.started)<16*3600e3;
  const dfc=opt.defect||null;
  S.run={cl,key,answers:{},charger:dfc?dfc.charger:c?c.charger:null,connector:dfc?dfc.connector:opt.connector||null,ticket:opt.ticket||null,defect:dfc,notes:"",resolve:false,restOn:false,rest:"",restPrio:"B",
    started:resume?t.started:new Date().toISOString(),pauseMs:resume?t.pauseMs||0:0,pausedAt:resume?t.pausedAt||null:null,resumed:!!resume,
    corrOn:false,corr:"",timeNote:"",travel:"",km:"",matText:"",matCost:"",howto:false};
  saveTimer(); runView(); scrollTo(0,0);
}
/* ── Zeitmessung vor Ort ──
   Beginn = Öffnen der Checkliste · Ende = „Protokoll abschließen“ · Pausen werden abgezogen.
   Der Timer bleibt erhalten, wenn die Seite neu geladen wird (gleiche Checkliste / Störung). */
function saveTimer(){ const R=S.run; if(!R) return; try{ localStorage.setItem("hc_timer",JSON.stringify({key:R.key,started:R.started,pauseMs:R.pauseMs,pausedAt:R.pausedAt})); }catch(e){} }
function clearTimer(){ try{ localStorage.removeItem("hc_timer"); }catch(e){} }
function pauseMsNow(R){ return R.pauseMs+(R.pausedAt?Date.now()-Date.parse(R.pausedAt):0); }
function workMs(R){ return Math.max(0,Date.now()-Date.parse(R.started)-pauseMsNow(R)); }
const workMin=R=>{ const m=Math.round(workMs(R)/60000); return Math.max(m,workMs(R)>0?1:0); };
const hms=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/3600)+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const hm=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" h";
const tme=d=>new Date(d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
setInterval(()=>{ const R=S.run, v=document.getElementById("tmv"); if(!R||!v) return; v.textContent=hms(workMs(R));
  const g=document.getElementById("tmGross"); if(g) g.textContent=workMin(R)+" Min."; },1000);
function timerHTML(R){
  const p=Math.round(pauseMsNow(R)/60000);
  return `<div class="timer ${R.pausedAt?"paused":""}" id="tmr"><div><div class="tv" id="tmv">${hms(workMs(R))}</div></div>
    <div class="tl">${R.pausedAt?"⏸ Pause seit "+tme(R.pausedAt):"⏱ Arbeitszeit vor Ort"}<br>Beginn ${tme(R.started)}${R.resumed?" (fortgesetzt)":""}${p?" · "+p+" Min. Pause":""}</div>
    <button class="i" id="tmInfo" aria-label="Wie wird gemessen?">?</button><button id="tmP">${R.pausedAt?"▶ Weiter":"⏸ Pause"}</button></div>
  ${R.howto?`<div class="howto"><b>So wird die Zeit gemessen</b>Die Arbeitszeit vor Ort startet automatisch, wenn Sie die Checkliste öffnen, und endet mit „Protokoll abschließen“. Pausen (Taste ⏸) werden abgezogen. Stimmt die Zeit nicht – z. B. weil Sie schon vorher gearbeitet haben –, können Sie sie am Ende mit Begründung korrigieren; die gemessene Zeit bleibt im Protokoll sichtbar. Anfahrt und Material werden getrennt erfasst.</div>`:""}`;
}
const answered=(it,a)=>!a?false:it.type==="check"?(a.ok!=null||a.na):it.type==="photo"?!!a.photo:(a.value!=null&&a.value!=="");
function runView(){
  const R=S.run, cl=R.cl, st=S.home.station, items=cl.items||[];
  const done=items.filter(it=>answered(it,R.answers[it.id])).length;
  const chargers=st.chargers||[], cps=(st.connectors||[]).filter(c=>!R.charger||c.charger===R.charger);
  view.innerHTML=`<button class="back" id="bk">‹ Abbrechen</button>
  ${timerHTML(R)}
  <div class="card"><div class="lbl">${esc(st.project_id||st.id)}${R.ticket?" · Störung "+esc(R.ticket):""}${R.defect?" · Mangel "+esc(R.defect.defect_no||""):""}</div><h1>${esc(cl.title)}</h1>
    ${R.defect?`<div class="hint" style="margin-top:8px"><span class="prio p${esc(R.defect.priority||"B")}">${esc(R.defect.priority||"B")}</span> <b>${esc(R.defect.item_text)}</b> · ${esc(defWhere(st,R.defect))}${R.defect.note?"<br>"+esc(R.defect.note):""}</div>`:""}${cl.description?`<div class="muted small">${esc(cl.description)}</div>`:""}
    ${cl.scope!=="site"?`<div style="margin-top:14px"><b>Welcher Charger?</b><div class="sel" id="selCh">${chargers.map(c=>`<button data-ch="${c.n}" class="${R.charger===c.n?"on":""}">${esc(c.label||"Charger "+c.n)}</button>`).join("")}</div></div>`:""}
    ${cl.scope==="connector"&&R.charger?`<div style="margin-top:10px"><b>Welcher Ladepunkt?</b><div class="sel" id="selCp">${cps.map(c=>`<button data-cp="${c.n}" class="cpr ${R.connector===c.n?"on":""}"><span>${esc(cpName(st,c.n).split(" · ").pop())} <span class="small muted">${esc(c.t||"")}</span></span>${c.evse?`<code>${esc(c.evse)}</code>`:""}</button>`).join("")}</div></div>`:""}
    <div class="prog"><i style="width:${items.length?done/items.length*100:0}%"></i></div><div class="small muted">${done} von ${items.length} Punkten</div></div>
  <div class="card" id="items">${items.map(it=>itemHTML(it,R.answers[it.id]||{})).join("")}</div>
  <div class="card"><b>Bemerkung (optional)</b><textarea class="f" id="notes" placeholder="z. B. Auffälligkeiten, nächste Schritte, Material">${esc(R.notes)}</textarea>
  </div>
  <div class="card" id="timeCard"><b>⏱ Zeit &amp; Aufwand</b>
    <div class="tsum"><span>Arbeitszeit vor Ort (gemessen)</span><b id="tmGross">${workMin(R)} Min.</b></div>
    <label class="check"><input type="checkbox" id="corrOn" ${R.corrOn?"checked":""}><span>Zeit stimmt nicht – korrigieren</span></label>
    ${R.corrOn?`<div class="grid2" style="margin-top:6px"><label>Tatsächliche Arbeitszeit (Min.)<input class="f" id="corr" inputmode="numeric" value="${esc(R.corr)}" placeholder="${workMin(R)}"></label><label>Begründung *<input class="f" id="timeNote" value="${esc(R.timeNote)}" placeholder="z. B. App erst später geöffnet"></label></div>`:""}
    <div class="grid2" style="margin-top:12px"><label>Anfahrt (Min.)<input class="f" id="travel" inputmode="numeric" value="${esc(R.travel)}" placeholder="0"></label><label>Gefahrene km<input class="f" id="km" inputmode="decimal" value="${esc(R.km)}" placeholder="0"></label></div>
    <div class="grid2" style="margin-top:8px"><label>Material / Ersatzteile<input class="f" id="matText" value="${esc(R.matText)}" placeholder="z. B. Dichtung Typ 2"></label><label>Materialkosten (€)<input class="f" id="matCost" inputmode="decimal" value="${esc(R.matCost)}" placeholder="0,00"></label></div>
    <div class="small muted" style="margin-top:8px">Diese Angaben fließen in die Wirtschaftlichkeits-Auswertung des Betreibers.</div>
  </div>
  <div class="card">
    ${R.ticket&&S.home.me.can_resolve?`<label class="check"><input type="checkbox" id="resolve" ${R.resolve?"checked":""}><span>Störung ${esc(R.ticket)} ist behoben – in der Kunden-App wieder freigeben</span></label>
      ${R.resolve?`<label class="check"><input type="checkbox" id="restOn" ${R.restOn?"checked":""}><span>Es bleibt ein Restmangel (Ladepunkt läuft wieder, aber Arbeit offen – z. B. Ersatzteil bestellt)</span></label>
        ${R.restOn?`<input class="f" id="rest" placeholder="Welcher Restmangel? z. B. Steckergriff provisorisch fixiert, Ersatz bestellt" value="${esc(R.rest)}"><div class="opts" id="restP">${["A","B","C"].map(p=>`<button data-rp="${p}" class="${R.restPrio===p?"on":""}"><span class="prio p${p}">${p}</span> ${PRIO_TXT[p]}</button>`).join("")}</div>`:""}`:""}`:""}
    <div class="err" id="err" style="margin-top:10px"></div>
    <button class="btn" id="send">Protokoll abschließen</button></div>`;
  $("#bk").onclick=()=>{ if(done&&!confirm("Checkliste abbrechen? Eingaben und Zeitmessung gehen verloren.")) return; clearTimer(); S.run=null; homeView(); };
  $("#tmP").onclick=()=>{ keepNotes(); if(R.pausedAt){ R.pauseMs+=Date.now()-Date.parse(R.pausedAt); R.pausedAt=null; } else R.pausedAt=new Date().toISOString(); saveTimer(); const y=scrollY; runView(); scrollTo(0,y); };
  $("#tmInfo").onclick=()=>{ keepNotes(); R.howto=!R.howto; const y=scrollY; runView(); scrollTo(0,y); };
  if($("#resolve")) $("#resolve").onchange=()=>{ keepNotes(); const y=scrollY; runView(); scrollTo(0,y); };
  if($("#restOn")) $("#restOn").onchange=()=>{ keepNotes(); R.restOn=$("#restOn").checked; const y=scrollY; runView(); scrollTo(0,y); };
  view.querySelectorAll("#restP [data-rp]").forEach(b=>b.onclick=()=>{ keepNotes(); R.restPrio=b.dataset.rp; const y=scrollY; runView(); scrollTo(0,y); });
  $("#corrOn").onchange=()=>{ keepNotes(); R.corrOn=$("#corrOn").checked; const y=scrollY; runView(); scrollTo(0,y); };
  view.querySelectorAll("#selCh [data-ch]").forEach(b=>b.onclick=()=>{ R.charger=+b.dataset.ch; R.connector=null; keepNotes(); runView(); });
  view.querySelectorAll("#selCp [data-cp]").forEach(b=>b.onclick=()=>{ R.connector=+b.dataset.cp; keepNotes(); runView(); });
  wireItems(); $("#send").onclick=submit;
}
const keepNotes=()=>{ const R=S.run; if(!R) return; if($("#notes")) R.notes=$("#notes").value; if($("#resolve")) R.resolve=$("#resolve").checked;
  for(const k of ["corr","timeNote","travel","km","matText","matCost","rest"]) if($("#"+k)) R[k]=$("#"+k).value; };
function itemHTML(it,a){
  const q=`<div class="q">${esc(it.text)}${it.required?' <span class="req">*</span>':""}</div>${it.hint?`<div class="hint">💡 ${esc(it.hint)}</div>`:""}`;
  const photo=(label)=>`<div class="photo"><label>📷 ${label}<input type="file" accept="image/*" capture="environment" data-ph="${it.id}"></label>${a.photo?`<img src="${a.photo}" alt="">`:""}</div>`;
  let body="";
  if(it.type==="check") body=`<div class="tri"><button class="ok ${a.ok===true?"on":""}" data-ok="${it.id}">✓ In Ordnung</button><button class="bad ${a.ok===false?"on":""}" data-bad="${it.id}">✗ Mangel</button><button class="na ${a.na?"on":""}" data-na="${it.id}">n. a.</button></div>
    ${a.ok===false?`<textarea class="f" data-note="${it.id}" placeholder="Was ist der Mangel?">${esc(a.note||"")}</textarea>
      <div class="small muted" style="margin-top:8px">Priorität des Mangels</div><div class="opts">${["A","B","C"].map(p=>`<button data-pr="${it.id}" data-p="${p}" class="${(a.prio||it.prio||"B")===p?"on":""}"><span class="prio p${p}">${p}</span> ${PRIO_TXT[p]}</button>`).join("")}</div>
      ${(a.prio||it.prio)==="A"?`<div class="hint" style="margin-top:8px">⚠️ Akute Gefahr oder kann nicht mehr geladen werden? Dann zusätzlich über „Problem melden“ eine <b>Störung</b> anlegen – der Ladepunkt wird gesperrt.</div>`:""}${photo("Foto vom Mangel")}`:""}`;
  else if(it.type==="text") body=`<textarea class="f" data-val="${it.id}">${esc(a.value||"")}</textarea>`;
  else if(it.type==="number") body=`<input class="f" data-val="${it.id}" inputmode="decimal" value="${esc(a.value??"")}">`;
  else if(it.type==="choice") body=`<div class="opts">${(it.options||[]).map(o=>`<button data-choice="${it.id}" data-v="${esc(o)}" class="${a.value===o?"on":""}">${esc(o)}</button>`).join("")}</div>`;
  else if(it.type==="photo") body=photo(a.photo?"Neues Foto":"Foto aufnehmen");
  return `<div class="item" id="it-${it.id}">${q}${body}</div>`;
}
function setA(id,patch){ S.run.answers[id]={...(S.run.answers[id]||{}),...patch}; }
function wireItems(){
  const re=id=>{ keepNotes(); const y=scrollY; runView(); scrollTo(0,y); };
  view.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{ setA(b.dataset.ok,{ok:true,na:false}); re(); });
  view.querySelectorAll("[data-bad]").forEach(b=>b.onclick=()=>{ setA(b.dataset.bad,{ok:false,na:false}); re(); });
  view.querySelectorAll("[data-na]").forEach(b=>b.onclick=()=>{ setA(b.dataset.na,{ok:null,na:true}); re(); });
  view.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{ setA(b.dataset.pr,{prio:b.dataset.p}); re(); });
  view.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{ setA(b.dataset.choice,{value:b.dataset.v}); re(); });
  view.querySelectorAll("[data-val]").forEach(i=>i.oninput=()=>setA(i.dataset.val,{value:i.value}));
  // kein Neuaufbau beim Verlassen des Feldes (sonst geht der nächste Tipp ins Leere) – nur Fortschritt aktualisieren
  const prog=()=>{ const R=S.run, items=R.cl.items||[], n=items.filter(it=>answered(it,R.answers[it.id])).length, bar=view.querySelector(".prog i"), t=view.querySelector(".prog+div");
    if(bar) bar.style.width=(items.length?n/items.length*100:0)+"%"; if(t) t.textContent=`${n} von ${items.length} Punkten`; };
  view.querySelectorAll("[data-val]").forEach(i=>i.addEventListener("input",prog));
  view.querySelectorAll("[data-note]").forEach(i=>i.oninput=()=>setA(i.dataset.note,{note:i.value}));
  view.querySelectorAll("[data-ph]").forEach(i=>i.onchange=async()=>{ const d=await shrink(i.files[0]); if(d){ setA(i.dataset.ph,{photo:d}); re(); } });
}
function shrink(file){ return new Promise(res=>{ if(!file) return res(null); const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.75)); };
  img.onerror=()=>res(null); img.src=u; }); }
async function submit(){
  keepNotes(); const R=S.run, cl=R.cl;
  view.querySelectorAll(".miss").forEach(e=>e.classList.remove("miss"));
  if(cl.scope!=="site"&&!R.charger){ $("#err").textContent="Bitte den Charger auswählen."; $("#selCh").scrollIntoView({block:"center"}); return; }
  if(cl.scope==="connector"&&!R.connector){ $("#err").textContent="Bitte den Ladepunkt auswählen."; $("#selCp").scrollIntoView({block:"center"}); return; }
  const miss=(cl.items||[]).filter(it=>it.required&&!answered(it,R.answers[it.id]));
  if(miss.length){ miss.forEach(it=>$("#it-"+it.id).classList.add("miss")); $("#err").textContent=`Bitte noch ${miss.length} Pflichtpunkt(e) ausfüllen.`; $("#it-"+miss[0].id).scrollIntoView({block:"center"}); return; }
  const num=v=>String(v||"").trim()===""?null:+String(v).replace(",",".");
  const bad=(id,msg)=>{ $("#"+id).classList.add("miss"); $("#err").textContent=msg; $("#"+id).scrollIntoView({block:"center"}); };
  if(R.resolve&&R.restOn&&!String(R.rest).trim()) return bad("rest","Bitte den Restmangel kurz beschreiben.");
  if(R.corrOn&&String(R.corr).trim()!==""){ const c=num(R.corr); if(!Number.isFinite(c)||c<0||c>1440) return bad("corr","Arbeitszeit bitte in Minuten (0–1440).");
    if(c!==workMin(R)&&!String(R.timeNote).trim()) return bad("timeNote","Bitte begründen, warum die Zeit korrigiert wird."); }
  for(const [k,max,lbl] of [["travel",1440,"Anfahrt"],["km",5000,"km"],["matCost",100000,"Materialkosten"]]){ const v=num(R[k]); if(v!=null&&(!Number.isFinite(v)||v<0||v>max)) return bad(k,lbl+": bitte eine gültige Zahl eingeben."); }
  if(R.pausedAt){ R.pauseMs+=Date.now()-Date.parse(R.pausedAt); R.pausedAt=null; saveTimer(); }
  const b=$("#send"); b.disabled=true; b.textContent="Wird gespeichert …";
  try{
    const r=await api("submit",{checklist_id:cl.id,charger:R.charger,connector:R.connector,ticket_no:R.ticket,resolve:R.resolve,notes:R.notes,started_at:R.started,
      pause_minutes:Math.round(R.pauseMs/60000),work_minutes_corrected:R.corrOn?num(R.corr):null,time_note:R.corrOn?R.timeNote:null,
      travel_minutes:num(R.travel),km:num(R.km),material_text:R.matText,material_cost:num(R.matCost),
      defect_id:R.defect?R.defect.id:null,rest:R.resolve&&R.restOn&&String(R.rest).trim()?{text:String(R.rest).trim(),priority:R.restPrio}:null,
      answers:Object.entries(R.answers).map(([id,a])=>({id,...a}))});
    clearTimer(); doneView(r);
  }catch(e){ b.disabled=false; b.textContent="Protokoll abschließen"; $("#err").textContent=e.message; }
}
function doneView(r){
  const cl=S.run.cl; scrollTo(0,0);
  view.innerHTML=`<div class="card center"><div class="big">${r.result==="ok"?"✅":"⚠️"}</div><h1>Protokoll gespeichert</h1>
    <div class="no">${esc(r.report_no)}</div>
    ${r.defect_resolved?`<p style="color:#08603d;font-weight:700">Mangel ${esc(S.run.defect&&S.run.defect.defect_no||"")} aktualisiert.</p>`:""}
    ${r.work_minutes!=null?`<div class="card" style="text-align:left;margin:10px 0"><div class="tsum"><span>Arbeitszeit vor Ort</span><b>${hm(r.work_minutes)}</b></div>${r.measured_minutes!==r.work_minutes?`<div class="tsum"><span>davon gemessen</span><span>${hm(r.measured_minutes)} (korrigiert)</span></div>`:""}${r.pause_minutes?`<div class="tsum"><span>Pausen abgezogen</span><span>${r.pause_minutes} Min.</span></div>`:""}${r.travel_minutes?`<div class="tsum"><span>Anfahrt</span><span>${r.travel_minutes} Min.</span></div>`:""}</div>`:""}
    <p class="muted">${esc(cl.title)} · ${r.result==="ok"?"ohne Mängel":r.defects+" Mangel/Mängel – das Team wurde informiert."}${r.resolved?"<br><b style=\"color:#08603d\">Störung erledigt – der Ladepunkt ist in der Kunden-App wieder frei.</b>":""}</p>
    <button class="btn" id="home">Zurück zum Standort</button></div>`;
  $("#home").onclick=homeView;
}

if(S.auth) (station?homeView():projectsView()); else loginView();
</script>
</body>
